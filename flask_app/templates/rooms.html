{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-2 fade-in">
    <h2 class="fw-bold mb-0"><i class="fas fa-bed text-primary me-2"></i> Room Management</h2>
</div>

<ul class="nav luxury-tabs fade-in" style="animation-delay: 0.1s;">
    <li class="nav-item">
        <a class="nav-link active" data-bs-toggle="tab" href="#rooms">
            <i class="fas fa-door-closed me-2"></i>Rooms
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" href="#roomTypes">
            <i class="fas fa-tags me-2"></i>Room Types
        </a>
    </li>
</ul>

<div class="tab-content fade-in" style="animation-delay: 0.2s;">
    
    <!-- ROOMS TAB -->
    <div class="tab-pane active" id="rooms">
        <div class="filter-bar">
            <div class="row align-items-end g-3">
                <div class="col-md-3">
                    <label for="roomSearchInput" class="fw-bold text-muted mb-1"><i class="fas fa-search me-1"></i> Search Rooms</label>
                    <input type="text" id="roomSearchInput" class="form-control shadow-sm" placeholder="Room number or type...">
                </div>
                <div class="col-md-2">
                    <label for="roomStatusFilter" class="fw-bold text-muted mb-1"><i class="fas fa-filter me-1"></i> Status</label>
                    <select id="roomStatusFilter" class="form-select shadow-sm">
                        <option value="all">All Status</option>
                        <option value="available">Available</option>
                        <option value="booked">Booked</option>
                        <option value="maintenance">Maintenance</option>
                        <option value="cleaning">Cleaning</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="floorFilter" class="fw-bold text-muted mb-1"><i class="fas fa-layer-group me-1"></i> Floor</label>
                    <select id="floorFilter" class="form-select shadow-sm">
                        <option value="all">All Floors</option>
                        <option value="1">Floor 1</option>
                        <option value="2">Floor 2</option>
                        <option value="3">Floor 3</option>
                        <option value="4">Floor 4</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="fw-bold d-block mb-1">&nbsp;</label>
                    <button class="btn btn-outline-primary w-100 fw-bold shadow-sm" onclick="toggleRoomSort()" id="roomSortBtn">
                        <i class="fas fa-sort me-1"></i> <span id="roomSortLabel">Status Order</span>
                    </button>
                </div>
                <div class="col-md-3">
                    <label class="fw-bold d-block mb-1">&nbsp;</label>
                    <div class="d-flex gap-2">
                        <button class="btn btn-secondary flex-grow-1 fw-bold shadow-sm" onclick="resetRoomFilters()">
                            <i class="fas fa-undo me-1"></i> Reset
                        </button>
                        <button class="btn btn-primary flex-grow-1 fw-bold shadow-sm" onclick="showAddRoomModal()">
                            <i class="fas fa-plus me-1"></i> Add Room
                        </button>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-12">
                    <small class="text-muted fw-bold border-start border-3 border-primary ps-2" id="roomResultCount">Loading rooms...</small>
                </div>
            </div>
        </div>
        
        <div class="row g-4" id="roomsGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-muted fw-bold">Loading rooms...</p>
            </div>
        </div>
    </div>
    
    <!-- ROOM TYPES TAB -->
    <div class="tab-pane" id="roomTypes">
        <div class="filter-bar">
            <div class="row align-items-end g-3">
                <div class="col-md-4">
                    <label for="roomTypeSearchInput" class="fw-bold text-muted mb-1"><i class="fas fa-search me-1"></i> Search Types</label>
                    <input type="text" id="roomTypeSearchInput" class="form-control shadow-sm" placeholder="Type name...">
                </div>
                <div class="col-md-3">
                    <label for="priceFilter" class="fw-bold text-muted mb-1"><i class="fas fa-peso-sign me-1"></i> Price Range</label>
                    <select id="priceFilter" class="form-select shadow-sm">
                        <option value="all">All Prices</option>
                        <option value="under100">Under ₱100</option>
                        <option value="100to200">₱100 - ₱200</option>
                        <option value="200to300">₱200 - ₱300</option>
                        <option value="over300">Over ₱300</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="fw-bold d-block mb-1">&nbsp;</label>
                    <button class="btn btn-outline-primary w-100 fw-bold shadow-sm" onclick="toggleTypeSort()" id="typeSortBtn">
                        <i class="fas fa-sort-amount-down me-1"></i> <span id="typeSortLabel">Low to High</span>
                    </button>
                </div>
                <div class="col-md-3">
                    <label class="fw-bold d-block mb-1">&nbsp;</label>
                    <div class="d-flex gap-2">
                        <button class="btn btn-secondary flex-grow-1 fw-bold shadow-sm" onclick="resetRoomTypeFilters()">
                            <i class="fas fa-undo me-1"></i> Reset
                        </button>
                        <button class="btn btn-primary flex-grow-1 fw-bold shadow-sm" onclick="ModalManager.showRoomTypeModal()">
                            <i class="fas fa-plus me-1"></i> Add Type
                        </button>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-12">
                    <small class="text-muted fw-bold border-start border-3 border-primary ps-2" id="roomTypeResultCount">Loading room types...</small>
                </div>
            </div>
        </div>
        
        <div class="table-responsive shadow-sm" style="border-radius: 16px;">
            <table class="table table-bordered table-hover mb-0">
                <thead style="background: linear-gradient(135deg, #1a2744 0%, #243356 100%);">
                    <tr>
                        <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">ID</th>
                        <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Type</th>
                        <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Price/Night</th>
                        <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Capacity</th>
                        <th class="py-3 text-white text-center" style="border-bottom: 2px solid #c9a84c;">Actions</th>
                    </tr>
                </thead>
                <tbody id="roomTypesTable">
                    <tr>
                        <td colspan="5" class="text-center py-5">
                            <div class="spinner-border text-primary mb-3" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="text-muted fw-bold">Loading room types...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function() {
    function waitForjQuery() {
        if (typeof jQuery !== 'undefined') {
            console.log("✅ jQuery loaded, initializing rooms page...");
            initRoomsPage();
        } else {
            setTimeout(waitForjQuery, 100);
        }
    }
    
    function initRoomsPage() {
        jQuery(document).ready(function($) {
            loadRooms();
            loadRoomTypes();
            loadRoomTypeSelect();
            
            $('#roomSearchInput').on('keyup', function() { filterRooms(); });
            $('#roomStatusFilter').on('change', function() { filterRooms(); });
            $('#floorFilter').on('change', function() { filterRooms(); });
            
            $('#roomTypeSearchInput').on('keyup', function() { filterRoomTypes(); });
            $('#priceFilter').on('change', function() { filterRoomTypes(); });
        });
    }
    
    waitForjQuery();
})();

var allRooms = [];
var allRoomTypes = [];
var roomSortOrder = 0;
var typeSortAscending = true;

function toggleRoomSort() {
    roomSortOrder = (roomSortOrder + 1) % 5;
    const labels = ['Status Order', 'Price: Low to High', 'Price: High to Low', 'Room #: A to Z', 'Room #: Z to A'];
    const icons = ['fa-sort', 'fa-sort-amount-down', 'fa-sort-amount-up', 'fa-sort-alpha-down', 'fa-sort-alpha-up'];
    $('#roomSortLabel').text(labels[roomSortOrder]);
    $('#roomSortBtn i').attr('class', 'fas ' + icons[roomSortOrder] + ' me-1');
    filterRooms();
}

function toggleTypeSort() {
    typeSortAscending = !typeSortAscending;
    $('#typeSortLabel').text(typeSortAscending ? 'Low to High' : 'High to Low');
    $('#typeSortBtn i').toggleClass('fa-sort-amount-down fa-sort-amount-up');
    filterRoomTypes();
}

function loadRooms() {
    jQuery.ajax({
        url: '/api/rooms/list',
        method: 'GET',
        success: function(data) {
            allRooms = data;
            filterRooms();
        },
        error: function(xhr, status, error) {
            document.getElementById('roomsGrid').innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                    <h5 class="fw-bold">Error loading rooms</h5>
                </div>
            `;
        }
    });
}

function loadRoomTypeSelect() {
    jQuery.ajax({
        url: '/api/rooms/types/list',
        method: 'GET',
        success: function(data) {
            var select = $('#type_id');
            if (select.length) {
                select.empty();
                select.append('<option value="">Select Type</option>');
                data.forEach(function(type) {
                    select.append(`<option value="${type.type_id}">${escapeHtml(type.type_name)} - ${window.formatPHP(type.base_price)}</option>`);
                });
            }
        }
    });
}

function filterRooms() {
    var searchTerm = $('#roomSearchInput').val().toLowerCase();
    var statusFilter = $('#roomStatusFilter').val();
    var floorFilter = $('#floorFilter').val();
    
    var filtered = allRooms.filter(function(room) {
        if (searchTerm) {
            var roomMatch = room.room_number.toLowerCase().includes(searchTerm);
            var typeMatch = (room.type_name || '').toLowerCase().includes(searchTerm);
            if (!roomMatch && !typeMatch) return false;
        }
        
        if (statusFilter !== 'all' && room.status !== statusFilter) return false;
        if (floorFilter !== 'all' && room.floor != floorFilter) return false;
        
        return true;
    });
    
    const statusOrder = { 
        'available': 1, 
        'booked': 2, 
        'cleaning': 3, 
        'maintenance': 4 
    };
    
    switch(roomSortOrder) {
        case 0:
            filtered.sort(function(a, b) {
                var statusA = statusOrder[a.status] !== undefined ? statusOrder[a.status] : 99;
                var statusB = statusOrder[b.status] !== undefined ? statusOrder[b.status] : 99;
                if (statusA !== statusB) return statusA - statusB;
                return a.room_number.localeCompare(b.room_number, undefined, {numeric: true});
            });
            break;
        case 1:
            filtered.sort(function(a, b) {
                return (parseFloat(a.base_price) || 0) - (parseFloat(b.base_price) || 0);
            });
            break;
        case 2:
            filtered.sort(function(a, b) {
                return (parseFloat(b.base_price) || 0) - (parseFloat(a.base_price) || 0);
            });
            break;
        case 3:
            filtered.sort(function(a, b) {
                return a.room_number.localeCompare(b.room_number, undefined, {numeric: true});
            });
            break;
        case 4:
            filtered.sort(function(a, b) {
                return b.room_number.localeCompare(a.room_number, undefined, {numeric: true});
            });
            break;
    }
    
    displayRooms(filtered);
    
    var resultText = filtered.length === allRooms.length ? 
        'Showing all ' + filtered.length + ' rooms' : 
        'Showing ' + filtered.length + ' of ' + allRooms.length + ' rooms';
    $('#roomResultCount').text(resultText);
}

function displayRooms(rooms) {
    let html = '';
    
    if (!rooms || rooms.length === 0) {
        html = '<div class="col-12 text-center py-5"><i class="fas fa-search fa-3x text-muted opacity-50 mb-3"></i><h5 class="text-muted fw-bold">No rooms match your filters.</h5></div>';
    } else {
        var searchTerm = $('#roomSearchInput').val().toLowerCase();
        
        rooms.forEach(function(room) {
            let statusColorVar = '';
            let statusText = '';
            let statusClass = '';
            
            switch(room.status) {
                case 'available': 
                    statusColorVar = '#2d6a4f'; 
                    statusText = 'Available';
                    statusClass = 'status-available';
                    break;
                case 'booked': 
                    statusColorVar = '#8b3a3a'; 
                    statusText = 'Booked';
                    statusClass = 'status-booked';
                    break;
                case 'maintenance': 
                    statusColorVar = '#b8860b'; 
                    statusText = 'Maintenance';
                    statusClass = 'status-maintenance';
                    break;
                case 'cleaning': 
                    statusColorVar = '#6c757d'; 
                    statusText = 'Cleaning';
                    statusClass = 'status-cleaning';
                    break;
                default: 
                    statusColorVar = '#64748b';
                    statusText = room.status || 'Unknown';
                    statusClass = 'bg-secondary text-white';
            }
            
            var roomImage = room.image_path || '/static/uploads/rooms/default-room.jpg';
            
            var displayRoomNumber = escapeHtml(room.room_number);
            var displayTypeName = escapeHtml(room.type_name);
            if (searchTerm) {
                var regex = new RegExp('(' + escapeRegex(searchTerm) + ')', 'gi');
                displayRoomNumber = displayRoomNumber.replace(regex, '<span class="search-highlight">$1</span>');
                displayTypeName = displayTypeName.replace(regex, '<span class="search-highlight">$1</span>');
            }
            
            html += `
                <div class="col-md-4 col-lg-3 fade-in">
                    <div class="admin-room-card shadow-sm" style="border-top: 4px solid ${statusColorVar}; border-radius: 16px; overflow: hidden; background: white; transition: all 0.3s ease;">
                        <div class="room-image-container" style="height: 200px; overflow: hidden;">
                            <img src="${roomImage}" alt="Room ${room.room_number}" 
                                 style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;"
                                 onerror="this.src='/static/uploads/rooms/default-room.jpg'">
                        </div>
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="fw-bold mb-0 text-dark">Room ${displayRoomNumber}</h5>
                                <span class="room-status-badge ${statusClass} shadow-sm" style="font-size: 0.7rem; padding: 0.3rem 0.7rem; border-radius: 20px; font-weight: 600;">${statusText}</span>
                            </div>
                            
                            <p class="text-primary fw-bold mb-2" style="font-size: 0.9rem;">${displayTypeName}</p>
                            
                            <div class="mb-3">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-muted small"><i class="fas fa-layer-group me-1"></i>Floor ${room.floor}</span>
                                    <span class="text-muted small"><i class="fas fa-users me-1"></i>${room.capacity} pax</span>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted small"><i class="fas fa-tag me-1"></i>Price</span>
                                    <strong class="text-success">${window.formatPHP(room.base_price)}/nt</strong>
                                </div>
                            </div>
                            
                            <div class="d-flex gap-2">
                                ${room.status === 'available' ? 
                                    `<button class="btn btn-primary btn-sm flex-grow-1" onclick="bookRoom(${room.room_id})">
                                        <i class="fas fa-calendar-plus me-1"></i> Book
                                    </button>` : 
                                    `<button class="btn btn-secondary btn-sm flex-grow-1" disabled>
                                        <i class="fas fa-ban me-1"></i> Unavailable
                                    </button>`
                                }
                                <button class="btn btn-outline-warning btn-sm" onclick="editRoom(${room.room_id})" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteRoom(${room.room_id})" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }
    
    document.getElementById('roomsGrid').innerHTML = html;
}

function escapeRegex(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function resetRoomFilters() {
    $('#roomSearchInput').val('');
    $('#roomStatusFilter').val('all');
    $('#floorFilter').val('all');
    roomSortOrder = 0;
    $('#roomSortLabel').text('Status Order');
    $('#roomSortBtn i').attr('class', 'fas fa-sort me-1');
    filterRooms();
}

function showAddRoomModal() {
    loadRoomTypeSelect();
    createRoomModal(null);
}

function editRoom(roomId) {
    jQuery.ajax({
        url: `/api/rooms/get/${roomId}`,
        method: 'GET',
        success: function(data) {
            createRoomModal(data);
        },
        error: function(xhr) {
            showNotification('Error loading room details', 'error');
        }
    });
}

function createRoomModal(roomData) {
    var isEdit = roomData !== null;
    var roomId = isEdit ? roomData.room_id : '';
    var roomNumber = isEdit ? escapeHtml(roomData.room_number) : '';
    var floor = isEdit ? roomData.floor : '';
    var typeId = isEdit ? roomData.type_id : '';
    var status = isEdit ? roomData.status : 'available';
    var imagePath = isEdit && roomData.image_path ? roomData.image_path : '';
    
    jQuery.ajax({
        url: '/api/rooms/types/list',
        method: 'GET',
        async: false,
        success: function(types) {
            var typeOptions = '<option value="">-- Select Room Type --</option>';
            types.forEach(function(type) {
                var selected = (typeId == type.type_id) ? 'selected' : '';
                typeOptions += `<option value="${type.type_id}" ${selected}>${escapeHtml(type.type_name)} - ${window.formatPHP(type.base_price)}/night</option>`;
            });
            
            var imageHtml = '';
            if (imagePath) {
                imageHtml = `
                    <div id="currentImagePreview" class="mb-3">
                        <div class="position-relative d-inline-block">
                            <img src="${imagePath}" alt="Room Image" style="width: 100px; height: 100px; object-fit: cover; border-radius: 12px; border: 2px solid #c9a84c;">
                            <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 rounded-circle" onclick="removeCurrentImageFromModal()" style="transform: translate(30%, -30%);">&times;</button>
                        </div>
                    </div>
                `;
            }
            
            var modalHtml = `
                <div class="modal fade grand-modal" id="roomModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-lg modal-dialog-centered">
                        <div class="modal-content" style="border-radius: 20px; background: white;">
                            <div class="modal-header" style="background: linear-gradient(135deg, #1a2744, #243356); border-radius: 20px 20px 0 0;">
                                <h5 class="modal-title text-white fw-bold">
                                    <i class="fas fa-door-closed me-2" style="color: #c9a84c;"></i>
                                    ${isEdit ? 'Edit Room' : 'Add New Room'}
                                </h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <form id="roomForm" enctype="multipart/form-data">
                                <div class="modal-body p-4">
                                    <input type="hidden" id="room_id" name="room_id" value="${roomId}">
                                    <input type="hidden" id="remove_image_flag" name="remove_image" value="">
                                    
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Room Number <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="room_number" name="room_number" value="${roomNumber}" required placeholder="e.g., 101">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Floor <span class="text-danger">*</span></label>
                                            <select class="form-select" id="floor" name="floor" required>
                                                <option value="">Select Floor</option>
                                                <option value="1" ${floor == 1 ? 'selected' : ''}>Floor 1</option>
                                                <option value="2" ${floor == 2 ? 'selected' : ''}>Floor 2</option>
                                                <option value="3" ${floor == 3 ? 'selected' : ''}>Floor 3</option>
                                                <option value="4" ${floor == 4 ? 'selected' : ''}>Floor 4</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="row g-3 mt-1">
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Room Type <span class="text-danger">*</span></label>
                                            <select class="form-select" id="type_id" name="type_id" required>
                                                ${typeOptions}
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label fw-bold">Status</label>
                                            <select class="form-select" id="status" name="status">
                                                <option value="available" ${status == 'available' ? 'selected' : ''}>✅ Available</option>
                                                <option value="booked" ${status == 'booked' ? 'selected' : ''}>📅 Booked</option>
                                                <option value="cleaning" ${status == 'cleaning' ? 'selected' : ''}>🧹 Cleaning</option>
                                                <option value="maintenance" ${status == 'maintenance' ? 'selected' : ''}>🔧 Maintenance</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="mt-4">
                                        <label class="form-label fw-bold"><i class="fas fa-image me-2"></i>Room Image</label>
                                        ${imageHtml}
                                        <div id="newImageContainer">
                                            <input type="file" class="form-control" id="room_image" name="room_image" accept="image/jpeg,image/png,image/gif,image/webp">
                                        </div>
                                        <small class="text-muted mt-2 d-block"><i class="fas fa-info-circle me-1"></i> Accepted formats: JPG, PNG, GIF, WEBP. Max size: 5MB</small>
                                    </div>
                                </div>
                                <div class="modal-footer" style="background: #f8f9fa; border-radius: 0 0 20px 20px;">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-primary">Save Room</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            
            $('#roomModal').remove();
            $('body').append(modalHtml);
            
            $('#roomForm').on('submit', function(e) {
                e.preventDefault();
                saveRoomDynamic();
            });
            
            $('#roomModal').modal('show');
            
            $('#roomModal').on('hidden.bs.modal', function() {
                $('#roomModal').remove();
                $('.modal-backdrop').remove();
                $('body').removeClass('modal-open');
                $('body').css('overflow', '');
            });
        }
    });
}

function saveRoomDynamic() {
    var formData = new FormData($('#roomForm')[0]);
    
    var submitBtn = $('#roomForm button[type="submit"]');
    var originalText = submitBtn.html();
    submitBtn.html('<i class="fas fa-spinner fa-spin me-1"></i> Saving...').prop('disabled', true);
    
    jQuery.ajax({
        url: '/api/rooms/save',
        method: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function(response) {
            if(response.success) {
                $('#roomModal').modal('hide');
                showNotification('Room saved successfully!', 'success');
                loadRooms();
            } else {
                showNotification(response.message || 'Error saving room', 'error');
            }
        },
        error: function(xhr) {
            showNotification('Error saving room', 'error');
        },
        complete: function() {
            submitBtn.html(originalText).prop('disabled', false);
        }
    });
}

function removeCurrentImageFromModal() {
    $('#remove_image_flag').val('1');
    $('#currentImagePreview').remove();
}

function deleteRoom(roomId) {
    if(confirm('⚠️ Are you sure you want to delete this room?\nThis action cannot be undone.')) {
        jQuery.ajax({
            url: `/api/rooms/delete/${roomId}`,
            method: 'DELETE',
            success: function(response) {
                if(response.success) {
                    showNotification('Room deleted successfully!', 'success');
                    loadRooms();
                } else {
                    alert('Error: ' + (response.message || 'Could not delete'));
                }
            },
            error: function(xhr) {
                alert("Error deleting room");
            }
        });
    }
}

function bookRoom(roomId) {
    if (typeof ModalManager !== 'undefined' && ModalManager.showBookingModal) {
        ModalManager.showBookingModal(roomId);
    } else {
        alert("Booking system is initializing. Please refresh the page.");
    }
}

// ============ ROOM TYPES FUNCTIONS ============

function loadRoomTypes() {
    jQuery.ajax({
        url: '/api/rooms/types/list',
        method: 'GET',
        success: function(data) {
            allRoomTypes = data;
            filterRoomTypes();
        },
        error: function() {
            document.getElementById('roomTypesTable').innerHTML = `
                <tr><td colspan="5" class="text-center text-danger py-4 fw-bold">
                    <i class="fas fa-exclamation-triangle me-2"></i>Error loading room types
                </td></tr>
            `;
        }
    });
}

function filterRoomTypes() {
    var searchTerm = $('#roomTypeSearchInput').val().toLowerCase();
    var priceFilter = $('#priceFilter').val();
    
    var filtered = allRoomTypes.filter(function(type) {
        if (searchTerm && !type.type_name.toLowerCase().includes(searchTerm)) return false;
        
        var price = parseFloat(type.base_price) || 0;
        if (priceFilter === 'under100' && price >= 100) return false;
        if (priceFilter === '100to200' && (price < 100 || price > 200)) return false;
        if (priceFilter === '200to300' && (price < 200 || price > 300)) return false;
        if (priceFilter === 'over300' && price <= 300) return false;
        
        return true;
    });
    
    filtered.sort(function(a, b) {
        var priceA = parseFloat(a.base_price) || 0;
        var priceB = parseFloat(b.base_price) || 0;
        return typeSortAscending ? priceA - priceB : priceB - priceA;
    });
    
    displayRoomTypes(filtered);
    
    var resultText = filtered.length === allRoomTypes.length ? 
        'Showing all ' + filtered.length + ' room types' : 
        'Showing ' + filtered.length + ' of ' + allRoomTypes.length + ' room types';
    $('#roomTypeResultCount').text(resultText);
}

function displayRoomTypes(roomTypes) {
    let html = '';
    var searchTerm = $('#roomTypeSearchInput').val().toLowerCase();
    
    if (!roomTypes || roomTypes.length === 0) {
        html = '<tr><td colspan="5" class="text-center text-muted py-5 fw-bold"><i class="fas fa-search fa-2x mb-3 d-block opacity-50"></i>No room types found.</td></tr>';
    } else {
        roomTypes.forEach(function(type) {
            var displayName = escapeHtml(type.type_name);
            
            if (searchTerm) {
                var regex = new RegExp('(' + escapeRegex(searchTerm) + ')', 'gi');
                displayName = displayName.replace(regex, '<span class="search-highlight">$1</span>');
            }
            
            html += `
                <tr class="fade-in">
                    <td class="align-middle fw-bold text-muted">#${type.type_id}</td>
                    <td class="align-middle fw-bold text-primary">${displayName}</td>
                    <td class="align-middle fw-bold text-success">${window.formatPHP(type.base_price)}</td>
                    <td class="align-middle"><i class="fas fa-users text-muted me-1"></i> ${type.capacity} Pax</td>
                    <td class="align-middle text-center">
                        <div class="btn-group shadow-sm">
                            <button class="btn btn-sm btn-warning px-3" onclick="editRoomType(${type.type_id})" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger px-3" onclick="deleteRoomType(${type.type_id})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }
    
    document.getElementById('roomTypesTable').innerHTML = html;
}

function resetRoomTypeFilters() {
    $('#roomTypeSearchInput').val('');
    $('#priceFilter').val('all');
    typeSortAscending = true;
    $('#typeSortLabel').text('Low to High');
    $('#typeSortBtn i').attr('class', 'fas fa-sort-amount-down me-1');
    filterRoomTypes();
}

function editRoomType(typeId) {
    jQuery.ajax({
        url: `/api/rooms/types/get/${typeId}`,
        method: 'GET',
        success: function(data) {
            if (typeof ModalManager !== 'undefined' && ModalManager.showRoomTypeModal) {
                ModalManager.showRoomTypeModal(data);
            } else {
                alert("Modal manager not available. Please refresh.");
            }
        },
        error: function() {
            alert("Error loading room type details");
        }
    });
}

function deleteRoomType(typeId) {
    if(confirm('⚠️ Are you sure you want to delete this room type?\nThis action cannot be undone.')) {
        jQuery.ajax({
            url: `/api/rooms/types/delete/${typeId}`,
            method: 'DELETE',
            success: function(response) {
                if(response.success) {
                    showNotification('Room type deleted successfully!', 'success');
                    loadRoomTypes();
                    loadRoomTypeSelect();
                } else {
                    alert('Error: ' + (response.message || 'Could not delete'));
                }
            },
            error: function() {
                alert("Error deleting room type");
            }
        });
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showNotification(message, type) {
    if (typeof window.showNotification === 'function') {
        window.showNotification(message, type);
    } else {
        alert(message);
    }
}
</script>
