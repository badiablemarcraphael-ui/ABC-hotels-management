<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Grand Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=17">
</head>
<body class="auth-page-body">

    <div class="payment-status-card">
        <div class="status-icon-wrapper success shadow-sm">
            <i class="fas fa-check fa-4x"></i>
        </div>
        
        <h2 class="text-success fw-bold mb-1">Payment Successful!</h2>
        <p class="text-muted fw-bold mb-4">Your booking has been confirmed.</p>
        
        <div class="p-3 mb-4 rounded-3 shadow-sm" style="background: rgba(14, 165, 233, 0.05); border: 1px dashed var(--secondary);">
            <p class="mb-0 fw-bold text-dark text-uppercase" style="letter-spacing: 1px;"><i class="fas fa-ticket-alt text-primary me-2"></i> Ticket #{{ ticket_number }}</p>
        </div>
        
        <div class="alert alert-success border-0 shadow-sm fw-bold text-start" id="downloadStatus" style="background: rgba(16, 185, 129, 0.1); color: var(--success); border-radius: 12px;">
            <i class="fas fa-download me-2"></i> Your ticket is downloading...
        </div>
        
        <div class="mt-4 pt-3 border-top">
            <p class="text-muted fw-bold mb-4 d-flex align-items-center justify-content-center">
                <span class="spinner-border spinner-border-sm text-success me-2" role="status"></span>
                Redirecting to dashboard in <span id="countdown" class="mx-1 fs-5 text-primary">5</span> seconds...
            </p>
        </div>
        
        <a href="/dashboard" class="btn w-100 fw-bold shadow-sm text-white" id="dashboardLink" style="background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%); border-radius: 30px; padding: 12px; transition: transform 0.2s;">
            <i class="fas fa-home me-2"></i> Go to Dashboard Now
        </a>
    </div>
    
    <script>
        // Add a tiny hover effect to the button
        document.getElementById('dashboardLink').addEventListener('mouseenter', function() { this.style.transform = 'translateY(-2px)'; });
        document.getElementById('dashboardLink').addEventListener('mouseleave', function() { this.style.transform = 'translateY(0)'; });

        var countdown = 5;
        var countdownElement = document.getElementById('countdown');
        var dashboardLink = document.getElementById('dashboardLink');
        
        // Trigger PDF download
        function downloadPDF() {
            fetch('{{ pdf_url }}')
                .then(function(response) {
                    return response.blob();
                })
                .then(function(blob) {
                    var url = window.URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = '{{ download_name }}';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    
                    document.getElementById('downloadStatus').innerHTML = '<i class="fas fa-check-circle me-2"></i> Download complete!';
                })
                .catch(function(error) {
                    console.error('Download error:', error);
                    document.getElementById('downloadStatus').innerHTML = '<i class="fas fa-exclamation-circle me-2"></i> Download failed, but booking is confirmed.';
                    document.getElementById('downloadStatus').classList.replace('alert-success', 'alert-warning');
                    document.getElementById('downloadStatus').style.color = 'var(--warning)';
                });
        }
        
        // Start countdown and redirect
        var timer = setInterval(function() {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = '/dashboard';
            }
        }, 1000);
        
        // Start download when page loads
        document.addEventListener('DOMContentLoaded', function() {
            downloadPDF();
        });
        
        // Prevent accidental navigation before download
        dashboardLink.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '/dashboard';
        });
    </script>
</body>
</html>
