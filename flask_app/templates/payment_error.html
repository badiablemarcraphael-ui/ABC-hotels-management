<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Error - Grand Hotel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=15">
</head>
<body class="auth-page-body">

    <div class="payment-status-card">
        <div class="status-icon-wrapper error">
            <i class="fas fa-times fa-4x"></i>
        </div>
        
        <h2 class="fw-bold mb-3 text-dark">Payment Failed</h2>
        
        <div class="alert alert-danger border-0 shadow-sm mb-4" style="background: rgba(239, 68, 68, 0.1); color: var(--danger);">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <strong>{{ error }}</strong>
        </div>
        
        <p class="text-muted mb-4 fw-bold">Don't worry, no charges were made to your account. You can try a different payment method or return to your dashboard.</p>
        
        <div class="d-flex flex-column gap-3">
            <a href="/api/payments/checkout/{{ booking_id }}" class="btn btn-danger btn-lg shadow-sm fw-bold rounded-pill">
                <i class="fas fa-redo-alt me-2"></i> Try Payment Again
            </a>
            <a href="/dashboard" class="btn btn-outline-secondary rounded-pill fw-bold">
                <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
