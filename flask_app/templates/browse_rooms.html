{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 fade-in">
    <h2 class="fw-bold mb-0"><i class="fas fa-search text-primary me-2"></i> Browse Rooms</h2>
    <a href="/dashboard" class="btn btn-outline-primary shadow-sm fw-bold rounded-pill">
        <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
    </a>
</div>

<div class="filter-bar fade-in" style="animation-delay: 0.1s;">
    <div class="row align-items-end g-3">
        <div class="col-md-4">
            <label for="searchRooms" class="fw-bold text-muted mb-1"><i class="fas fa-search me-1"></i> Search</label>
            <input type="text" id="searchRooms" class="form-control shadow-sm" placeholder="Search by room number or type...">
        </div>
        <div class="col-md-3">
            <label for="priceFilterBrowse" class="fw-bold text-muted mb-1"><i class="fas fa-peso-sign me-1"></i> Price Range</label>
            <select id="priceFilterBrowse" class="form-select shadow-sm">
                <option value="all">All Prices</option>
                <option value="under100">Under ₱100</option>
                <option value="100to200">₱100 - ₱200</option>
                <option value="200to300">₱200 - ₱300</option>
                <option value="over300">Over ₱300</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="floorFilterBrowse" class="fw-bold text-muted mb-1"><i class="fas fa-layer-group me-1"></i> Floor</label>
            <select id="floorFilterBrowse" class="form-select shadow-sm">
                <option value="all">All Floors</option>
                <option value="1">Floor 1</option>
                <option value="2">Floor 2</option>
                <option value="3">Floor 3</option>
                <option value="4">Floor 4</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="fw-bold d-block mb-1">&nbsp;</label>
            <button class="btn btn-secondary w-100 fw-bold shadow-sm" onclick="resetBrowseFilters()">
                <i class="fas fa-undo me-1"></i> Reset
            </button>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-12">
            <small class="text-muted fw-bold border-start border-3 border-primary ps-2" id="browseResultCount">Loading rooms...</small>
        </div>
    </div>
</div>

<div class="row g-4 fade-in" style="animation-delay: 0.2s;" id="browseRoomsGrid">
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p class="text-muted fw-bold">Loading available rooms...</p>
    </div>
</div>

<script>
var allBrowseRooms = [];

(function() {
    function waitForjQuery() {
        if (typeof jQuery !== 'undefined') {
            loadBrowseRooms();
            $('#searchRooms').on('keyup', filterBrowseRooms);
            $('#priceFilterBrowse').on('change', filterBrowseRooms);
            $('#floorFilterBrowse').on('change', filterBrowseRooms);
        } else { setTimeout(waitForjQuery, 100); }
    }
    waitForjQuery();
})();

function loadBrowseRooms() {
    jQuery.ajax({
        url: '/api/rooms/available',
        method: 'GET',
        success: function(data) {
            allBrowseRooms = data;
            filterBrowseRooms();
        },
        error: function() {
            $('#browseRoomsGrid').html('<div class="col-12 text-center py-5 text-danger"><i class="fas fa-exclamation-triangle fa-3x mb-3"></i><h5>Error loading rooms.</h5></div>');
        }
    });
}

function filterBrowseRooms() {
    var search = $('#searchRooms').val().toLowerCase();
    var priceFilter = $('#priceFilterBrowse').val();
    var floorFilter = $('#floorFilterBrowse').val();
    
    var filtered = allBrowseRooms.filter(function(room) {
        if (search && !room.room_number.toLowerCase().includes(search) && !(room.type_name || '').toLowerCase().includes(search)) return false;
        var price = parseFloat(room.base_price) || 0;
        if (priceFilter === 'under100' && price >= 100) return false;
        if (priceFilter === '100to200' && (price < 100 || price > 200)) return false;
        if (priceFilter === '200to300' && (price < 200 || price > 300)) return false;
        if (priceFilter === 'over300' && price <= 300) return false;
        if (floorFilter !== 'all' && room.floor != floorFilter) return false;
        return true;
    });
    
    filtered.sort(function(a, b) { return (parseFloat(a.base_price) || 0) - (parseFloat(b.base_price) || 0); });
    
    displayBrowseRooms(filtered);
    $('#browseResultCount').text('Showing ' + filtered.length + ' of ' + allBrowseRooms.length + ' rooms');
}

function displayBrowseRooms(rooms) {
    let html = '';
    if (rooms.length === 0) {
        html = '<div class="col-12 text-center py-5"><i class="fas fa-search fa-3x text-muted opacity-50 mb-3"></i><h5 class="text-muted fw-bold">No rooms match your filters.</h5></div>';
    } else {
        rooms.forEach(function(room) {
            var img = room.image_path || '/static/uploads/rooms/default-room.jpg';
            var price = window.formatPHP(room.base_price);
            html += `
                <div class="col-md-6 col-lg-4 fade-in">
                    <div class="card shadow-sm h-100 border-0 room-browse-card" style="border-radius: 20px; overflow: hidden;">
                        <div style="height: 220px; overflow: hidden; position: relative;">
                            <img src="${img}" alt="Room ${escapeHtml(room.room_number)}" 
                                 style="width:100%;height:100%;object-fit:cover;transition:transform 0.5s ease;" 
                                 onerror="this.src='/static/uploads/rooms/default-room.jpg'" class="room-hover-img">
                            <span class="badge bg-success position-absolute top-0 end-0 m-3 px-3 py-2 shadow-sm">Available</span>
                        </div>
                        <div class="card-body d-flex flex-column p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h5 class="fw-bold mb-0 text-primary">Room ${escapeHtml(room.room_number)}</h5>
                                    <small class="text-muted fw-bold">${escapeHtml(room.type_name)}</small>
                                </div>
                            </div>
                            <div class="my-3 p-3 rounded-3" style="background:#f8fafc;">
                                <div class="d-flex justify-content-between">
                                    <span class="fw-bold"><i class="fas fa-layer-group me-1 text-muted"></i> Floor ${room.floor}</span>
                                    <span class="fw-bold"><i class="fas fa-users me-1 text-muted"></i> ${room.capacity} pax</span>
                                </div>
                            </div>
                            <div class="mt-auto">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <span class="fs-4 fw-bold text-success">${price}</span>
                                    <small class="text-muted">per night</small>
                                </div>
                                <button class="btn btn-primary w-100 fw-bold shadow-sm" onclick="openBrowseBooking(${room.room_id}, '${escapeHtml(room.room_number)}', '${escapeHtml(room.type_name)}', '${escapeHtml(img)}', '${escapeHtml(price)}')" style="border-radius: 10px;">
                                    <i class="fas fa-calendar-plus me-2"></i>Book Now
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }
    $('#browseRoomsGrid').html(html);
}

function openBrowseBooking(roomId, roomNumber, typeName, image, price) {
    var modalHtml = `
        <div class="modal fade" id="browseBookingModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                    <div class="modal-header border-0" style="background: linear-gradient(135deg, #1a2744, #243356); border-radius: 20px 20px 0 0;">
                        <h5 class="modal-title text-white fw-bold">
                            <i class="fas fa-calendar-plus me-2" style="color: #c9a84c;"></i> Book This Room
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="p-3 rounded d-flex align-items-center gap-3 mb-3" style="background:#f8f9fa;border:1px solid #e9ecef;">
                            <img src="${image}" style="width:120px;height:80px;object-fit:cover;border-radius:8px;" onerror="this.src='/static/uploads/rooms/default-room.jpg'">
                            <div>
                                <h6 class="fw-bold mb-1">Room ${escapeHtml(roomNumber)} - ${escapeHtml(typeName)}</h6>
                                <span class="badge bg-success fs-6">${price}/night</span>
                            </div>
                        </div>
                        <form id="browseBookingForm">
                            <input type="hidden" name="room_id" value="${roomId}">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold text-muted mb-1">Guest Name *</label>
                                    <input type="text" class="form-control shadow-sm" name="guest_name" value="{{ session.get('username') }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold text-muted mb-1">Email *</label>
                                    <input type="email" class="form-control shadow-sm" name="guest_email" value="{{ session.get('email') }}" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold text-muted mb-1">Phone *</label>
                                    <input type="tel" class="form-control shadow-sm" name="guest_phone" placeholder="Enter phone number" required>
                                </div>
                                <div class="col-md-6 mb-3"></div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold text-muted mb-1">Check-in *</label>
                                    <input type="date" class="form-control shadow-sm" name="check_in" id="browseCheckIn" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold text-muted mb-1">Check-out *</label>
                                    <input type="date" class="form-control shadow-sm" name="check_out" id="browseCheckOut" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold text-muted mb-1">Adults</label>
                                    <input type="number" class="form-control shadow-sm" name="adults" value="1" min="1">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold text-muted mb-1">Children</label>
                                    <input type="number" class="form-control shadow-sm" name="children" value="0" min="0">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="fw-bold text-muted mb-1">Coupon Code</label>
                                <input type="text" class="form-control shadow-sm" name="coupon_code" placeholder="Enter coupon code" style="text-transform: uppercase;">
                            </div>
                            <div class="alert alert-info mt-4 border-0 shadow-sm rounded-3" style="background: rgba(14, 165, 233, 0.1);">
                                <i class="fas fa-info-circle me-2"></i> 
                                <strong>Booking Summary:</strong> After confirming, you will be redirected to the secure payment portal.
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer bg-light border-0" style="border-radius: 0 0 20px 20px;">
                        <button type="button" class="btn btn-secondary shadow-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary shadow-sm fw-bold" onclick="submitBrowseBooking()">
                            Proceed to Payment <i class="fas fa-arrow-right ms-1"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    $('#browseBookingModal').remove();
    $('.modal-backdrop').remove();
    $('body').removeClass('modal-open');
    $('body').css('overflow', '');
    $('body').css('padding-right', '');
    
    $('body').append(modalHtml);
    
    var today = new Date().toISOString().split('T')[0];
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    var tomorrowStr = tomorrow.toISOString().split('T')[0];
    
    $('#browseCheckIn').val(today).attr('min', today);
    $('#browseCheckOut').val(tomorrowStr).attr('min', tomorrowStr);
    
    $('#browseCheckIn').on('change', function() {
        var checkIn = this.value;
        if (checkIn) {
            var nextDay = new Date(checkIn);
            nextDay.setDate(nextDay.getDate() + 1);
            $('#browseCheckOut').attr('min', nextDay.toISOString().split('T')[0]);
            if ($('#browseCheckOut').val() < nextDay.toISOString().split('T')[0]) {
                $('#browseCheckOut').val(nextDay.toISOString().split('T')[0]);
            }
        }
    });
    
    $('#browseBookingModal').modal('show');
    
    $('#browseBookingModal').on('hidden.bs.modal', function() {
        $('#browseBookingModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
        $('body').css('padding-right', '');
    });
}

function submitBrowseBooking() {
    var $btn = $('#browseBookingModal .btn-primary');
    var originalText = $btn.html();
    $btn.html('<span class="spinner-border spinner-border-sm me-2"></span> Processing...').prop('disabled', true);
    
    jQuery.ajax({
        url: '/api/bookings/create',
        method: 'POST',
        data: $('#browseBookingForm').serialize(),
        success: function(response) {
            if (response.success) {
                showNotification('Booking created! Redirecting to payment...', 'success');
                $('#browseBookingModal').modal('hide');
                if (response.redirect) {
                    setTimeout(function() { window.location.href = response.redirect; }, 1500);
                } else {
                    loadBrowseRooms();
                }
            } else {
                showNotification(response.message || 'Error creating booking', 'error');
                $btn.html(originalText).prop('disabled', false);
            }
        },
        error: function(xhr) {
            var message = 'Error creating booking';
            if (xhr.responseJSON && xhr.responseJSON.message) message = xhr.responseJSON.message;
            showNotification(message, 'error');
            $btn.html(originalText).prop('disabled', false);
        }
    });
}

function resetBrowseFilters() {
    $('#searchRooms').val('');
    $('#priceFilterBrowse').val('all');
    $('#floorFilterBrowse').val('all');
    filterBrowseRooms();
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showNotification(message, type) {
    if (typeof window.showNotification === 'function') {
        window.showNotification(message, type);
    } else {
        alert(message);
    }
}
</script>

<style>
.room-browse-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px rgba(0,0,0,0.15) !important; }
.room-hover-img:hover { transform: scale(1.08); }
</style>
{% endblock %}
