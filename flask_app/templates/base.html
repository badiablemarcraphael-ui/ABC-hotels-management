<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#1a1a3e">
    <meta name="description" content="ABC hotels & Resort — Luxury Hospitality Management Suite">
    <meta name="author" content="ABC hotels Management">
    <meta name="robots" content="noindex, nofollow">
    
    <title>{% block title %}ABC hotels | Luxury Management Suite{% endblock %}</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=35">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <style>
        :root {
            --surface-primary: #fdfcf9;
            --surface-secondary: #faf8f4;
            --surface-tertiary: #f5f0e8;
            --neutral-200: #f5f0e8;
            --neutral-300: #e8e0d5;
            --neutral-400: #d4cec4;
            --neutral-500: #c8c0b4;
            
            --navy-950: #0a0f1a;
            --navy-900: #1a2744;
            --navy-800: #243356;
            --navy-700: #2c3e6b;
            
            --bronze-800: #5a4a38;
            --bronze-600: #8b7355;
            --bronze-500: #a89269;
            --bronze-400: #c4b393;
            
            --gold-800: #8a6e2e;
            --gold-600: #a88838;
            --gold-500: #c9a84c;
            --gold-400: #dfc278;
            --gold-300: #f0e4c3;
            --gold-200: #f8f2e0;
            --gold-100: #fcf9f2;
            
            --success-600: #2d6a4f;
            --success-500: #3d8b6a;
            --danger-600: #8b3a3a;
            --danger-500: #a84848;
            --warning-600: #b8860b;
            --warning-500: #d4a020;
            --info-600: #4a7c96;
            
            --peso-blue: #0038A8;
            --peso-red: #CE1126;
            --peso-gold: #FCD116;
            
            --dark-bg: #0a0f1a;
            --dark-surface: #141929;
            --dark-surface-alt: #1c2135;
            --dark-text: #d4cec4;
            --dark-text-muted: #8b8a95;
            
            --font-display: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            
            --shadow-sm: 0 2px 8px rgba(10, 15, 26, 0.05);
            --shadow-md: 0 4px 16px rgba(10, 15, 26, 0.07);
            --shadow-lg: 0 8px 32px rgba(10, 15, 26, 0.09);
            --shadow-xl: 0 12px 48px rgba(10, 15, 26, 0.12);
            --shadow-2xl: 0 20px 60px rgba(10, 15, 26, 0.16);
            --shadow-gold-sm: 0 2px 8px rgba(201, 168, 76, 0.12);
            --shadow-gold-md: 0 4px 20px rgba(201, 168, 76, 0.18);
            --shadow-gold-lg: 0 8px 40px rgba(201, 168, 76, 0.25);
            
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 150ms var(--ease-in-out);
            --transition-base: 250ms var(--ease-in-out);
            --transition-slow: 400ms var(--ease-in-out);
            --transition-spring: 500ms var(--ease-spring);
            --transition-bounce: 600ms var(--ease-bounce);
            
            --z-sticky: 1020;
            --z-overlay: 1030;
            --z-nav: 1035;
            --z-tooltip: 1080;
            --z-notification: 9999;
            --z-preloader: 99999;
            
            --sticky-bar-height: 65px;
            --mobile-breakpoint: 992px;
        }
        
        /* =============================================
           PRELOADER
           ============================================= */
        .grand-preloader {
            position: fixed;
            inset: 0;
            z-index: var(--z-preloader);
            background: var(--navy-950);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        
        .grand-preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .preloader-logo {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gold-500);
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            animation: preloaderFadeIn 0.7s ease forwards;
        }
        
        .preloader-spinner {
            position: relative;
            width: 60px;
            height: 60px;
        }
        
        .preloader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        
        .preloader-ring:nth-child(1) {
            border-top-color: var(--gold-500);
            animation: preloaderSpin 1.2s linear infinite;
        }
        
        .preloader-ring:nth-child(2) {
            inset: 8px;
            border-right-color: var(--gold-400);
            animation: preloaderSpin 0.9s linear infinite reverse;
        }
        
        .preloader-ring:nth-child(3) {
            inset: 16px;
            border-bottom-color: var(--peso-blue);
            animation: preloaderSpin 0.6s linear infinite;
        }
        
        @keyframes preloaderSpin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes preloaderFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .preloader-text {
            font-size: 0.65rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 1.5rem;
            opacity: 0;
            animation: preloaderFadeIn 0.7s ease 0.3s forwards;
        }
        
        /* =============================================
           PAGE TRANSITION OVERLAY
           ============================================= */
        .page-transition-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: var(--navy-950);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 0.5s var(--ease-in-out);
            pointer-events: none;
        }
        
        .page-transition-overlay.active {
            transform: scaleY(1);
            transform-origin: bottom;
        }
        
        /* =============================================
           GLOBAL RESET & BASE
           ============================================= */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: rgba(201, 168, 76, 0.1);
            scrollbar-gutter: stable;
        }
        
        body {
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.5;
            color: var(--navy-900);
            background-color: var(--neutral-200);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: var(--sticky-bar-height);
            transition: background-color var(--transition-slow), color var(--transition-slow);
            position: relative;
        }
        
        /* Ambient background pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(201, 168, 76, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 56, 168, 0.02) 0%, transparent 40%),
                radial-gradient(ellipse at 60% 80%, rgba(206, 17, 38, 0.02) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 600;
            line-height: 1.25;
            color: var(--navy-900);
        }
        
        a { color: var(--navy-700); text-decoration: none; transition: color var(--transition-fast); }
        a:hover { color: var(--gold-500); }
        
        ::selection { background-color: rgba(201, 168, 76, 0.25); color: var(--navy-900); }
        :focus-visible { outline: 2px solid var(--gold-500); outline-offset: 3px; border-radius: 4px; }
        :focus:not(:focus-visible) { outline: none; }
        img { max-width: 100%; height: auto; display: block; }
        
        /* Ripple effect for buttons */
        .ripple-effect {
            position: relative;
            overflow: hidden;
        }
        
        .ripple-effect .ripple-wave {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }
        
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }
        
        /* Skip Navigation */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 1rem;
            background: var(--gold-500);
            color: var(--navy-900);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            z-index: var(--z-tooltip);
            transition: top var(--transition-fast);
        }
        .skip-link:focus { top: 1rem; }
        
        /* =============================================
           STICKY BOOKING BAR — MAIN NAVIGATION
           ============================================= */
        .sticky-booking-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: var(--z-sticky);
            background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: var(--shadow-lg), var(--shadow-gold-sm);
            border-bottom: 2px solid var(--gold-500);
            height: var(--sticky-bar-height);
            animation: barSlideDown 0.8s var(--ease-spring);
            transition: height var(--transition-base), background var(--transition-slow);
        }
        
        /* Subtle shimmer on the bar */
        .sticky-booking-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            animation: barShimmer 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes barShimmer {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }
        
        @keyframes barSlideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .sticky-booking-bar::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-500) 20%, var(--peso-blue) 40%, var(--peso-red) 60%, var(--gold-500) 80%, transparent);
            background-size: 200% 100%;
            animation: gradientShift 6s ease infinite;
            border-radius: 0 0 2px 2px;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Glow dots on the bar */
        .bar-glow-dot {
            position: absolute;
            bottom: 0;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold-500);
            box-shadow: 0 0 8px var(--gold-400), 0 0 16px var(--gold-400);
            animation: glowDotFloat 4s ease-in-out infinite;
            pointer-events: none;
        }
        
        .bar-glow-dot:nth-child(1) { left: 15%; animation-delay: 0s; }
        .bar-glow-dot:nth-child(2) { left: 50%; animation-delay: 1.5s; }
        .bar-glow-dot:nth-child(3) { left: 85%; animation-delay: 3s; }
        
        @keyframes glowDotFloat {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-8px); opacity: 1; }
        }
        
        .sticky-booking-bar .container-fluid {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            padding: 0 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* Brand */
        .sticky-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
            text-decoration: none;
            transition: transform var(--transition-spring);
        }
        
        .sticky-brand:hover {
            transform: scale(1.03);
        }
        
        .sticky-brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--navy-950);
            transition: all var(--transition-spring);
            animation: iconFloat 3s ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(201, 168, 76, 0.3);
        }
        
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        
        .sticky-brand:hover .sticky-brand-icon {
            transform: scale(1.1) rotate(8deg);
            box-shadow: 0 6px 25px rgba(201, 168, 76, 0.5);
        }
        
        .sticky-brand-text {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #fff, var(--gold-400));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sticky-brand-tagline {
            font-family: var(--font-body);
            font-size: 0.55rem;
            letter-spacing: 2px;
            color: var(--bronze-400);
            text-transform: uppercase;
            display: block;
            opacity: 0.7;
        }
        
        /* Navigation Links */
        .sticky-nav {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            flex-wrap: wrap;
        }
        
        .sticky-nav .nav-link-sticky {
            color: rgba(212, 206, 196, 0.75);
            padding: 0.5rem 0.9rem;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            transition: all var(--transition-bounce);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        
        .sticky-nav .nav-link-sticky::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(201, 168, 76, 0.15), rgba(201, 168, 76, 0.05));
            opacity: 0;
            border-radius: 9999px;
            transition: opacity var(--transition-fast);
        }
        
        /* Hover glow effect */
        .sticky-nav .nav-link-sticky::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: var(--gold-500);
            border-radius: 2px;
            transition: transform var(--transition-spring);
        }
        
        .sticky-nav .nav-link-sticky:hover {
            color: var(--gold-400);
            transform: translateY(-3px);
            text-shadow: 0 0 10px rgba(201, 168, 76, 0.3);
        }
        
        .sticky-nav .nav-link-sticky:hover::before { opacity: 1; }
        .sticky-nav .nav-link-sticky:hover::after { transform: translateX(-50%) scaleX(1); }
        
        .sticky-nav .nav-link-sticky i {
            font-size: 0.85rem;
            transition: all var(--transition-spring);
            color: var(--bronze-400);
        }
        
        .sticky-nav .nav-link-sticky:hover i {
            color: var(--gold-400);
            transform: scale(1.2) rotate(-5deg);
        }
        
        .sticky-nav .nav-link-sticky.active {
            background: linear-gradient(135deg, rgba(201, 168, 76, 0.2), rgba(201, 168, 76, 0.08));
            color: var(--gold-400);
            font-weight: 600;
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: activePulse 3s ease-in-out infinite;
        }
        
        @keyframes activePulse {
            0%, 100% { box-shadow: 0 0 20px rgba(201, 168, 76, 0.15), inset 0 1px 0 rgba(255,255,255,0.05); }
            50% { box-shadow: 0 0 30px rgba(201, 168, 76, 0.3), inset 0 1px 0 rgba(255,255,255,0.08); }
        }
        
        .sticky-nav .nav-link-sticky.active i { color: var(--gold-500); }
        
        .nav-active-dot {
            width: 6px;
            height: 6px;
            background: var(--gold-500);
            border-radius: 50%;
            opacity: 0;
            transition: all var(--transition-spring);
            box-shadow: 0 0 6px var(--gold-400);
        }
        .sticky-nav .nav-link-sticky.active .nav-active-dot {
            opacity: 1;
            animation: dotBlink 2s ease-in-out infinite;
        }
        
        @keyframes dotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.5); }
        }
        
        /* Overflow Dropdown */
        .nav-overflow-dropdown { position: relative; }
        .nav-overflow-dropdown .dropdown-toggle::after { display: none; }
        
        .nav-overflow-dropdown .sticky-dropdown-menu {
            background: var(--surface-primary);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 14px;
            box-shadow: var(--shadow-2xl);
            padding: 0.5rem;
            min-width: 200px;
            margin-top: 0.5rem !important;
            animation: dropdownReveal 300ms var(--ease-spring);
            transform-origin: top right;
        }
        
        @keyframes dropdownReveal {
            from { opacity: 0; transform: translateY(-12px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .nav-overflow-dropdown .dropdown-item {
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            transition: all var(--transition-fast);
            color: var(--navy-900);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            position: relative;
        }
        
        .nav-overflow-dropdown .dropdown-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 3px;
            height: 60%;
            background: var(--gold-500);
            border-radius: 0 3px 3px 0;
            transition: transform var(--transition-spring);
        }
        
        .nav-overflow-dropdown .dropdown-item i {
            width: 1.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--bronze-500);
            transition: all var(--transition-fast);
        }
        
        .nav-overflow-dropdown .dropdown-item:hover {
            background-color: rgba(201, 168, 76, 0.08);
            color: var(--gold-600);
            transform: translateX(6px);
            padding-left: 1.3rem;
        }
        .nav-overflow-dropdown .dropdown-item:hover::before { transform: translateY(-50%) scaleY(1); }
        .nav-overflow-dropdown .dropdown-item:hover i { color: var(--gold-500); }
        
        .nav-overflow-dropdown .dropdown-item.active {
            background: linear-gradient(90deg, rgba(201, 168, 76, 0.12), rgba(201, 168, 76, 0.03));
            color: var(--gold-600);
            font-weight: 600;
        }
        .nav-overflow-dropdown .dropdown-item.active i { color: var(--gold-500); }
        
        /* Right Side Actions */
        .sticky-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }
        
        .sticky-user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(212, 206, 196, 0.8);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
        }
        
        .sticky-user-info:hover {
            color: var(--gold-400);
            background: rgba(201, 168, 76, 0.06);
        }
        
        .sticky-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--navy-950);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-spring);
            border: 2px solid transparent;
            flex-shrink: 0;
            position: relative;
        }
        
        .sticky-avatar:hover {
            transform: scale(1.15) rotate(5deg);
            border-color: white;
            box-shadow: var(--shadow-gold-md), 0 0 20px rgba(201, 168, 76, 0.3);
        }
        
        .sticky-status-dot {
            width: 10px;
            height: 10px;
            background: var(--success-500);
            border-radius: 50%;
            border: 2px solid var(--navy-900);
            position: absolute;
            bottom: -1px;
            right: -1px;
            animation: statusPulse 2s ease-in-out infinite;
        }
        
        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(61, 139, 106, 0.6); }
            50% { box-shadow: 0 0 0 6px rgba(61, 139, 106, 0); }
        }
        
        .sticky-theme-toggle {
            background: none;
            border: 1.5px solid transparent;
            color: rgba(212, 206, 196, 0.7);
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 10px;
            transition: all var(--transition-bounce);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            position: relative;
            overflow: hidden;
        }
        
        .sticky-theme-toggle:hover {
            color: var(--gold-500);
            background: rgba(201, 168, 76, 0.08);
            border-color: rgba(201, 168, 76, 0.2);
            transform: scale(1.15) rotate(15deg);
        }
        
        /* Mobile Nav Toggle */
        .sticky-nav-toggle {
            display: none;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--navy-950);
            cursor: pointer;
            transition: all var(--transition-spring);
            font-size: 1.1rem;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        
        .sticky-nav-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-gold-lg), 0 0 25px rgba(201, 168, 76, 0.4);
        }
        
        .sticky-nav-toggle:active {
            transform: scale(0.9);
        }
        
        /* Hamburger animation */
        .sticky-nav-toggle .hamburger-lines {
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all var(--transition-fast);
            width: 18px;
        }
        
        .sticky-nav-toggle .hamburger-lines span {
            display: block;
            height: 2px;
            background: var(--navy-950);
            border-radius: 2px;
            transition: all var(--transition-bounce);
            transform-origin: center;
        }
        
        .sticky-nav-toggle.open .hamburger-lines span:nth-child(1) {
            transform: translateY(6px) rotate(45deg);
        }
        
        .sticky-nav-toggle.open .hamburger-lines span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        
        .sticky-nav-toggle.open .hamburger-lines span:nth-child(3) {
            transform: translateY(-6px) rotate(-45deg);
        }
        
        /* User Dropdown */
        .sticky-dropdown-menu {
            background: var(--surface-primary);
            border: 1px solid rgba(201, 168, 76, 0.12);
            border-radius: 14px;
            box-shadow: var(--shadow-2xl);
            padding: 0.5rem;
            min-width: 220px;
            margin-top: 0.75rem !important;
            animation: dropdownReveal 300ms var(--ease-spring);
            transform-origin: top right;
        }
        
        .sticky-dropdown-menu .dropdown-header {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--bronze-500);
            padding: 0.5rem 1rem 0.25rem;
        }
        
        .sticky-dropdown-menu .dropdown-item {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            transition: all var(--transition-fast);
            color: var(--navy-900);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }
        
        .sticky-dropdown-menu .dropdown-item i {
            width: 1.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--bronze-500);
            transition: all var(--transition-fast);
        }
        
        .sticky-dropdown-menu .dropdown-item:hover {
            background-color: rgba(201, 168, 76, 0.06);
            color: var(--gold-600);
            transform: translateX(4px);
        }
        .sticky-dropdown-menu .dropdown-item:hover i { color: var(--gold-500); }
        
        .sticky-dropdown-menu .dropdown-item.text-danger:hover {
            background-color: rgba(139, 58, 58, 0.06);
            color: var(--danger-600);
        }
        
        /* =============================================
           MAIN CONTENT AREA
           ============================================= */
        .main-content {
            padding: 1.5rem;
            min-height: calc(100vh - var(--sticky-bar-height));
            max-width: 1400px;
            margin: 0 auto;
            background-color: transparent;
            animation: contentReveal 500ms var(--ease-in-out) forwards;
            position: relative;
        }
        
        @keyframes contentReveal {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Mobile Nav Overlay */
        .mobile-nav-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 26, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: var(--z-overlay);
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-base);
        }
        
        .mobile-nav-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* =============================================
           SCROLL TO TOP BUTTON
           ============================================= */
        .scroll-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
            color: var(--navy-950);
            border: none;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all var(--transition-spring);
            box-shadow: var(--shadow-gold-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scroll-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .scroll-to-top:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: var(--shadow-gold-lg);
        }
        
        .scroll-to-top:active {
            transform: translateY(0) scale(0.95);
        }
        
        /* =============================================
           DARK MODE
           ============================================= */
        .dark-mode {
            color: var(--dark-text);
            background-color: var(--dark-bg);
        }
        
        .dark-mode::before {
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(201, 168, 76, 0.02) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 56, 168, 0.01) 0%, transparent 40%);
        }
        
        .dark-mode .sticky-booking-bar {
            background: linear-gradient(135deg, #0a0f1a 0%, #141929 100%);
            border-bottom-color: rgba(201, 168, 76, 0.3);
        }
        
        .dark-mode .sticky-booking-bar::after { opacity: 0.7; }
        
        .dark-mode .sticky-dropdown-menu,
        .dark-mode .nav-overflow-dropdown .sticky-dropdown-menu {
            background: var(--dark-surface);
            border-color: rgba(201, 168, 76, 0.08);
        }
        
        .dark-mode .sticky-dropdown-menu .dropdown-item,
        .dark-mode .nav-overflow-dropdown .dropdown-item {
            color: var(--dark-text);
        }
        
        .dark-mode .nav-overflow-dropdown .dropdown-item:hover {
            background-color: rgba(201, 168, 76, 0.1);
            color: var(--gold-400);
        }
        
        .dark-mode .nav-overflow-dropdown .dropdown-item.active {
            background: linear-gradient(90deg, rgba(201, 168, 76, 0.15), rgba(201, 168, 76, 0.05));
            color: var(--gold-400);
        }
        
        .dark-mode .main-content { background-color: transparent; }
        .dark-mode h1, .dark-mode h2, .dark-mode h3,
        .dark-mode h4, .dark-mode h5, .dark-mode h6 { color: var(--gold-200); }
        .dark-mode .sticky-status-dot { border-color: var(--dark-surface); }
        .dark-mode .scroll-to-top { box-shadow: 0 4px 20px rgba(201, 168, 76, 0.2); }
        
        /* =============================================
           RESPONSIVE DESIGN
           ============================================= */
        @media (max-width: 1200px) {
            .sticky-nav .nav-link-sticky span { display: none; }
            .sticky-nav .nav-link-sticky i { font-size: 1.1rem; }
            .sticky-nav .nav-link-sticky { padding: 0.5rem 0.65rem; }
        }
        
        @media (max-width: 992px) {
            .sticky-nav {
                position: fixed;
                top: var(--sticky-bar-height);
                left: 0;
                right: 0;
                background: linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 100%);
                flex-direction: column;
                padding: 1rem;
                gap: 0.25rem;
                transform: translateY(-120%);
                transition: transform 0.5s var(--ease-spring);
                z-index: var(--z-nav);
                box-shadow: var(--shadow-xl);
                border-bottom: 2px solid var(--gold-500);
                max-height: calc(100vh - var(--sticky-bar-height));
                overflow-y: auto;
            }
            
            .sticky-nav.mobile-open { transform: translateY(0); }
            .sticky-nav-toggle { display: flex; }
            
            .sticky-nav .nav-link-sticky {
                width: 100%;
                padding: 0.85rem 1rem;
                border-radius: 12px;
                animation: mobileNavItemIn 0.4s var(--ease-spring) both;
            }
            
            @keyframes mobileNavItemIn {
                from { opacity: 0; transform: translateX(-20px); }
                to { opacity: 1; transform: translateX(0); }
            }
            
            .sticky-nav .nav-link-sticky span { display: inline; }
            .sticky-nav .nav-link-sticky::before { border-radius: 12px; }
            
            .nav-overflow-dropdown { width: 100%; }
            
            .nav-overflow-dropdown .sticky-dropdown-menu {
                position: static !important;
                transform: none !important;
                width: 100%;
                margin-top: 0.25rem !important;
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(201, 168, 76, 0.15);
                box-shadow: none;
                animation: none;
            }
            
            .dark-mode .nav-overflow-dropdown .sticky-dropdown-menu {
                background: rgba(255,255,255,0.03);
            }
            
            .main-content { padding: 1rem; }
            .sticky-user-info span { display: none; }
            .scroll-to-top { bottom: 1.5rem; right: 1.5rem; width: 40px; height: 40px; }
        }
        
        @media (max-width: 768px) {
            :root { --sticky-bar-height: 55px; }
            .sticky-booking-bar .container-fluid { padding: 0 1rem; }
            .sticky-brand-text { font-size: 1rem; }
            .sticky-brand-icon { width: 36px; height: 36px; font-size: 1.1rem; }
            .main-content { padding: 0.75rem; }
            .sticky-actions { gap: 0.5rem; }
        }
        
        @media (max-width: 480px) {
            .sticky-avatar { width: 30px; height: 30px; font-size: 0.7rem; }
            .sticky-brand-tagline { display: none; }
        }
        
        /* =============================================
           PRINT STYLES
           ============================================= */
        @media print {
            .sticky-booking-bar, .sticky-nav-toggle, .mobile-nav-overlay,
            .skip-link, .scroll-to-top, .grand-preloader, .page-transition-overlay,
            .bar-glow-dot { display: none !important; }
            body { padding-top: 0 !important; }
            .main-content { margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
            body { background: white !important; color: black !important; }
            * { background: transparent !important; box-shadow: none !important; text-shadow: none !important; }
            @page { margin: 2cm; size: A4; }
        }
        
        /* =============================================
           UTILITY CLASSES
           ============================================= */
        .text-gold { color: var(--gold-500) !important; }
        .text-navy { color: var(--navy-900) !important; }
        .shadow-gold { box-shadow: var(--shadow-gold-sm) !important; }
        .shadow-lux { box-shadow: var(--shadow-xl) !important; }
        
        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }
        
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        
        .currency-amount::before, .currency-peso::before {
            content: "₱";
            margin-right: 2px;
            font-weight: 700;
        }
        
        @supports not ((-webkit-backdrop-filter: blur(20px)) or (backdrop-filter: blur(20px))) {
            .sticky-booking-bar { background: var(--navy-900); }
            .dark-mode .sticky-booking-bar { background: var(--dark-surface); }
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    
    <!-- Preloader -->
    <div class="grand-preloader" id="grandPreloader">
        <div class="preloader-logo">ABC hotels</div>
        <div class="preloader-spinner">
            <div class="preloader-ring"></div>
            <div class="preloader-ring"></div>
            <div class="preloader-ring"></div>
        </div>
        <div class="preloader-text">Luxury Hospitality</div>
    </div>
    
    <!-- Page Transition Overlay -->
    <div class="page-transition-overlay" id="pageTransitionOverlay"></div>
    
    <a href="#mainContent" class="skip-link">Skip to main content</a>
    <div class="mobile-nav-overlay" id="mobileNavOverlay" aria-hidden="true"></div>

    <!-- Glow Dots -->
    <span class="bar-glow-dot"></span>
    <span class="bar-glow-dot"></span>
    <span class="bar-glow-dot"></span>

    <!-- Sticky Booking Bar -->
    <header class="sticky-booking-bar" id="stickyBookingBar" role="banner">
        <div class="container-fluid">
            
            <a href="/dashboard" class="sticky-brand" aria-label="ABC hotels Home">
                <span class="sticky-brand-icon" aria-hidden="true"><i class="fas fa-crown"></i></span>
                <div>
                    <span class="sticky-brand-text">ABC hotels</span>
                    <span class="sticky-brand-tagline">Luxury Management</span>
                </div>
            </a>
            
            <nav class="sticky-nav" id="stickyNav" role="navigation" aria-label="Main Navigation">
                <div class="text-center py-3 w-100" id="navLoading">
                    <i class="fas fa-spinner fa-pulse text-gold" aria-hidden="true"></i>
                    <span class="text-muted ms-2">Loading navigation...</span>
                </div>
            </nav>
            
            <div class="sticky-actions">
                <button id="darkModeToggle" class="sticky-theme-toggle" title="Toggle Dark Mode" aria-label="Toggle dark mode" type="button">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
                
                <div class="dropdown">
                    <button class="sticky-user-info dropdown-toggle p-0 border-0 bg-transparent" id="userDropdownButton" data-bs-toggle="dropdown" aria-expanded="false" aria-haspopup="true" type="button">
                        <div style="position: relative;">
                            <div class="sticky-avatar"><i class="fas fa-user" aria-hidden="true"></i></div>
                            <span class="sticky-status-dot" aria-label="Online"></span>
                        </div>
                        <span id="username" class="d-none d-md-inline">Authenticating...</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end sticky-dropdown-menu" aria-labelledby="userDropdownButton">
                        <li><h6 class="dropdown-header">Account</h6></li>
                        <li><a class="dropdown-item text-danger" href="/logout"><i class="fas fa-sign-out-alt"></i>Secure Logout</a></li>
                    </ul>
                </div>
                
                <button id="stickyNavToggle" class="sticky-nav-toggle" title="Toggle Navigation" aria-label="Toggle navigation menu" aria-expanded="false" type="button">
                    <div class="hamburger-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </button>
            </div>
            
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="container-fluid p-0" id="dynamicContent">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Scroll to Top -->
    <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top" title="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <div id="modals-container" aria-live="polite" aria-atomic="true"></div>
    
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=20"></script>
    <script src="{{ url_for('static', filename='js/modals.js') }}?v=20"></script>
    
    <script>
        (function() {
            'use strict';
            
            // =============================================
            // PRELOADER
            // =============================================
            const preloader = document.getElementById('grandPreloader');
            const hidePreloader = () => {
                preloader?.classList.add('hidden');
                document.body.style.overflow = '';
            };
            
            window.addEventListener('load', () => setTimeout(hidePreloader, 800));
            setTimeout(hidePreloader, 4000); // Fallback
            
            // =============================================
            // PAGE TRANSITION
            // =============================================
            const transitionOverlay = document.getElementById('pageTransitionOverlay');
            
            function pageTransition(url) {
                if (!transitionOverlay) { window.location.href = url; return; }
                transitionOverlay.classList.add('active');
                setTimeout(() => { window.location.href = url; }, 500);
            }
            
            // Intercept internal navigation for smooth transitions
            document.addEventListener('click', (e) => {
                const link = e.target.closest('a[href]');
                if (link && link.href && link.href.startsWith(window.location.origin) && 
                    !link.hasAttribute('data-no-transition') && 
                    !link.hasAttribute('data-bs-toggle') &&
                    !link.hasAttribute('onclick') &&
                    link.getAttribute('target') !== '_blank') {
                    e.preventDefault();
                    pageTransition(link.href);
                }
            });
            
            // =============================================
            // SCROLL TO TOP
            // =============================================
            const scrollToTopBtn = document.getElementById('scrollToTop');
            
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) {
                    scrollToTopBtn?.classList.add('visible');
                } else {
                    scrollToTopBtn?.classList.remove('visible');
                }
            }, { passive: true });
            
            scrollToTopBtn?.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            
            // =============================================
            // RIPPLE EFFECT ON BUTTONS
            // =============================================
            document.addEventListener('click', function(e) {
                const btn = e.target.closest('.btn, .sticky-nav-toggle, .sticky-theme-toggle');
                if (!btn) return;
                
                const ripple = document.createElement('span');
                ripple.classList.add('ripple-wave');
                
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                
                btn.appendChild(ripple);
                
                ripple.addEventListener('animationend', () => ripple.remove());
            });
            
            // =============================================
            // CONFIGURATION
            // =============================================
            const CONFIG = Object.freeze({
                version: '3.0.0',
                storage: {
                    themeKey: 'grand_hotel_theme_v4',
                    sidebarStateKey: 'grand_hotel_nav_state'
                },
                stickyBar: { height: 65, mobileBreakpoint: 992, maxVisibleNavItems: 7 },
                api: { authEndpoint: '/api/users/check-auth', timeout: 15000, retryAttempts: 2 },
                menu: {
                    admin: [
                        { name: 'Dashboard', icon: 'fas fa-crown', path: '/dashboard' },
                        { name: 'Reservations', icon: 'fas fa-calendar-check', path: '/bookings' },
                        { name: 'Room Mgmt', icon: 'fas fa-door-open', path: '/rooms' },
                        { name: 'Amenities', icon: 'fas fa-spa', path: '/amenities' },
                        { name: 'Promotions', icon: 'fas fa-ticket-alt', path: '/coupons' },
                        { name: 'Guests', icon: 'fas fa-users', path: '/users' },
                        { name: 'Reports', icon: 'fas fa-chart-pie', path: '/reports' },
                        { name: 'Calendar', icon: 'fas fa-calendar-alt', path: '/calendar' },
                        { name: 'Reviews', icon: 'fas fa-star', path: '/reviews' }
                    ],
                    receptionist: [
                        { name: 'Front Desk', icon: 'fas fa-concierge-bell', path: '/dashboard' },
                        { name: 'Reservations', icon: 'fas fa-calendar-check', path: '/bookings' },
                        { name: 'Room Status', icon: 'fas fa-door-open', path: '/rooms' },
                        { name: 'Calendar', icon: 'fas fa-calendar-alt', path: '/calendar' }
                    ],
                    manager: [
                        { name: 'Dashboard', icon: 'fas fa-chart-line', path: '/dashboard' },
                        { name: 'Reservations', icon: 'fas fa-calendar-check', path: '/bookings' },
                        { name: 'Room Mgmt', icon: 'fas fa-door-open', path: '/rooms' },
                        { name: 'Amenities', icon: 'fas fa-spa', path: '/amenities' },
                        { name: 'Promotions', icon: 'fas fa-ticket-alt', path: '/coupons' },
                        { name: 'Guests', icon: 'fas fa-users', path: '/users' },
                        { name: 'Reports', icon: 'fas fa-chart-bar', path: '/reports' },
                        { name: 'Calendar', icon: 'fas fa-calendar-alt', path: '/calendar' },
                        { name: 'Reviews', icon: 'fas fa-star', path: '/reviews' }
                    ],
                    guest: [
                        { name: 'Dashboard', icon: 'fas fa-home', path: '/dashboard' },
                        { name: 'My Bookings', icon: 'fas fa-bookmark', path: '/my-bookings' },
                        { name: 'My Reviews', icon: 'fas fa-star', path: '/my-reviews' },
                        { name: 'Browse Rooms', icon: 'fas fa-search', path: '/browse-rooms' },
                        { name: 'Calendar', icon: 'fas fa-calendar-alt', path: '/calendar' }
                    ]
                }
            });
            
            const state = {
                isInitialized: false, isMobile: false, isMobileNavOpen: false,
                isDarkMode: false, currentUser: null, isAuthenticated: false,
                authCheckAttempts: 0, overflowItems: []
            };
            
            const DOM = {
                get body() { return document.body; },
                get stickyNav() { return document.getElementById('stickyNav'); },
                get stickyNavToggle() { return document.getElementById('stickyNavToggle'); },
                get mobileNavOverlay() { return document.getElementById('mobileNavOverlay'); },
                get darkModeToggle() { return document.getElementById('darkModeToggle'); },
                get username() { return document.getElementById('username'); }
            };
            
            const detectMobile = () => window.innerWidth <= CONFIG.stickyBar.mobileBreakpoint;
            
            const getMaxVisibleItems = () => {
                const w = window.innerWidth;
                if (w < 1200) return 4;
                if (w < 1400) return 5;
                return CONFIG.stickyBar.maxVisibleNavItems;
            };
            
            const debounce = (fn, delay = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), delay); }; };
            const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
            const load = (k, d = null) => { try { const i = localStorage.getItem(k); return i ? JSON.parse(i) : d; } catch { return d; } };
            
            const formatPHP = a => a == null ? '₱0.00' : '₱' + parseFloat(a).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            window.formatPHP = formatPHP;
            window.formatCurrency = formatPHP;
            
            // Navigation
            const toggleMobileNav = () => {
                state.isMobileNavOpen = !state.isMobileNavOpen;
                DOM.stickyNav?.classList.toggle('mobile-open', state.isMobileNavOpen);
                DOM.mobileNavOverlay?.classList.toggle('active', state.isMobileNavOpen);
                DOM.stickyNavToggle?.classList.toggle('open', state.isMobileNavOpen);
                document.body.style.overflow = state.isMobileNavOpen ? 'hidden' : '';
                DOM.stickyNavToggle?.setAttribute('aria-expanded', String(state.isMobileNavOpen));
                DOM.mobileNavOverlay?.setAttribute('aria-hidden', String(!state.isMobileNavOpen));
            };
            
            const closeMobileNav = () => {
                if (!state.isMobileNavOpen) return;
                state.isMobileNavOpen = false;
                DOM.stickyNav?.classList.remove('mobile-open');
                DOM.mobileNavOverlay?.classList.remove('active');
                DOM.stickyNavToggle?.classList.remove('open');
                document.body.style.overflow = '';
                DOM.stickyNavToggle?.setAttribute('aria-expanded', 'false');
            };
            
            const checkActive = (itemPath, currentPath) => {
                if (currentPath === itemPath) return true;
                if (currentPath === '/' && itemPath === '/dashboard') return true;
                if (itemPath !== '/dashboard' && itemPath !== '/' && currentPath.startsWith(itemPath)) return true;
                return false;
            };
            
            const buildNav = (role) => {
                if (!DOM.stickyNav) return;
                const items = CONFIG.menu[role] || CONFIG.menu.guest;
                const currentPath = window.location.pathname;
                const maxVisible = getMaxVisibleItems();
                
                let visible = [], overflow = [];
                if (items.length > maxVisible) {
                    visible = items.slice(0, maxVisible - 1);
                    overflow = items.slice(maxVisible - 1);
                } else {
                    visible = items;
                }
                state.overflowItems = overflow;
                
                let html = '';
                visible.forEach((item, idx) => {
                    const isActive = checkActive(item.path.split('#')[0], currentPath);
                    html += `<a class="nav-link-sticky${isActive ? ' active' : ''}" href="${item.path}" data-nav-item="${item.name.toLowerCase().replace(/\s+/g, '-')}"${isActive ? ' aria-current="page"' : ''} style="animation-delay:${idx * 0.05}s"><i class="${item.icon}"></i><span>${item.name}</span><span class="nav-active-dot"></span></a>`;
                });
                
                if (overflow.length) {
                    const hasActive = overflow.some(item => checkActive(item.path.split('#')[0], currentPath));
                    html += `<div class="dropdown nav-overflow-dropdown">
                        <button class="nav-link-sticky${hasActive ? ' active' : ''} dropdown-toggle" type="button" id="navOverflowDropdown" data-bs-toggle="dropdown" aria-expanded="false" aria-haspopup="true">
                            <i class="fas fa-ellipsis-h"></i><span>More</span>${hasActive ? '<span class="nav-active-dot" style="opacity:1;"></span>' : ''}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end sticky-dropdown-menu" aria-labelledby="navOverflowDropdown">
                            ${overflow.map(item => { const isActive = checkActive(item.path.split('#')[0], currentPath); return `<li><a class="dropdown-item${isActive ? ' active' : ''}" href="${item.path}"${isActive ? ' aria-current="page"' : ''}><i class="${item.icon}"></i>${item.name}${isActive ? '<span class="nav-active-dot ms-auto" style="opacity:1;"></span>' : ''}</a></li>`; }).join('')}
                        </ul>
                    </div>`;
                }
                
                DOM.stickyNav.innerHTML = html;
                const trigger = document.getElementById('navOverflowDropdown');
                if (trigger && typeof bootstrap !== 'undefined') new bootstrap.Dropdown(trigger);
            };
            
            // Auth
            async function authenticate() {
                if (state.authCheckAttempts > CONFIG.api.retryAttempts) return handleAuthFailure('Authentication failed');
                state.authCheckAttempts++;
                try {
                    const r = await $.ajax({ url: CONFIG.api.authEndpoint, method: 'GET', dataType: 'json', timeout: CONFIG.api.timeout });
                    if (r.authenticated) {
                        state.isAuthenticated = true;
                        state.currentUser = { role: r.role, username: r.user, fullName: r.full_name || r.user || 'Valued Guest', userId: r.user_id };
                        if (DOM.username) DOM.username.textContent = state.currentUser.fullName;
                        buildNav(state.currentUser.role);
                        document.dispatchEvent(new CustomEvent('userAuthenticated', { detail: state.currentUser }));
                    } else {
                        handleAuthFailure('Session expired');
                    }
                } catch (e) { handleAuthFailure('Connection error'); }
            }
            
            function handleAuthFailure(reason) {
                if (DOM.username) DOM.username.textContent = reason;
                if (typeof window.showNotification === 'function') window.showNotification('Redirecting to login...', 'warning', 2500);
                setTimeout(() => { window.location.href = '/login'; }, 2000);
            }
            
            // Dark Mode
            const initDarkMode = () => {
                const saved = load(CONFIG.storage.themeKey);
                state.isDarkMode = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
                applyDarkMode();
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if (!localStorage.getItem(CONFIG.storage.themeKey)) { state.isDarkMode = e.matches; applyDarkMode(); } });
            };
            
            const toggleDarkMode = () => { state.isDarkMode = !state.isDarkMode; save(CONFIG.storage.themeKey, state.isDarkMode ? 'dark' : 'light'); applyDarkMode(); };
            
            const applyDarkMode = () => {
                document.body.classList.toggle('dark-mode', state.isDarkMode);
                const icon = DOM.darkModeToggle?.querySelector('i');
                if (icon) { icon.classList.toggle('fa-moon', !state.isDarkMode); icon.classList.toggle('fa-sun', state.isDarkMode); }
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.content = state.isDarkMode ? '#0a0f1a' : '#1a1a3e';
            };
            
            // Events
            const bindEvents = () => {
                DOM.stickyNavToggle?.addEventListener('click', e => { e.preventDefault(); toggleMobileNav(); });
                DOM.mobileNavOverlay?.addEventListener('click', closeMobileNav);
                DOM.darkModeToggle?.addEventListener('click', e => { e.preventDefault(); toggleDarkMode(); });
                
                document.addEventListener('keydown', e => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); if (detectMobile()) toggleMobileNav(); }
                    if (e.key === 'Escape') {
                        if (state.isMobileNavOpen) closeMobileNav();
                        document.querySelectorAll('.dropdown-menu.show').forEach(d => { const dd = bootstrap.Dropdown.getInstance(d.previousElementSibling); if (dd) dd.hide(); });
                    }
                });
                
                window.addEventListener('resize', debounce(() => {
                    const was = state.isMobile;
                    state.isMobile = detectMobile();
                    if (!state.isMobile && was) closeMobileNav();
                    if (state.currentUser) buildNav(state.currentUser.role);
                }, 300));
                
                DOM.stickyNav?.addEventListener('click', e => {
                    if (e.target.closest('.nav-link-sticky[href]') && detectMobile()) setTimeout(closeMobileNav, 200);
                });
                
                document.addEventListener('click', e => {
                    if (!e.target.closest('.nav-overflow-dropdown')) {
                        const btn = document.getElementById('navOverflowDropdown');
                        if (btn) { const dd = bootstrap.Dropdown.getInstance(btn); if (dd && btn.parentElement.querySelector('.dropdown-menu.show')) dd.hide(); }
                    }
                });
            };
            
            // Init
            async function initialize() {
                if (state.isInitialized) return;
                console.log(`%c🏨 ABC hotels v${CONFIG.version} %cInitializing...`, 'color:#c9a84c;font-size:1.1em;font-weight:bold;', 'color:#8b7355;');
                state.isMobile = detectMobile();
                bindEvents();
                initDarkMode();
                await authenticate();
                state.isInitialized = true;
                console.log('%c✅ Ready', 'color:#2d6a4f;font-weight:bold;');
            }
            
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize);
            else initialize();
            
            window.GrandHotel = Object.freeze({
                version: CONFIG.version, toggleMobileNav, toggleDarkMode, closeMobileNav,
                pageTransition,
                refreshNavigation: () => { if (state.currentUser) buildNav(state.currentUser.role); },
                getState: () => ({ ...state }), getCurrentUser: () => state.currentUser ? { ...state.currentUser } : null,
                isAuthenticated: () => state.isAuthenticated, formatPHP, formatCurrency: formatPHP
            });
        })();
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
