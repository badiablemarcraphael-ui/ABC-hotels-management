<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#1a2744">
    <meta name="description" content="Grand Hotel & Resort — Luxury Hospitality Management Suite">
    <meta name="author" content="Grand Hotel Management">
    <meta name="robots" content="noindex, nofollow">
    
    <title>{% block title %}Grand Hotel | Luxury Management Suite{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
    
    <!-- =============================================
         CORE STYLESHEETS
         ============================================= -->
    
    <!-- Custom Luxury Hotel CSS (60-30-10 Design System) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=16">
    
    <!-- Bootstrap 5.1.3 (Grid & Core Components) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- =============================================
         TYPOGRAPHY
         ============================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <!-- =============================================
         JAVASCRIPT LIBRARIES
         ============================================= -->
    
    <!-- Chart.js (Analytics & Visualization) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Leaflet Maps & Routing Engine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <!-- =============================================
         COMPREHENSIVE DESIGN SYSTEM
         60% Neutral | 30% Rich Accent | 10% Gold
         ============================================= -->
    <style>
        /* ─────────────────────────────────────────────
           DESIGN TOKENS & CSS CUSTOM PROPERTIES
           ───────────────────────────────────────────── */
        :root {
            /* ══════ 60% NEUTRAL BASE ══════ */
            --surface-primary: #fdfcf9;
            --surface-secondary: #faf8f4;
            --surface-tertiary: #f5f0e8;
            --surface-quaternary: #ede5d8;
            
            --neutral-100: #fdfcf9;
            --neutral-200: #f5f0e8;
            --neutral-300: #e8e0d5;
            --neutral-400: #d4cec4;
            --neutral-500: #c8c0b4;
            --neutral-600: #b0a89c;
            
            /* ══════ 30% RICH ACCENT ══════ */
            --navy-950: #0a0f1a;
            --navy-900: #1a2744;
            --navy-800: #243356;
            --navy-700: #2c3e6b;
            --navy-600: #354a82;
            --navy-500: #4a6099;
            
            --bronze-800: #5a4a38;
            --bronze-700: #6b5a45;
            --bronze-600: #8b7355;
            --bronze-500: #a89269;
            --bronze-400: #c4b393;
            --bronze-300: #d9cebc;
            --bronze-200: #e8e0d5;
            
            /* ══════ 10% GOLD HIGHLIGHT ══════ */
            --gold-800: #8a6e2e;
            --gold-700: #a07d35;
            --gold-600: #a88838;
            --gold-500: #c9a84c;
            --gold-400: #dfc278;
            --gold-300: #f0e4c3;
            --gold-200: #f8f2e0;
            --gold-100: #fcf9f2;
            
            /* ══════ FUNCTIONAL COLORS ══════ */
            --success-700: #1b4332;
            --success-600: #2d6a4f;
            --success-500: #3d8b6a;
            --success-100: #d8f3dc;
            
            --danger-700: #6b2121;
            --danger-600: #8b3a3a;
            --danger-500: #a84848;
            --danger-100: #fce4e4;
            
            --warning-700: #8b6508;
            --warning-600: #b8860b;
            --warning-500: #d4a020;
            --warning-100: #fef3cd;
            
            --info-700: #2c5f72;
            --info-600: #4a7c96;
            --info-500: #5d94b0;
            --info-100: #d6ecf5;
            
            /* ══════ DARK MODE SURFACES ══════ */
            --dark-bg: #0a0f1a;
            --dark-surface: #141929;
            --dark-surface-alt: #1c2135;
            --dark-surface-hover: #222840;
            --dark-border: rgba(201, 168, 76, 0.12);
            --dark-text: #d4cec4;
            --dark-text-muted: #8b8a95;
            
            /* ══════ TYPOGRAPHY ══════ */
            --font-display: 'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            
            --text-xs: 0.7rem;
            --text-sm: 0.82rem;
            --text-base: 0.95rem;
            --text-lg: 1.1rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 2rem;
            --text-4xl: 2.5rem;
            
            --leading-tight: 1.25;
            --leading-normal: 1.5;
            --leading-relaxed: 1.75;
            
            --tracking-tight: -0.02em;
            --tracking-normal: -0.01em;
            --tracking-wide: 0.02em;
            --tracking-wider: 0.05em;
            --tracking-widest: 0.1em;
            
            /* ══════ SPACING SCALE (4px Base) ══════ */
            --space-0: 0;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            --space-16: 64px;
            --space-20: 80px;
            
            /* ══════ BORDER RADIUS ══════ */
            --radius-none: 0;
            --radius-xs: 4px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --radius-2xl: 28px;
            --radius-full: 9999px;
            
            /* ══════ SHADOW SYSTEM ══════ */
            --shadow-2xs: 0 1px 2px rgba(10, 15, 26, 0.03);
            --shadow-xs: 0 1px 3px rgba(10, 15, 26, 0.04);
            --shadow-sm: 0 2px 8px rgba(10, 15, 26, 0.05);
            --shadow-md: 0 4px 16px rgba(10, 15, 26, 0.07);
            --shadow-lg: 0 8px 32px rgba(10, 15, 26, 0.09);
            --shadow-xl: 0 12px 48px rgba(10, 15, 26, 0.12);
            --shadow-2xl: 0 20px 60px rgba(10, 15, 26, 0.16);
            
            --shadow-gold-sm: 0 2px 8px rgba(201, 168, 76, 0.12);
            --shadow-gold-md: 0 4px 20px rgba(201, 168, 76, 0.18);
            --shadow-gold-lg: 0 8px 40px rgba(201, 168, 76, 0.25);
            
            /* ══════ TRANSITIONS ══════ */
            --ease-out: cubic-bezier(0, 0, 0.2, 1);
            --ease-in: cubic-bezier(0.4, 0, 1, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            
            --duration-100: 100ms;
            --duration-200: 200ms;
            --duration-300: 300ms;
            --duration-500: 500ms;
            --duration-700: 700ms;
            
            --transition-fast: 150ms var(--ease-in-out);
            --transition-base: 250ms var(--ease-in-out);
            --transition-slow: 400ms var(--ease-in-out);
            --transition-spring: 500ms var(--ease-spring);
            
            /* ══════ Z-INDEX SCALE ══════ */
            --z-base: 1;
            --z-dropdown: 1000;
            --z-sticky: 1020;
            --z-overlay: 1030;
            --z-sidebar: 1040;
            --z-modal: 1055;
            --z-popover: 1070;
            --z-tooltip: 1080;
            --z-notification: 9999;
            
            /* ══════ LAYOUT ══════ */
            --sidebar-width: 270px;
            --sidebar-collapsed-width: 80px;
            --topbar-height: 65px;
            --mobile-breakpoint: 992px;
        }
        
        /* ─────────────────────────────────────────────
           CSS RESET & BASE STYLES
           ───────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            -webkit-tap-highlight-color: rgba(201, 168, 76, 0.1);
        }
        
        body {
            font-family: var(--font-body);
            font-size: var(--text-base);
            font-weight: 400;
            line-height: var(--leading-normal);
            color: var(--navy-900);
            background-color: var(--neutral-200);
            letter-spacing: var(--tracking-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--transition-slow),
                        color var(--transition-slow);
        }
        
        /* ── Typography ── */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 600;
            line-height: var(--leading-tight);
            letter-spacing: var(--tracking-tight);
            color: var(--navy-900);
        }
        
        h1 { font-size: var(--text-4xl); font-weight: 700; margin-bottom: var(--space-6); }
        h2 { font-size: var(--text-3xl); font-weight: 600; margin-bottom: var(--space-5); }
        h3 { font-size: var(--text-2xl); font-weight: 600; margin-bottom: var(--space-4); }
        h4 { font-size: var(--text-xl); font-weight: 600; margin-bottom: var(--space-3); }
        h5 { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-2); }
        h6 { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-2); }
        
        p { margin-bottom: var(--space-4); line-height: var(--leading-relaxed); }
        
        a {
            color: var(--navy-700);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        
        a:hover { color: var(--gold-500); }
        
        /* ── Selection ── */
        ::selection { background-color: rgba(201, 168, 76, 0.25); color: var(--navy-900); }
        ::-moz-selection { background-color: rgba(201, 168, 76, 0.25); color: var(--navy-900); }
        
        /* ── Focus ── */
        :focus-visible {
            outline: 2px solid var(--gold-500);
            outline-offset: 3px;
            border-radius: var(--radius-xs);
        }
        
        :focus:not(:focus-visible) { outline: none; }
        
        /* ── Images ── */
        img { max-width: 100%; height: auto; display: block; }
        
        /* =============================================
           SKIP NAVIGATION (Accessibility)
           ============================================= */
        .skip-link {
            position: absolute;
            top: -100%;
            left: var(--space-4);
            background: var(--gold-500);
            color: var(--navy-900);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-sm);
            font-weight: 600;
            z-index: var(--z-tooltip);
            transition: top var(--transition-fast);
        }
        
        .skip-link:focus { top: var(--space-4); }
        
        /* =============================================
           TOP NAVIGATION BAR (60% Neutral Base)
           ============================================= */
        .top-navbar {
            position: sticky;
            top: var(--space-4);
            z-index: var(--z-sticky);
            background: linear-gradient(180deg, 
                rgba(253, 252, 249, 0.98) 0%, 
                rgba(253, 252, 249, 0.94) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 0.875rem 1.75rem;
            border-radius: var(--radius-xl);
            margin-bottom: 1.75rem;
            box-shadow: var(--shadow-sm), var(--shadow-gold-sm);
            border: 1px solid rgba(201, 168, 76, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-4);
            transition: all var(--transition-base);
        }
        
        .top-navbar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: var(--space-8);
            right: var(--space-8);
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(201, 168, 76, 0.2) 20%, 
                rgba(201, 168, 76, 0.2) 80%, 
                transparent 100%);
            pointer-events: none;
        }
        
        /* ── Page Title (30% Navy + 10% Gold gradient) ── */
        #pageTitle {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.6rem;
            background: linear-gradient(135deg, 
                var(--navy-900) 0%, 
                var(--navy-700) 40%, 
                var(--bronze-600) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin: 0;
            white-space: nowrap;
        }
        
        /* ── Toggle Button ── */
        .toggle-btn {
            background: none;
            border: 1.5px solid transparent;
            color: var(--navy-700);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            line-height: 1;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
        }
        
        .toggle-btn:hover {
            color: var(--gold-500);
            background-color: rgba(201, 168, 76, 0.06);
            border-color: rgba(201, 168, 76, 0.2);
            transform: scale(1.08);
        }
        
        .toggle-btn:active { transform: scale(0.94); transition: transform 50ms var(--ease-out); }
        
        /* ── User Avatar ── */
        .user-avatar-wrapper { position: relative; flex-shrink: 0; }
        
        .user-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-600) 100%);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-gold-sm);
            transition: all var(--transition-base);
        }
        
        .user-avatar i { color: white; font-size: 0.85rem; }
        
        .user-avatar-wrapper:hover .user-avatar {
            transform: scale(1.05);
            box-shadow: var(--shadow-gold-md);
        }
        
        /* Online indicator */
        .user-status-indicator {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            background: var(--success-600);
            border-radius: var(--radius-full);
            border: 2px solid var(--surface-primary);
            box-shadow: 0 0 0 2px rgba(45, 106, 79, 0.2);
        }
        
        /* ── Dropdown ── */
        .dropdown-menu {
            background: var(--surface-primary);
            border: 1px solid rgba(201, 168, 76, 0.12);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-2xl);
            padding: var(--space-2);
            min-width: 230px;
            margin-top: var(--space-3) !important;
            animation: dropdownReveal 250ms var(--ease-spring);
            transform-origin: top right;
        }
        
        @keyframes dropdownReveal {
            from { opacity: 0; transform: translateY(-8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .dropdown-header {
            font-family: var(--font-body);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: var(--tracking-widest);
            color: var(--bronze-500);
            padding: var(--space-2) var(--space-4) var(--space-1);
        }
        
        .dropdown-item {
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 500;
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            color: var(--navy-900);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            cursor: pointer;
        }
        
        .dropdown-item i { width: 1.4rem; text-align: center; font-size: 0.95rem; color: var(--bronze-500); transition: color var(--transition-fast); }
        .dropdown-item:hover { background-color: rgba(201, 168, 76, 0.06); color: var(--gold-600); transform: translateX(3px); }
        .dropdown-item:hover i { color: var(--gold-500); }
        .dropdown-item.text-danger:hover { background-color: rgba(139, 58, 58, 0.06); color: var(--danger-600); }
        .dropdown-divider { border-color: rgba(201, 168, 76, 0.08); margin: var(--space-1) 0; }
        
        /* =============================================
           SIDEBAR NAVIGATION (30% Navy Accent base)
           ============================================= */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(175deg, 
                var(--navy-950) 0%, 
                var(--navy-900) 30%, 
                var(--navy-900) 100%);
            color: var(--neutral-300);
            padding: var(--space-6) var(--space-5);
            z-index: var(--z-sidebar);
            border-right: 1px solid rgba(201, 168, 76, 0.1);
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            transition: all var(--transition-base);
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        /* ── Sidebar Brand ── */
        .sidebar-brand { text-align: center; padding-bottom: var(--space-6); margin-bottom: var(--space-5); border-bottom: 1px solid rgba(201, 168, 76, 0.1); flex-shrink: 0; }
        .sidebar-brand-icon { font-size: 2.2rem; color: var(--gold-400); margin-bottom: var(--space-2); display: block; transition: transform var(--transition-spring); }
        .sidebar:hover .sidebar-brand-icon { transform: scale(1.05); }
        
        .sidebar-brand h4 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-400);
            text-transform: uppercase;
            margin: 0 0 var(--space-1) 0;
            line-height: 1.2;
        }
        
        .sidebar-brand .brand-tagline {
            font-family: var(--font-body);
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--bronze-400);
            text-transform: uppercase;
            opacity: 0.7;
        }
        
        /* ── Navigation ── */
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
        
        .sidebar .nav-link {
            font-family: var(--font-body);
            font-weight: 450;
            font-size: 0.88rem;
            letter-spacing: 0.2px;
            color: rgba(212, 206, 196, 0.65);
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-md);
            position: relative;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        
        .sidebar .nav-link i { width: 1.4rem; text-align: center; font-size: 0.9rem; flex-shrink: 0; transition: all var(--transition-base); color: var(--bronze-400); }
        
        /* Gold accent line */
        .sidebar .nav-link::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 3px;
            height: 55%;
            background: var(--gold-500);
            border-radius: 0 3px 3px 0;
            transition: transform var(--transition-spring);
        }
        
        .sidebar .nav-link:hover { background: rgba(201, 168, 76, 0.05); color: var(--gold-300); padding-left: 1.1rem; }
        .sidebar .nav-link:hover::after { transform: translateY(-50%) scaleY(1); }
        .sidebar .nav-link:hover i { color: var(--gold-400); }
        
        .sidebar .nav-link.active {
            background: linear-gradient(90deg, rgba(201, 168, 76, 0.12) 0%, rgba(201, 168, 76, 0.03) 100%);
            color: var(--gold-400);
            font-weight: 600;
            box-shadow: inset 3px 0 0 var(--gold-500);
        }
        
        .sidebar .nav-link.active i { color: var(--gold-500); }
        .sidebar .nav-link.active::after { transform: translateY(-50%) scaleY(1); }
        
        /* Active indicator diamond */
        .nav-active-indicator { margin-left: auto; color: var(--gold-400); font-size: 0.4rem; opacity: 0; transition: opacity var(--transition-base); }
        .sidebar .nav-link.active .nav-active-indicator { opacity: 1; }
        
        /* ── Sidebar Footer ── */
        .sidebar-footer { margin-top: auto; padding-top: var(--space-5); border-top: 1px solid rgba(201, 168, 76, 0.1); text-align: center; flex-shrink: 0; }
        .sidebar-footer small {
            font-family: var(--font-body);
            font-size: 0.58rem;
            color: var(--bronze-400);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            opacity: 0.6;
        }
        
        /* ── Loading State ── */
        .sidebar-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            padding: var(--space-12) var(--space-4);
            color: var(--bronze-400);
            text-align: center;
        }
        
        .sidebar-loading i { font-size: 1.5rem; color: var(--gold-400); animation: goldPulse 1.8s var(--ease-in-out) infinite; }
        .sidebar-loading span { font-size: 0.8rem; letter-spacing: 0.5px; }
        
        @keyframes goldPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }
        
        /* =============================================
           MAIN CONTENT AREA (60% Neutral Cream)
           ============================================= */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: var(--space-6);
            min-height: 100vh;
            min-height: 100dvh;
            transition: margin-left var(--transition-base);
            background-color: var(--neutral-200);
            position: relative;
        }
        
        .main-content.expanded { margin-left: var(--sidebar-collapsed-width); }
        
        /* ── Content Animation ── */
        .content-fade-in { animation: contentReveal 450ms var(--ease-out) forwards; }
        
        @keyframes contentReveal {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* =============================================
           SIDEBAR OVERLAY (Mobile)
           ============================================= */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 26, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: var(--z-overlay);
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-base);
        }
        
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        
        /* =============================================
           COLLAPSED SIDEBAR (Desktop)
           ============================================= */
        .sidebar.collapsed { width: var(--sidebar-collapsed-width); padding: var(--space-4) var(--space-2); }
        .sidebar.collapsed .sidebar-brand-icon { font-size: 1.6rem; }
        .sidebar.collapsed .sidebar-brand h4,
        .sidebar.collapsed .sidebar-brand .brand-tagline,
        .sidebar.collapsed .nav-link span,
        .sidebar.collapsed .nav-link .nav-active-indicator,
        .sidebar.collapsed .sidebar-footer small span { display: none; }
        .sidebar.collapsed .nav-link { justify-content: center; padding: 0.75rem 0; gap: 0; }
        .sidebar.collapsed .nav-link i { margin-right: 0; font-size: 1.15rem; width: auto; }
        .sidebar.collapsed .nav-link:hover { padding-left: 0; }
        .sidebar.collapsed .sidebar-footer small { font-size: 0; }
        .sidebar.collapsed .sidebar-footer small i { font-size: 0.9rem; }
        
        /* Tooltip on collapsed nav items */
        .sidebar.collapsed .nav-link { position: relative; }
        .sidebar.collapsed .nav-link::before {
            content: attr(data-tooltip);
            position: absolute;
            left: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%);
            background: var(--navy-900);
            color: var(--gold-300);
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition-fast);
            z-index: var(--z-tooltip);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(201, 168, 76, 0.2);
        }
        .sidebar.collapsed .nav-link:hover::before { opacity: 1; }
        
        /* =============================================
           DARK MODE
           ============================================= */
        .dark-mode { color: var(--dark-text); background-color: var(--dark-bg); }
        
        .dark-mode .top-navbar {
            background: linear-gradient(180deg, 
                rgba(20, 25, 41, 0.98) 0%, 
                rgba(20, 25, 41, 0.94) 100%);
            border-color: rgba(201, 168, 76, 0.06);
        }
        .dark-mode .top-navbar::after { background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.1), transparent); }
        
        .dark-mode #pageTitle {
            background: linear-gradient(135deg, 
                var(--gold-400) 0%, 
                var(--gold-500) 40%, 
                var(--gold-300) 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }
        
        .dark-mode .toggle-btn { color: var(--dark-text); }
        .dark-mode .toggle-btn:hover { color: var(--gold-400); background: rgba(201, 168, 76, 0.08); }
        .dark-mode .dropdown-menu { background: var(--dark-surface); border-color: rgba(201, 168, 76, 0.08); }
        .dark-mode .dropdown-item { color: var(--dark-text); }
        .dark-mode .dropdown-item i { color: var(--bronze-400); }
        .dark-mode .main-content { background-color: var(--dark-bg); }
        .dark-mode h1, .dark-mode h2, .dark-mode h3,
        .dark-mode h4, .dark-mode h5, .dark-mode h6 { color: var(--gold-200); }
        .dark-mode .user-status-indicator { border-color: var(--dark-surface); }
        
        /* =============================================
           SCROLLBAR STYLING
           ============================================= */
        @media (hover: hover) {
            ::-webkit-scrollbar { width: 6px; height: 6px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: var(--neutral-500); border-radius: var(--radius-full); border: 1px solid transparent; background-clip: padding-box; }
            ::-webkit-scrollbar-thumb:hover { background: var(--neutral-600); }
            .sidebar::-webkit-scrollbar-thumb { background: rgba(201, 168, 76, 0.2); }
            .sidebar::-webkit-scrollbar-thumb:hover { background: rgba(201, 168, 76, 0.35); }
        }
        
        @-moz-document url-prefix() {
            * { scrollbar-width: thin; scrollbar-color: var(--neutral-500) transparent; }
            .sidebar { scrollbar-color: rgba(201, 168, 76, 0.2) transparent; }
        }
        
        /* =============================================
           RESPONSIVE DESIGN
           ============================================= */
        @media (max-width: 1200px) {
            :root { --sidebar-width: 250px; }
        }
        
        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); width: 285px; }
            .sidebar.show-mobile { transform: translateX(0); box-shadow: var(--shadow-2xl); }
            .sidebar.collapsed { width: 285px; transform: translateX(-100%); }
            .sidebar.collapsed .sidebar-brand h4,
            .sidebar.collapsed .sidebar-brand .brand-tagline,
            .sidebar.collapsed .nav-link span,
            .sidebar.collapsed .sidebar-footer small span { display: initial; }
            .sidebar.collapsed .nav-link { justify-content: flex-start; padding: 0.7rem 0.9rem; gap: 0.8rem; }
            .sidebar.collapsed .nav-link::before { display: none; }
            .main-content { margin-left: 0 !important; }
            .main-content.expanded { margin-left: 0 !important; }
        }
        
        @media (max-width: 768px) {
            .top-navbar { padding: 0.7rem 1rem; flex-wrap: wrap; gap: 0.6rem; border-radius: var(--radius-lg); }
            #pageTitle { font-size: 1.15rem; }
            .main-content { padding: var(--space-4); }
        }
        
        @media (max-width: 480px) {
            .user-avatar { width: 32px; height: 32px; }
            .user-avatar i { font-size: 0.7rem; }
            #username { display: none; }
        }
        
        /* =============================================
           PRINT STYLES
           ============================================= */
        @media print {
            .sidebar, .sidebar-overlay, .top-navbar,
            #darkModeToggleSidebar, #darkModeToggleTop,
            .toggle-btn, .skip-link { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 0 !important; width: 100% !important; }
            body { background: white !important; color: black !important; font-size: 12pt; line-height: 1.6; }
            * { background: transparent !important; box-shadow: none !important; text-shadow: none !important; }
            a[href]::after { content: " (" attr(href) ")"; font-size: 0.8em; color: #666; }
            @page { margin: 2cm; size: A4; }
        }
        
        /* =============================================
           UTILITY CLASSES
           ============================================= */
        .text-gold { color: var(--gold-500) !important; }
        .text-navy { color: var(--navy-900) !important; }
        .text-bronze { color: var(--bronze-500) !important; }
        
        .bg-gold-light { background-color: var(--gold-100) !important; }
        .bg-cream { background-color: var(--neutral-200) !important; }
        .bg-surface { background-color: var(--surface-primary) !important; }
        
        .font-display { font-family: var(--font-display) !important; }
        .font-body { font-family: var(--font-body) !important; }
        
        .shadow-gold { box-shadow: var(--shadow-gold-sm) !important; }
        .shadow-lux { box-shadow: var(--shadow-xl) !important; }
        
        .radius-lg { border-radius: var(--radius-lg) !important; }
        .radius-xl { border-radius: var(--radius-xl) !important; }
        
        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }
        
        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        
        /* Smooth theme transitions */
        body, .sidebar, .main-content, .top-navbar,
        .dropdown-menu, .nav-link, .card,
        input, select, textarea {
            transition: background-color var(--transition-slow),
                        color var(--transition-slow),
                        border-color var(--transition-slow),
                        box-shadow var(--transition-slow);
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    
    <!-- Skip Navigation Link (Accessibility) -->
    <a href="#mainContent" class="skip-link">Skip to main content</a>

    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- =============================================
         SIDEBAR NAVIGATION
         60% Navy Base | 10% Gold Accents
         ============================================= -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-brand">
            <span class="sidebar-brand-icon" aria-hidden="true">
                <i class="fas fa-building-columns"></i>
            </span>
            <h4>Grand Hotel</h4>
            <p class="brand-tagline">Management Suite</p>
        </div>
        
        <nav class="sidebar-nav" id="mainNavMenu" aria-label="Primary Navigation">
            <div class="sidebar-loading">
                <i class="fas fa-spinner fa-pulse" aria-hidden="true"></i> 
                <span>Authenticating...</span>
            </div>
        </nav>
        
        <div class="sidebar-footer">
            <small>
                <i class="fas fa-shield-halved" aria-hidden="true"></i>
                <span>Secure v2.1 &bull; Est. 2025</span>
            </small>
        </div>
    </aside>

    <!-- =============================================
         MAIN CONTENT AREA
         60% Cream Base
         ============================================= -->
    <main class="main-content" id="mainContent">
        
        <!-- Top Navigation Bar (30% Navy accent, 10% Gold) -->
        <header class="top-navbar" role="banner">
            <div class="d-flex align-items-center gap-3">
                <button id="sidebarToggle" 
                        class="toggle-btn" 
                        title="Toggle Sidebar Navigation (Ctrl+B)" 
                        aria-label="Toggle sidebar"
                        aria-expanded="true"
                        type="button">
                    <i class="fas fa-bars-staggered" aria-hidden="true"></i>
                </button>
                <h5 class="mb-0" id="pageTitle">Executive Dashboard</h5>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Dark Mode Toggle (10% Gold highlight) -->
                <button id="darkModeToggleTop" 
                        class="toggle-btn" 
                        title="Toggle Dark Mode" 
                        aria-label="Toggle dark mode"
                        type="button">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
                
                <!-- User Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-link text-decoration-none d-flex align-items-center gap-2 dropdown-toggle p-0 border-0 bg-transparent" 
                            id="userDropdownButton"
                            data-bs-toggle="dropdown" 
                            aria-expanded="false"
                            aria-haspopup="true"
                            type="button">
                        <div class="user-avatar-wrapper">
                            <div class="user-avatar">
                                <i class="fas fa-user" aria-hidden="true"></i>
                            </div>
                            <span class="user-status-indicator" aria-label="Online"></span>
                        </div>
                        <span id="username" class="fw-semibold d-none d-sm-inline" 
                              style="color: var(--navy-900); font-size: 0.88rem;">
                            Authenticating...
                        </span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="userDropdownButton">
                        <li><h6 class="dropdown-header">Account</h6></li>
                        
                        <li>
                            <a class="dropdown-item text-danger" href="/logout">
                                <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                                Secure Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>
        
        <!-- Dynamic Content Area -->
        <div class="container-fluid p-0 content-fade-in">
            {% block content %}
            <!-- Child templates inject content here -->
            {% endblock %}
        </div>
        
    </main>

    <!-- Global Modals Container -->
    <div id="modals-container" aria-live="polite" aria-atomic="true"></div>
    
    <!-- =============================================
         JAVASCRIPT DEPENDENCIES
         ============================================= -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=6"></script>
    <script src="{{ url_for('static', filename='js/modals.js') }}?v=6"></script>
    
    <!-- =============================================
         GRAND HOTEL APPLICATION CORE
         Module Revealing Pattern | Robust Error Handling
         ============================================= -->
    <script>
        /**
         * Grand Hotel Luxury Management System
         * Application Core v2.1.0
         * 
         * Architecture: Module Revealing Pattern
         * Dependencies: jQuery 3.6+, Bootstrap 5.1.3
         */
        (function() {
            'use strict';
            
            // ── Immutable Configuration ──
            const CONFIG = Object.freeze({
                version: '2.1.0',
                storage: {
                    themeKey: 'grand_hotel_theme_v2',
                    sidebarKey: 'grand_hotel_sidebar_state'
                },
                sidebar: {
                    expandedWidth: 270,
                    collapsedWidth: 80,
                    mobileBreakpoint: 992
                },
                api: {
                    authEndpoint: '/api/users/check-auth',
                    timeout: 15000,
                    retryAttempts: 1
                },
                menu: {
                    admin: [
                        { name: 'Executive Dashboard', icon: 'fas fa-crown', path: '/dashboard' },
                        { name: 'Reservations', icon: 'fas fa-calendar-check', path: '/bookings' },
                        { name: 'Room Management', icon: 'fas fa-door-open', path: '/rooms' },
                        { name: 'Amenities', icon: 'fas fa-spa', path: '/amenities' },
                        { name: 'Promotions', icon: 'fas fa-ticket-alt', path: '/coupons' },
                        { name: 'Guest Registry', icon: 'fas fa-users', path: '/users' },
                        { name: 'Financial Reports', icon: 'fas fa-chart-pie', path: '/reports' },
                        { name: 'Booking Calendar', icon: 'fas fa-calendar-alt', path: '/calendar' },
                        { name: 'Guest Reviews', icon: 'fas fa-star', path: '/reviews' }
                    ],
                    receptionist: [
                        { name: 'Front Desk', icon: 'fas fa-concierge-bell', path: '/dashboard' },
                        { name: 'Reservations', icon: 'fas fa-calendar-check', path: '/bookings' },
                        { name: 'Room Status', icon: 'fas fa-door-open', path: '/rooms' },
                        { name: 'Calendar View', icon: 'fas fa-calendar-alt', path: '/calendar' }
                        
                    ],
                    // In base.html, find CONFIG.menu and update the manager array:
manager: [
    { name: 'Management Dashboard', icon: 'fas fa-chart-line', path: '/dashboard' },
    { name: 'Reservations', icon: 'fas fa-calendar-check', path: '/bookings' },
    { name: 'Room Management', icon: 'fas fa-door-open', path: '/rooms' },
    { name: 'Amenities', icon: 'fas fa-spa', path: '/amenities' },
    { name: 'Promotions', icon: 'fas fa-ticket-alt', path: '/coupons' },
    { name: 'Guest Registry', icon: 'fas fa-users', path: '/users' },
    { name: 'Performance Reports', icon: 'fas fa-chart-bar', path: '/reports' },
    { name: 'Booking Calendar', icon: 'fas fa-calendar-alt', path: '/calendar' },
    { name: 'Guest Reviews', icon: 'fas fa-star', path: '/reviews' }
],
                    guest: [
                        { name: 'Guest Portal', icon: 'fas fa-home', path: '/dashboard' },
                        { name: 'My Reservations', icon: 'fas fa-bookmark', path: '/my-bookings' },
                        { name: 'My Reviews', icon: 'fas fa-star', path: '/my-reviews' },
                        { name: 'Browse Rooms', icon: 'fas fa-search', path: '/browse-rooms' },
                        { name: 'Booking Calendar', icon: 'fas fa-calendar-alt', path: '/calendar' },
                    ]
                }
            });
            
            // ── Application State ──
            const state = {
                isInitialized: false,
                isMobile: false,
                isSidebarCollapsed: false,
                isMobileSidebarOpen: false,
                isDarkMode: false,
                currentUser: null,
                isAuthenticated: false,
                authCheckAttempts: 0
            };
            
            // ── DOM Reference Cache (Lazy Getters) ──
            const DOM = {
                get body() { return document.body; },
                get sidebar() { return document.getElementById('sidebar'); },
                get sidebarOverlay() { return document.getElementById('sidebarOverlay'); },
                get mainContent() { return document.getElementById('mainContent'); },
                get sidebarToggle() { return document.getElementById('sidebarToggle'); },
                get darkModeToggleTop() { return document.getElementById('darkModeToggleTop'); },
                get darkModeToggleSidebar() { return document.getElementById('darkModeToggleSidebar'); },
                get pageTitle() { return document.getElementById('pageTitle'); },
                get username() { return document.getElementById('username'); },
                get navMenu() { return document.getElementById('mainNavMenu'); }
            };
            
            // ── Utility Functions ──
            function detectMobile() {
                return window.innerWidth <= CONFIG.sidebar.mobileBreakpoint;
            }
            
            function debounce(fn, delay = 250) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }
            
            function escapeHTML(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            
            function saveToStorage(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (e) {
                    console.warn('localStorage unavailable:', e.message);
                    return false;
                }
            }
            
            function getFromStorage(key, defaultValue = null) {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) {
                    return defaultValue;
                }
            }
            
            // ── Sidebar Management ──
            function toggleSidebar() {
                state.isMobile = detectMobile();
                
                if (state.isMobile) {
                    toggleMobileSidebar();
                } else {
                    toggleDesktopSidebar();
                }
            }
            
            function toggleMobileSidebar() {
                state.isMobileSidebarOpen = !state.isMobileSidebarOpen;
                
                DOM.sidebar?.classList.toggle('show-mobile', state.isMobileSidebarOpen);
                DOM.sidebarOverlay?.classList.toggle('active', state.isMobileSidebarOpen);
                DOM.sidebar?.classList.remove('collapsed');
                DOM.mainContent?.classList.remove('expanded');
                
                document.body.style.overflow = state.isMobileSidebarOpen ? 'hidden' : '';
                updateAriaAttributes();
            }
            
            function closeMobileSidebar() {
                if (!state.isMobileSidebarOpen) return;
                state.isMobileSidebarOpen = false;
                DOM.sidebar?.classList.remove('show-mobile');
                DOM.sidebarOverlay?.classList.remove('active');
                document.body.style.overflow = '';
                updateAriaAttributes();
            }
            
            function toggleDesktopSidebar() {
                state.isSidebarCollapsed = !state.isSidebarCollapsed;
                
                DOM.sidebar?.classList.toggle('collapsed', state.isSidebarCollapsed);
                DOM.mainContent?.classList.toggle('expanded', state.isSidebarCollapsed);
                DOM.sidebar?.classList.remove('show-mobile');
                DOM.sidebarOverlay?.classList.remove('active');
                
                updateToggleIcon();
                updateAriaAttributes();
                saveSidebarState();
            }
            
            function updateToggleIcon() {
                const icon = DOM.sidebarToggle?.querySelector('i');
                if (!icon) return;
                icon.classList.toggle('fa-bars-staggered', !state.isSidebarCollapsed);
                icon.classList.toggle('fa-indent', state.isSidebarCollapsed);
            }
            
            function updateAriaAttributes() {
                if (!DOM.sidebarToggle) return;
                const isExpanded = !state.isSidebarCollapsed && !state.isMobileSidebarOpen;
                DOM.sidebarToggle.setAttribute('aria-expanded', String(isExpanded));
                DOM.sidebarOverlay?.setAttribute('aria-hidden', String(!state.isMobileSidebarOpen));
            }
            
            function saveSidebarState() {
                saveToStorage(CONFIG.storage.sidebarKey, {
                    collapsed: state.isSidebarCollapsed
                });
            }
            
            function restoreSidebarState() {
                const saved = getFromStorage(CONFIG.storage.sidebarKey);
                if (saved?.collapsed && !detectMobile()) {
                    state.isSidebarCollapsed = true;
                    DOM.sidebar?.classList.add('collapsed');
                    DOM.mainContent?.classList.add('expanded');
                    updateToggleIcon();
                }
            }
            
            // ── Authentication & Menu Building ──
            async function authenticate() {
                if (state.authCheckAttempts > CONFIG.api.retryAttempts) {
                    handleAuthFailure('Authentication failed after multiple attempts');
                    return;
                }
                
                state.authCheckAttempts++;
                
                try {
                    const response = await $.ajax({
                        url: CONFIG.api.authEndpoint,
                        method: 'GET',
                        dataType: 'json',
                        timeout: CONFIG.api.timeout
                    });
                    
                    if (response.authenticated) {
                        state.isAuthenticated = true;
                        state.currentUser = {
                            role: response.role,
                            username: response.user,
                            fullName: response.full_name || response.user || 'Valued Guest',
                            userId: response.user_id
                        };
                        
                        if (DOM.username) {
                            DOM.username.textContent = state.currentUser.fullName;
                        }
                        
                        buildNavigationMenu(state.currentUser.role);
                        updateActiveMenuAndTitle();
                        
                        // Dispatch custom event for other modules
                        document.dispatchEvent(new CustomEvent('userAuthenticated', {
                            detail: state.currentUser
                        }));
                    } else {
                        handleAuthFailure('Session expired');
                    }
                } catch (error) {
                    console.error('Authentication error:', error);
                    handleAuthFailure('Connection error');
                }
            }
            
            function handleAuthFailure(reason) {
                if (DOM.username) {
                    DOM.username.textContent = reason;
                }
                
                if (typeof window.showNotification === 'function') {
                    window.showNotification('Redirecting to login...', 'warning', 2500);
                }
                
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            }
            
            function buildNavigationMenu(role) {
                if (!DOM.navMenu) return;
                
                const menuItems = CONFIG.menu[role] || CONFIG.menu.guest;
                const currentPath = window.location.pathname;
                
                let html = '';
                
                menuItems.forEach(item => {
                    const itemPath = item.path.split('#')[0];
                    const isActive = checkActiveState(itemPath, currentPath);
                    
                    html += `
                        <a class="nav-link${isActive ? ' active' : ''}" 
                           href="${item.path}" 
                           data-nav-item="${item.name.toLowerCase().replace(/\s+/g, '-')}"
                           data-tooltip="${escapeHTML(item.name)}"
                           ${isActive ? 'aria-current="page"' : ''}>
                            <i class="${item.icon}" aria-hidden="true"></i>
                            <span>${item.name}</span>
                            <span class="nav-active-indicator" aria-hidden="true">◆</span>
                        </a>
                    `;
                });
                
                // Theme toggle within sidebar
                html += `
                    <div class="mt-3 pt-2" style="border-top: 1px solid rgba(201, 168, 76, 0.15);"></div>
                    <button class="nav-link" id="darkModeToggleSidebar" type="button" data-tooltip="Toggle Theme">
                        <i class="fas fa-moon" aria-hidden="true"></i>
                        <span>Evening Mode</span>
                    </button>
                `;
                
                DOM.navMenu.innerHTML = html;
                bindDarkModeToggles();
            }
            
            function checkActiveState(itemPath, currentPath) {
                if (currentPath === itemPath) return true;
                if (currentPath === '/' && itemPath === '/dashboard') return true;
                if (itemPath !== '/dashboard' && itemPath !== '/' && currentPath.startsWith(itemPath)) return true;
                return false;
            }
            
            function updateActiveMenuAndTitle() {
                const currentPath = window.location.pathname;
                let activeTitle = 'Grand Hotel';
                
                document.querySelectorAll('.sidebar .nav-link[data-nav-item]').forEach(link => {
                    const linkPath = (link.getAttribute('href') || '').split('#')[0];
                    const isActive = checkActiveState(linkPath, currentPath);
                    
                    link.classList.toggle('active', isActive);
                    link.setAttribute('aria-current', isActive ? 'page' : 'false');
                    
                    if (isActive) {
                        const span = link.querySelector('span:first-of-type');
                        if (span) activeTitle = span.textContent.trim();
                    }
                });
                
                if (DOM.pageTitle) {
                    DOM.pageTitle.textContent = activeTitle;
                }
            }
            
            // ── Dark Mode Management ──
            function initDarkMode() {
                const saved = getFromStorage(CONFIG.storage.themeKey);
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                
                state.isDarkMode = saved === 'dark' || (!saved && prefersDark);
                applyDarkMode();
                
                // Listen for system theme changes
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (!localStorage.getItem(CONFIG.storage.themeKey)) {
                        state.isDarkMode = e.matches;
                        applyDarkMode();
                    }
                });
                
                bindDarkModeToggles();
            }
            
            function bindDarkModeToggles() {
                const topToggle = document.getElementById('darkModeToggleTop');
                const sidebarToggle = document.getElementById('darkModeToggleSidebar');
                
                [topToggle, sidebarToggle].forEach(btn => {
                    if (btn && !btn._bound) {
                        btn.addEventListener('click', (e) => {
                            e.preventDefault();
                            toggleDarkMode();
                        });
                        btn._bound = true;
                    }
                });
            }
            
            function toggleDarkMode() {
                state.isDarkMode = !state.isDarkMode;
                saveToStorage(CONFIG.storage.themeKey, state.isDarkMode ? 'dark' : 'light');
                applyDarkMode();
            }
            
            function applyDarkMode() {
                document.body.classList.toggle('dark-mode', state.isDarkMode);
                updateDarkModeUI();
            }
            
            function updateDarkModeUI() {
                const isDark = state.isDarkMode;
                
                // Update all dark mode toggle icons
                document.querySelectorAll('#darkModeToggleTop i, #darkModeToggleSidebar i').forEach(icon => {
                    icon.classList.toggle('fa-moon', !isDark);
                    icon.classList.toggle('fa-sun', isDark);
                });
                
                const sidebarToggle = document.getElementById('darkModeToggleSidebar');
                if (sidebarToggle) {
                    const span = sidebarToggle.querySelector('span');
                    if (span) span.textContent = isDark ? 'Morning Mode' : 'Evening Mode';
                }
                
                // Update meta theme-color
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (metaTheme) {
                    metaTheme.content = isDark ? '#0a0f1a' : '#1a2744';
                }
            }
            
            // ── Event Binding ──
            function bindEvents() {
                // Sidebar toggle button
                DOM.sidebarToggle?.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleSidebar();
                });
                
                // Overlay click (mobile close)
                DOM.sidebarOverlay?.addEventListener('click', closeMobileSidebar);
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    // Ctrl/Cmd + B: Toggle sidebar
                    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    
                    // Escape: Close mobile sidebar
                    if (e.key === 'Escape' && state.isMobileSidebarOpen) {
                        closeMobileSidebar();
                    }
                });
                
                // Resize handler (debounced)
                window.addEventListener('resize', debounce(() => {
                    const wasMobile = state.isMobile;
                    state.isMobile = detectMobile();
                    
                    if (!state.isMobile && wasMobile) {
                        closeMobileSidebar();
                        restoreSidebarState();
                    }
                    
                    if (state.isMobile) {
                        DOM.sidebar?.classList.remove('collapsed');
                        DOM.mainContent?.classList.remove('expanded');
                    }
                }, 300));
                
                // Mobile menu link click handler
                DOM.navMenu?.addEventListener('click', (e) => {
                    const link = e.target.closest('.nav-link[href]');
                    if (link && detectMobile()) {
                        setTimeout(closeMobileSidebar, 200);
                    }
                });
            }
            
            // ── Application Initialization ──
            async function initialize() {
                if (state.isInitialized) {
                    console.warn('Application already initialized');
                    return;
                }
                
                console.log(`%c🏨 Grand Hotel Luxury Management System v${CONFIG.version} %cInitializing...`,
                    'color: #c9a84c; font-size: 1.1em; font-weight: bold;',
                    'color: #8b7355;');
                
                state.isMobile = detectMobile();
                
                bindEvents();
                restoreSidebarState();
                initDarkMode();
                
                await authenticate();
                
                state.isInitialized = true;
                
                console.log('%c✅ Application initialized successfully',
                    'color: #2d6a4f; font-weight: bold;');
            }
            
            // ── Start on DOM Ready ──
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initialize);
            } else {
                initialize();
            }
            
            // ── Public API ──
            window.GrandHotel = Object.freeze({
                version: CONFIG.version,
                toggleSidebar,
                toggleDarkMode,
                closeMobileSidebar,
                getState: () => ({ ...state }),
                getCurrentUser: () => state.currentUser ? { ...state.currentUser } : null,
                isAuthenticated: () => state.isAuthenticated
            });
            
        })();
    </script>
    
    <!-- =============================================
         SAFARI BACKDROP-FILTER FALLBACK
         ============================================= -->
    <style>
        @supports not ((-webkit-backdrop-filter: blur(20px)) or (backdrop-filter: blur(20px))) {
            .top-navbar { background: var(--surface-primary); }
            .dark-mode .top-navbar { background: var(--dark-surface); }
        }
        
        /* High contrast mode adjustments */
        @media (forced-colors: active) {
            .sidebar .nav-link.active { border: 2px solid Highlight; }
            .toggle-btn:focus-visible { outline: 2px solid Highlight; }
        }
    </style>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
