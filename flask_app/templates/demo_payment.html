<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCash Demo Payment - Grand Hotel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=11">
</head>
<body class="auth-page-body">

    <div class="gcash-demo-container" data-booking-id="{{ booking_id }}">
        <div class="gcash-logo-header">
            <i class="fas fa-mobile-alt fa-3x mb-2"></i>
            <h3 class="mb-0 fw-bold">GCash Payment</h3>
            <span class="demo-badge shadow-sm mt-2"><i class="fas fa-flask"></i> DEMO MODE</span>
        </div>
        
        <div class="text-center mb-3">
            <p class="text-muted fw-bold mb-1 text-uppercase" style="letter-spacing: 1px; font-size: 0.8rem;">Booking Reference</p>
            <h4 class="fw-bold text-primary" id="bookingIdDisplay"></h4>
        </div>
        
        <div class="qr-code-box shadow-sm">
            <i class="fas fa-qrcode fa-5x mb-3" style="color: #0077B6;"></i>
            <div class="amount-display" id="amountDisplay">₱ 0.00</div>
            <p class="mt-2 mb-1 fw-bold text-dark">Scan QR Code with GCash App</p>
            <small class="text-muted fw-bold">Demo QR - No actual payment will be charged</small>
        </div>
        
        <div class="alert alert-info border-0 shadow-sm" style="background: rgba(14, 165, 233, 0.1); color: var(--secondary);">
            <i class="fas fa-info-circle me-2"></i> 
            <strong>Demo Mode:</strong> Click "Confirm Demo Payment" to simulate a successful transaction.
            <hr class="my-2 opacity-25">
            <small class="fw-bold">No actual charges will be made to your account.</small>
        </div>
        
        <form id="demoPaymentForm" class="mt-4">
            <button type="submit" class="btn btn-success btn-lg w-100 shadow" id="payButton" style="padding: 14px; border-radius: 10px;">
                <i class="fas fa-check-circle me-2"></i> Confirm Demo Payment
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="#" onclick="window.close(); return false;" class="text-muted fw-bold text-decoration-none hover-primary" style="transition: 0.2s;">
                <i class="fas fa-times-circle me-1"></i> Cancel Payment
            </a>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get booking ID from data attribute (no Jinja2 in JavaScript)
        var container = document.querySelector('.gcash-demo-container');
        var bookingIdValue = parseInt(container.getAttribute('data-booking-id'));
        var phpAmount = 2500.00;
        
        // Display booking ID
        var bookingIdDisplayElement = document.getElementById('bookingIdDisplay');
        if (bookingIdDisplayElement) {
            bookingIdDisplayElement.innerHTML = '#' + bookingIdValue;
        }
        
        // Display the amount
        var amountDisplayElement = document.getElementById('amountDisplay');
        if (amountDisplayElement) {
            amountDisplayElement.innerHTML = '₱ ' + phpAmount.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
        
        // Handle form submission
        jQuery('#demoPaymentForm').on('submit', function(event) {
            event.preventDefault();
            
            var button = jQuery('#payButton');
            var originalText = button.html();
            
            // Show loading state
            button.html('<span class="loading-spinner spinner-sm"></span> Processing...');
            button.prop('disabled', true);
            
            // Show processing message
            showNotificationMessage('Processing your payment...', 'info');
            
            jQuery.ajax({
                url: window.location.href,
                method: 'POST',
                success: function(responseData) {
                    if (responseData.success) {
                        showNotificationMessage('Payment successful! Redirecting to ticket...', 'success');
                        setTimeout(function() {
                            window.location.href = '/api/payments/ticket/' + responseData.booking_id;
                        }, 1500);
                    } else {
                        showNotificationMessage('Payment failed: ' + (responseData.message || 'Unknown error'), 'error');
                        button.html(originalText);
                        button.prop('disabled', false);
                    }
                },
                error: function(xhrObject, statusText, errorString) {
                    console.error('Payment error:', errorString);
                    var errorMsg = 'Payment processing failed';
                    if (xhrObject.responseJSON && xhrObject.responseJSON.message) {
                        errorMsg = xhrObject.responseJSON.message;
                    }
                    showNotificationMessage(errorMsg, 'error');
                    button.html(originalText);
                    button.prop('disabled', false);
                }
            });
        });
        
        function showNotificationMessage(messageText, messageType) {
            // Remove existing alert
            jQuery('.custom-alert').remove();
            
            var alertClass = '';
            var iconHtml = '';
            
            if (messageType === 'error') {
                alertClass = 'danger';
                iconHtml = '<i class="fas fa-exclamation-circle me-2"></i> ';
            } else if (messageType === 'success') {
                alertClass = 'success';
                iconHtml = '<i class="fas fa-check-circle me-2"></i> ';
            } else {
                alertClass = 'info';
                iconHtml = '<i class="fas fa-info-circle me-2"></i> ';
            }
            
            var alertHtml = '<div class="alert alert-' + alertClass + ' alert-dismissible fade show custom-alert border-0 shadow" role="alert" style="position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 300px; border-radius: 12px;">' +
                iconHtml + '<strong>' + messageText + '</strong>' +
                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                '</div>';
            
            jQuery('body').append(alertHtml);
            
            setTimeout(function() {
                jQuery('.custom-alert').fadeOut(500, function() {
                    jQuery(this).remove();
                });
            }, 4000);
        }
    </script>
</body>
</html>
