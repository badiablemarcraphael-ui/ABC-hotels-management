{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 fade-in">
    <h2 class="fw-bold mb-0"><i class="fas fa-ticket-alt text-primary me-2"></i> Coupon Management</h2>
    <div>
        <button class="btn btn-outline-primary shadow-sm fw-bold me-2" onclick="toggleSortOrder()" id="sortBtn">
            <i class="fas fa-sort-amount-down me-1"></i> Discount: <span id="sortLabel">Highest to Lowest</span>
        </button>
        <button class="btn btn-primary shadow-sm fw-bold" onclick="showAddCouponModal()">
            <i class="fas fa-plus me-1"></i> Add Coupon
        </button>
    </div>
</div>

<div class="filter-bar fade-in" style="animation-delay: 0.1s;">
    <div class="row align-items-end g-3">
        <div class="col-md-4">
            <label for="searchInput" class="fw-bold text-muted mb-1"><i class="fas fa-search me-1"></i> Search</label>
            <input type="text" id="searchInput" class="form-control shadow-sm" placeholder="Search by coupon code...">
        </div>
        <div class="col-md-3">
            <label for="statusFilter" class="fw-bold text-muted mb-1"><i class="fas fa-filter me-1"></i> Status</label>
            <select id="statusFilter" class="form-select shadow-sm">
                <option value="all">All Coupons</option>
                <option value="active">Active Only</option>
                <option value="inactive">Inactive Only</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="validityFilter" class="fw-bold text-muted mb-1"><i class="fas fa-calendar me-1"></i> Validity</label>
            <select id="validityFilter" class="form-select shadow-sm">
                <option value="all">All</option>
                <option value="valid">Valid Now</option>
                <option value="expired">Expired</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="fw-bold d-block mb-1">&nbsp;</label>
            <button class="btn btn-secondary w-100 fw-bold shadow-sm" onclick="loadCoupons()">
                <i class="fas fa-sync-alt me-1"></i> Refresh
            </button>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-12">
            <small class="text-muted fw-bold border-start border-3 border-primary ps-2" id="couponCount">Loading coupons...</small>
        </div>
    </div>
</div>

<div class="row g-4 fade-in" style="animation-delay: 0.2s;" id="couponsList">
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary mb-3" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted fw-bold">Loading coupons...</p>
    </div>
</div>

<script>
(function() {
    function waitForjQuery() {
        if (typeof jQuery !== 'undefined') {
            console.log("✅ jQuery loaded, initializing coupons page...");
            initCouponsPage();
        } else {
            setTimeout(waitForjQuery, 100);
        }
    }
    waitForjQuery();
})();

let allCoupons = [];
let sortAscending = false;

function initCouponsPage() {
    loadCoupons();
    $('#searchInput').on('keyup', filterCoupons);
    $('#statusFilter').on('change', filterCoupons);
    $('#validityFilter').on('change', filterCoupons);
}

function toggleSortOrder() {
    sortAscending = !sortAscending;
    $('#sortLabel').text(sortAscending ? 'Lowest to Highest' : 'Highest to Lowest');
    $('#sortBtn i').toggleClass('fa-sort-amount-down fa-sort-amount-up');
    filterCoupons();
}

function loadCoupons() {
    $.ajax({
        url: '/api/coupons/list',
        method: 'GET',
        success: function(coupons) {
            allCoupons = coupons;
            filterCoupons();
        },
        error: function() {
            $('#couponsList').html('<div class="col-12 text-center text-danger py-5"><i class="fas fa-exclamation-triangle fa-3x mb-3"></i><h5 class="fw-bold">Error loading coupons</h5></div>');
        }
    });
}

function filterCoupons() {
    const searchTerm = $('#searchInput').val().toLowerCase();
    const statusFilter = $('#statusFilter').val();
    const validityFilter = $('#validityFilter').val();
    const today = new Date().toISOString().split('T')[0];

    let filtered = allCoupons.filter(coupon => {
        if (searchTerm && !coupon.coupon_code.toLowerCase().includes(searchTerm)) return false;
        if (statusFilter === 'active' && !coupon.is_active) return false;
        if (statusFilter === 'inactive' && coupon.is_active) return false;

        if (validityFilter === 'valid') {
            let isValid = true;
            if (coupon.valid_from && coupon.valid_from > today) isValid = false;
            if (coupon.valid_until && coupon.valid_until < today) isValid = false;
            if (!coupon.is_active) isValid = false;
            if (coupon.used_count >= coupon.usage_limit) isValid = false;
            if (!isValid) return false;
        }
        if (validityFilter === 'expired') {
            let isExpired = false;
            if (coupon.valid_until && coupon.valid_until < today) isExpired = true;
            if (coupon.used_count >= coupon.usage_limit) isExpired = true;
            if (!coupon.is_active) isExpired = true;
            if (!isExpired) return false;
        }
        return true;
    });

    filtered.sort(function(a, b) {
        var discountA = parseFloat(a.discount_value) || 0;
        var discountB = parseFloat(b.discount_value) || 0;
        return sortAscending ? discountA - discountB : discountB - discountA;
    });

    displayCoupons(filtered);
    $('#couponCount').text('Showing ' + filtered.length + ' of ' + allCoupons.length + ' coupons');
}

function displayCoupons(coupons) {
    let html = '';
    const today = new Date().toISOString().split('T')[0];

    if (coupons.length === 0) {
        html = '<div class="col-12 text-center py-5"><i class="fas fa-ticket-alt fa-3x text-muted opacity-50 mb-3"></i><h5 class="text-muted fw-bold">No coupons found</h5><p class="text-muted">Try adjusting your filters.</p></div>';
    } else {
        coupons.forEach(function(coupon) {
            const statusClass = coupon.is_active ? 'status-active' : 'status-inactive';
            const statusText = coupon.is_active ? 'Active' : 'Inactive';
            const statusDot = coupon.is_active ? 'text-success' : 'text-danger';
            const discountSymbol = coupon.discount_type === 'percentage' ? '%' : '₱';
            const discountValue = parseFloat(coupon.discount_value) || 0;
            const discountDisplay = coupon.discount_type === 'fixed' ? window.formatPHP(discountValue) : discountValue;

            let validityText = '';
            if (coupon.valid_from && coupon.valid_from > today) {
                validityText = '<span class="badge bg-warning text-dark"><i class="fas fa-hourglass-start me-1"></i>Starts: ' + coupon.valid_from + '</span>';
            } else if (coupon.valid_until && coupon.valid_until < today) {
                validityText = '<span class="badge bg-danger"><i class="fas fa-exclamation-triangle me-1"></i>Expired: ' + coupon.valid_until + '</span>';
            } else if (coupon.used_count >= coupon.usage_limit) {
                validityText = '<span class="badge bg-danger"><i class="fas fa-ban me-1"></i>Limit reached</span>';
            } else {
                validityText = '<span class="badge bg-success"><i class="fas fa-check me-1"></i>Valid now</span>';
            }

            html += `
                <div class="col-md-6 col-lg-4 fade-in">
                    <div class="coupon-card h-100 d-flex flex-column shadow-sm" style="border-radius: 20px; overflow: hidden; border: 1px solid rgba(0,0,0,0.06); background: white; transition: all 0.3s ease;">
                        <div class="coupon-code text-center py-3 fw-bold" style="background: linear-gradient(135deg, #1a2744, #243356); color: #c9a84c; font-family: 'Courier New', monospace; font-size: 1.4rem; letter-spacing: 2px;">
                            <i class="fas fa-ticket-alt me-2"></i>${escapeHtml(coupon.coupon_code)}
                        </div>
                        <div class="card-body d-flex flex-column p-4">
                            <h3 class="text-center fw-bold mb-3" style="color: #1a2744; font-size: 2rem;">
                                ${coupon.discount_type === 'fixed' ? '₱' : ''}${discountDisplay}${coupon.discount_type === 'percentage' ? '% OFF' : ' OFF'}
                            </h3>
                            <div class="mb-3 p-3 rounded-3" style="background: rgba(100,116,139,0.04);">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted"><i class="fas fa-shopping-cart me-1"></i>Min. Spend:</span>
                                    <strong>${window.formatPHP(coupon.min_booking_amount || 0)}</strong>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted"><i class="fas fa-calendar-alt me-1"></i>Valid:</span>
                                    <strong>${coupon.valid_from ? coupon.valid_from : 'Any'} → ${coupon.valid_until ? coupon.valid_until : 'Any'}</strong>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted"><i class="fas fa-users me-1"></i>Used:</span>
                                    <strong>${coupon.used_count || 0}/${coupon.usage_limit}</strong>
                                </div>
                                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                    ${validityText}
                                    <span><i class="fas fa-circle ${statusDot} me-5" style="font-size: 0.5rem;"></i>${statusText}</span>
                                </div>
                            </div>
                            <div class="btn-group w-100 mt-auto shadow-sm">
                                <button class="btn btn-warning" onclick="editCoupon(${coupon.coupon_id})" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn ${coupon.is_active ? 'btn-secondary' : 'btn-success'}" onclick="toggleCouponStatus(${coupon.coupon_id}, ${coupon.is_active})" title="${coupon.is_active ? 'Deactivate' : 'Activate'}">
                                    <i class="fas ${coupon.is_active ? 'fa-pause' : 'fa-play'}"></i>
                                </button>
                                <button class="btn btn-danger" onclick="deleteCoupon(${coupon.coupon_id})" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }
    $('#couponsList').html(html);
}

function showAddCouponModal() {
    if (typeof ModalManager !== 'undefined' && ModalManager.showCouponModal) {
        ModalManager.showCouponModal();
    } else {
        alert("Please refresh the page.");
    }
}

function editCoupon(couponId) {
    $.ajax({
        url: `/api/coupons/get/${couponId}`,
        method: 'GET',
        success: function(coupon) {
            if (typeof ModalManager !== 'undefined' && ModalManager.showCouponModal) {
                ModalManager.showCouponModal(coupon);
            } else {
                alert("Modal system not ready");
            }
        },
        error: () => showNotification('Error loading coupon', 'error')
    });
}

function toggleCouponStatus(couponId, currentStatus) {
    const action = currentStatus ? 'deactivate' : 'activate';
    if (confirm(`Are you sure you want to ${action} this coupon?`)) {
        $.ajax({
            url: `/api/coupons/toggle-status/${couponId}`,
            method: 'POST',
            success: function(response) {
                if (response.success) {
                    showNotification(response.message, 'success');
                    loadCoupons();
                } else {
                    showNotification(response.message, 'error');
                }
            },
            error: () => showNotification('Error toggling coupon status', 'error')
        });
    }
}

function deleteCoupon(couponId) {
    if (confirm('⚠️ Are you sure you want to delete this coupon?\nThis action cannot be undone.')) {
        $.ajax({
            url: `/api/coupons/delete/${couponId}`,
            method: 'DELETE',
            success: function(response) {
                if (response.success) {
                    showNotification('Coupon deleted successfully!', 'success');
                    loadCoupons();
                } else {
                    showNotification(response.message || 'Error deleting coupon', 'error');
                }
            },
            error: () => showNotification('Error deleting coupon', 'error')
        });
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showNotification(message, type) {
    if (typeof window.showNotification === 'function') {
        window.showNotification(message, type);
    } else {
        alert(message);
    }
}
</script>

<style>
.coupon-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.12) !important;
}
.coupon-code {
    border-bottom: 2px solid #c9a84c;
}
.dark-mode .coupon-card {
    background: #1c2135;
    border-color: rgba(255,255,255,0.05);
}
.dark-mode .coupon-card h3 {
    color: #dfc278;
}
</style>
{% endblock %}
