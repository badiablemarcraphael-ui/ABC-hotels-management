{% extends "base.html" %}

{% block content %}

<div class="container py-5" id="mainContainer" data-booking-id="{{ booking_id }}">
    <div class="text-center mb-4">
        <div class="status-icon-wrapper shadow-sm mx-auto mb-3">
            <i class="fas fa-check"></i>
        </div>
        <h2 class="text-success fw-bold mb-2">Payment Successful!</h2>
        <p class="text-muted fs-5">Your booking has been confirmed.</p>
        <div class="mt-3">
            <div class="spinner-border text-success" role="status" style="width: 30px; height: 30px;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2">Preparing your receipt...</p>
        </div>
    </div>
</div>

<script>
var currentReceiptData = null;
var bookingId = null;

var container = document.getElementById('mainContainer');
if (container) {
    bookingId = container.getAttribute('data-booking-id');
}

document.addEventListener('DOMContentLoaded', function() {
    console.log('Loading receipt for booking ID:', bookingId);
    
    if (!bookingId || bookingId === 'None' || bookingId === '') {
        showErrorAndRedirect('No booking ID found');
        return;
    }
    
    fetch('/api/payments/process-payment-success-json/' + bookingId)
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            console.log('Receipt data received:', data);
            
            if (data.success) {
                currentReceiptData = data.receipt_data;
                setTimeout(function() {
                    showReceiptModal(data.receipt_data);
                }, 100);
            } else {
                showErrorAndRedirect(data.message || 'Failed to load receipt');
            }
        })
        .catch(function(error) {
            console.error('Error fetching receipt:', error);
            showErrorAndRedirect('Network error. Please try again.');
        });
});

function showReceiptModal(data) {
    // Create dynamic Bootstrap modal
    var checkIn = new Date(data.check_in_date);
    var checkOut = new Date(data.check_out_date);
    var nights = Math.ceil((checkOut - checkIn) / (1000*60*60*24));
    var vat = data.total_amount * 0.07;
    var service = data.total_amount * 0.05;
    var total = data.total_amount + vat + service;
    var discount = data.discount_amount || 0;
    var finalTotal = total - discount;
    
    var discountHtml = discount > 0 ? `
        <div class="d-flex justify-content-between mb-2">
            <span>Discount Applied:</span>
            <span class="text-success">-$${discount.toFixed(2)}</span>
        </div>
    ` : '';
    
    var modalHtml = `
        <div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas fa-receipt me-2" style="color: var(--gold-400);"></i>
                            Booking Receipt
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                        <div id="printableReceipt" style="background: var(--surface-primary); padding: 20px; border-radius: 12px;">
                            <div style="text-align: center; margin-bottom: 20px;">
                                <i class="fas fa-building-columns fa-2x" style="color: var(--gold-500);"></i>
                                <h4 style="margin: 10px 0 5px 0; font-family: var(--font-display);">Grand Hotel & Resort</h4>
                                <p style="margin: 0; font-size: 12px; color: var(--text-muted);">Official Payment Receipt</p>
                                <p style="margin: 5px 0 0 0; font-size: 11px; color: var(--text-muted);">123 Luxury Avenue, Prestige District</p>
                                <hr style="margin: 15px 0;">
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <small class="text-muted">Receipt #:</small>
                                    <div><strong>#${data.booking_id}</strong></div>
                                </div>
                                <div class="col-6 text-end">
                                    <small class="text-muted">Date:</small>
                                    <div><strong>${new Date().toLocaleDateString()}</strong></div>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <small class="text-muted">Guest:</small>
                                    <div><strong>${escapeHtml(data.guest_name)}</strong></div>
                                </div>
                                <div class="col-6 text-end">
                                    <small class="text-muted">Room:</small>
                                    <div><strong>${data.room_number}</strong></div>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <small class="text-muted">Check-in:</small>
                                    <div><strong>${data.check_in_date}</strong></div>
                                </div>
                                <div class="col-6 text-end">
                                    <small class="text-muted">Check-out:</small>
                                    <div><strong>${data.check_out_date}</strong></div>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <small class="text-muted">Nights:</small>
                                    <div><strong>${nights}</strong></div>
                                </div>
                                <div class="col-6 text-end">
                                    <small class="text-muted">Payment:</small>
                                    <div><strong>${data.payment_method || 'Online'}</strong></div>
                                </div>
                            </div>
                            
                            <hr>
                            
                            <div class="d-flex justify-content-between mb-2">
                                <span>Room Charge:</span>
                                <span>$${data.total_amount.toFixed(2)}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>VAT (7%):</span>
                                <span>$${vat.toFixed(2)}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Service Charge (5%):</span>
                                <span>$${service.toFixed(2)}</span>
                            </div>
                            ${discountHtml}
                            
                            <hr>
                            
                            <div class="d-flex justify-content-between mt-2">
                                <strong>TOTAL AMOUNT:</strong>
                                <strong class="text-success fs-5">$${finalTotal.toFixed(2)}</strong>
                            </div>
                            
                            <hr>
                            
                            <div class="text-center mt-3">
                                <small class="text-muted">
                                    <i class="fas fa-star-of-life me-1" style="color: var(--gold-500);"></i>
                                    Thank you for choosing Grand Hotel!
                                </small>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="goToDashboard()">
                            <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                        </button>
                        <button type="button" class="btn btn-primary" onclick="printReceipt()">
                            <i class="fas fa-print me-2"></i> Print Receipt
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal if any
    $('#receiptModal').remove();
    // Append new modal
    $('body').append(modalHtml);
    
    // Hide the loading spinner
    var mainContainer = document.getElementById('mainContainer');
    if (mainContainer) {
        mainContainer.style.display = 'none';
    }
    
    // Show modal
    $('#receiptModal').modal('show');
    
    // Clean up when hidden
    $('#receiptModal').on('hidden.bs.modal', function() {
        $('#receiptModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function closeReceiptModal() {
    $('#receiptModal').modal('hide');
}

function printReceipt() {
    var content = document.getElementById('printableReceipt').outerHTML;
    var win = window.open('', '_blank');
    var guestName = currentReceiptData ? currentReceiptData.guest_name : 'Guest';
    
    win.document.write('<!DOCTYPE html><html><head><title>Receipt - ' + escapeHtml(guestName) + '</title>');
    win.document.write('<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">');
    win.document.write('<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">');
    win.document.write(`
        <style>
            body { padding: 20px; background: white; }
            @media print {
                .no-print { display: none; }
                body { padding: 0; }
            }
            .receipt-container {
                max-width: 500px;
                margin: 0 auto;
                background: white;
                border-radius: 12px;
                padding: 20px;
            }
        </style>
    `);
    win.document.write('</head><body>');
    win.document.write('<div class="no-print mb-3 text-center">');
    win.document.write('<button class="btn btn-primary me-2" onclick="window.print()"><i class="fas fa-print"></i> Print</button> ');
    win.document.write('<button class="btn btn-secondary" onclick="window.close()">Close</button>');
    win.document.write('</div>');
    win.document.write('<div class="receipt-container">');
    win.document.write(content);
    win.document.write('</div>');
    win.document.write('</body></html>');
    win.document.close();
    
    win.onload = function() {
        setTimeout(function() {
            win.print();
        }, 300);
    };
}

function goToDashboard() {
    closeReceiptModal();
    window.location.href = '/dashboard';
}

function showErrorAndRedirect(message) {
    var errorHtml = `
        <div class="text-center">
            <div class="status-icon-wrapper shadow-sm mx-auto mb-3" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                <i class="fas fa-times"></i>
            </div>
            <h2 class="text-danger fw-bold mb-3">Error Loading Receipt</h2>
            <p class="text-muted mb-4">${escapeHtml(message)}</p>
            <button class="btn btn-primary btn-lg" onclick="window.location.href='/dashboard'">
                <i class="fas fa-home me-2"></i> Go to Dashboard
            </button>
        </div>
    `;
    var mainContainer = document.getElementById('mainContainer');
    if (mainContainer) {
        mainContainer.innerHTML = errorHtml;
    }
    setTimeout(function() {
        window.location.href = '/dashboard';
    }, 5000);
}

function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>

<style>
.status-icon-wrapper {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #059669);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
}
.status-icon-wrapper i {
    font-size: 40px;
    color: white;
}
.loading-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #e2e8f0;
    border-top-color: #10b981;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
{% endblock %}
