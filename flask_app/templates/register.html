<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Grand Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-500: #c9a84c;
            --gold-600: #a88838;
            --navy-950: #0a0f1a;
            --navy-900: #0f1629;
            --navy-800: #1a2744;
            --success: #2d6a4f;
            --danger: #8b3a3a;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-body);
            background: linear-gradient(160deg, var(--navy-950) 0%, var(--navy-900) 40%, var(--navy-800) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .register-container {
            width: 100%;
            max-width: 520px;
        }
        
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        
        .card-header-custom {
            background: linear-gradient(135deg, var(--navy-800), var(--navy-900));
            padding: 35px 30px;
            text-align: center;
            border-bottom: 3px solid var(--gold-500);
        }
        
        .card-header-custom .icon {
            font-size: 3rem;
            color: var(--gold-500);
            margin-bottom: 10px;
        }
        
        .card-header-custom h2 {
            font-family: var(--font-display);
            color: white;
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin: 0;
        }
        
        .card-header-custom p {
            color: rgba(255,255,255,0.7);
            margin: 8px 0 0 0;
            font-size: 0.85rem;
        }
        
        .card-body-custom {
            padding: 30px;
        }
        
        .form-label {
            font-weight: 600;
            color: #374151;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        
        .form-control {
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #f9fafb;
        }
        
        .form-control:focus {
            border-color: var(--gold-500);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
            background: white;
        }
        
        .form-control.is-valid {
            border-color: var(--success) !important;
            background: #f0fdf4 !important;
        }
        
        .form-control.is-invalid {
            border-color: var(--danger) !important;
            background: #fef2f2 !important;
        }
        
        .input-group-text {
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-right: none;
            border-radius: 10px 0 0 10px;
        }
        
        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        
        .validation-feedback {
            font-size: 0.75rem;
            margin-top: 4px;
            min-height: 20px;
        }
        
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201,168,76,0.3);
        }
        
        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 8px;
            transition: all 0.3s ease;
            background: #e5e7eb;
        }
        
        .password-strength-bar {
            height: 100%;
            border-radius: 5px;
            transition: all 0.3s ease;
            width: 0;
        }
        
        .strength-weak { background: #ef4444; width: 25%; }
        .strength-fair { background: #f59e0b; width: 50%; }
        .strength-good { background: #84cc16; width: 75%; }
        .strength-strong { background: #10b981; width: 100%; }
        
        .otp-input {
            width: 50px !important;
            height: 55px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin: 0 5px;
        }
        
        .otp-input:focus {
            border-color: var(--gold-500);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
        }
        
        .footer-link {
            text-align: center;
            padding: 20px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }
        
        .footer-link a {
            color: var(--gold-600);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .footer-link a:hover {
            color: var(--gold-500);
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            font-size: 0.9rem;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card animate-in">
            <!-- Header -->
            <div class="card-header-custom">
                
                <h2>Create Account</h2>
                <p>Join Grand Hotel & Resort</p>
            </div>
            
            <!-- Body -->
            <div class="card-body-custom">
                <div id="alertMessage"></div>
                
                <!-- Register Step -->
                <div id="registerStep">
                    <form id="registerForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-user me-2"></i>Username *</label>
                            <input type="text" class="form-control" id="regUsername" name="username" 
                                   placeholder="Choose a username" required minlength="3" maxlength="30"
                                   autocomplete="username">
                            <div class="validation-feedback" id="usernameFeedback"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-envelope me-2"></i>Email Address *</label>
                            <input type="email" class="form-control" id="regEmail" name="email" 
                                   placeholder="your@email.com" required
                                   autocomplete="email">
                            <div class="validation-feedback" id="emailFeedback"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-phone me-2"></i>Phone Number</label>
                            <input type="tel" class="form-control" id="regPhone" name="phone" 
                                   placeholder="+63 9XX XXX XXXX">
                            <div class="validation-feedback" id="phoneFeedback"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-lock me-2"></i>Password *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" class="form-control" id="regPassword" name="password" 
                                       placeholder="Min 6 characters" required minlength="6"
                                       autocomplete="new-password">
                                <span class="input-group-text" style="cursor: pointer; border-left: 1px solid #e5e7eb;" 
                                      onclick="togglePassword()">
                                    <i class="fas fa-eye" id="toggleIcon"></i>
                                </span>
                            </div>
                            <div class="password-strength" id="passwordStrength">
                                <div class="password-strength-bar" id="passwordStrengthBar"></div>
                            </div>
                            <div class="validation-feedback" id="passwordFeedback"></div>
                        </div>
                        
                        <input type="hidden" name="role" value="guest">
                        
                        <button type="submit" class="btn-register" id="registerBtn">
                            <i class="fas fa-user-plus me-2"></i> Register
                        </button>
                    </form>
                </div>
                
                <!-- OTP Step (Hidden Initially) -->
                <div id="otpStep" style="display: none;">
                    <div class="text-center mb-4">
                        <div class="icon" style="font-size: 3rem; margin-bottom: 10px;">📧</div>
                        <h4 class="fw-bold">Verify Email</h4>
                        <p class="text-muted">We sent a 6-digit code to <strong id="otpEmailDisplay">your email</strong></p>
                    </div>
                    
                    <div class="d-flex justify-content-center gap-2 mb-4" id="otpInputs">
                        <input type="text" class="otp-input" maxlength="1" data-index="0">
                        <input type="text" class="otp-input" maxlength="1" data-index="1">
                        <input type="text" class="otp-input" maxlength="1" data-index="2">
                        <input type="text" class="otp-input" maxlength="1" data-index="3">
                        <input type="text" class="otp-input" maxlength="1" data-index="4">
                        <input type="text" class="otp-input" maxlength="1" data-index="5">
                    </div>
                    
                    <div class="text-center mb-3">
                        <p class="text-muted small">Didn't receive the code? 
                            <a href="#" onclick="resendOTP()" class="text-primary fw-bold" id="resendLink">Resend</a>
                            <span id="resendTimer" style="display: none;"> in <span id="timerCount">60</span>s</span>
                        </p>
                    </div>
                    
                    <button class="btn-register" id="verifyOtpBtn" onclick="verifyOTP()">
                        <i class="fas fa-check-circle me-2"></i> Verify & Complete Registration
                    </button>
                    
                    <button class="btn btn-outline-secondary w-100 mt-3" onclick="goBackToRegister()">
                        <i class="fas fa-arrow-left me-2"></i> Back
                    </button>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="footer-link">
                <p class="mb-0">Already have an account? <a href="/login">Sign In</a></p>
                <p class="mt-2 mb-0 small text-muted">
                    <i class="fas fa-shield-alt text-success me-1"></i> Your data is secure & encrypted
                </p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        var generatedOTP = '';
        var registrationData = null;
        
        // ============ REAL-TIME VALIDATION ============
        
        // Username validation
        $('#regUsername').on('keyup', function() {
            var val = $(this).val().trim();
            var feedback = $('#usernameFeedback');
            
            if (val.length === 0) {
                $(this).removeClass('is-valid is-invalid');
                feedback.html('');
            } else if (val.length < 3) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>At least 3 characters</span>');
            } else if (/[^a-zA-Z0-9_]/.test(val)) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>Only letters, numbers & underscores</span>');
            } else {
                $(this).removeClass('is-invalid').addClass('is-valid');
                feedback.html('<span class="text-success"><i class="fas fa-check-circle me-1"></i>Looks good!</span>');
            }
        });
        
        // Email validation
        $('#regEmail').on('keyup blur', function() {
            var val = $(this).val().trim();
            var feedback = $('#emailFeedback');
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (val.length === 0) {
                $(this).removeClass('is-valid is-invalid');
                feedback.html('');
            } else if (!emailRegex.test(val)) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>Invalid email format</span>');
            } else {
                $(this).removeClass('is-invalid').addClass('is-valid');
                feedback.html('<span class="text-success"><i class="fas fa-check-circle me-1"></i>Valid email!</span>');
            }
        });
        
        // Password validation with strength meter
        $('#regPassword').on('keyup', function() {
            var val = $(this).val();
            var feedback = $('#passwordFeedback');
            var bar = $('#passwordStrengthBar');
            bar.removeClass('strength-weak strength-fair strength-good strength-strong');
            
            if (val.length === 0) {
                $(this).removeClass('is-valid is-invalid');
                feedback.html('');
                bar.css('width', '0');
            } else if (val.length < 6) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>At least 6 characters</span>');
                bar.addClass('strength-weak');
            } else {
                $(this).removeClass('is-invalid').addClass('is-valid');
                
                // Password strength
                var strength = 0;
                if (val.length >= 8) strength++;
                if (/[A-Z]/.test(val)) strength++;
                if (/[0-9]/.test(val)) strength++;
                if (/[^a-zA-Z0-9]/.test(val)) strength++;
                
                var strengthText = '';
                var strengthClass = '';
                
                switch(strength) {
                    case 0:
                    case 1:
                        strengthText = 'Weak';
                        strengthClass = 'strength-weak';
                        feedback.html('<span class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i>Weak - Add uppercase, numbers & symbols</span>');
                        break;
                    case 2:
                        strengthText = 'Fair';
                        strengthClass = 'strength-fair';
                        feedback.html('<span class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i>Fair - Keep improving</span>');
                        break;
                    case 3:
                        strengthText = 'Good';
                        strengthClass = 'strength-good';
                        feedback.html('<span class="text-info"><i class="fas fa-info-circle me-1"></i>Good password</span>');
                        break;
                    case 4:
                        strengthText = 'Strong';
                        strengthClass = 'strength-strong';
                        feedback.html('<span class="text-success"><i class="fas fa-check-circle me-1"></i>Strong password!</span>');
                        break;
                }
                
                bar.addClass(strengthClass);
            }
        });
        
        // Phone validation
        $('#regPhone').on('keyup', function() {
            var val = $(this).val().trim();
            var feedback = $('#phoneFeedback');
            
            if (val.length === 0) {
                $(this).removeClass('is-valid is-invalid');
                feedback.html('');
            } else if (val.length < 10) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>Phone number too short</span>');
            } else {
                $(this).removeClass('is-invalid').addClass('is-valid');
                feedback.html('<span class="text-success"><i class="fas fa-check-circle me-1"></i>Valid!</span>');
            }
        });
        
        // Toggle password visibility
        function togglePassword() {
            var input = $('#regPassword');
            var icon = $('#toggleIcon');
            if (input.attr('type') === 'password') {
                input.attr('type', 'text');
                icon.removeClass('fa-eye').addClass('fa-eye-slash');
            } else {
                input.attr('type', 'password');
                icon.removeClass('fa-eye-slash').addClass('fa-eye');
            }
        }
        
        // ============ FORM SUBMISSION ============
        
        $('#registerForm').on('submit', function(e) {
            e.preventDefault();
            
            // Validate all fields
            var username = $('#regUsername').val().trim();
            var email = $('#regEmail').val().trim();
            var phone = $('#regPhone').val().trim();
            var password = $('#regPassword').val();
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            // Clear previous alerts
            $('#alertMessage').html('');
            
            // Username validation
            if (username.length < 3) {
                showAlert('error', 'Username must be at least 3 characters');
                $('#regUsername').focus();
                return;
            }
            if (/[^a-zA-Z0-9_]/.test(username)) {
                showAlert('error', 'Username can only contain letters, numbers & underscores');
                $('#regUsername').focus();
                return;
            }
            
            // Email validation
            if (!email || !emailRegex.test(email)) {
                showAlert('error', 'Please enter a valid email address');
                $('#regEmail').focus();
                return;
            }
            
            // Password validation
            if (password.length < 6) {
                showAlert('error', 'Password must be at least 6 characters');
                $('#regPassword').focus();
                return;
            }
            
            // Store registration data
            registrationData = {
                username: username,
                email: email,
                phone: phone,
                password: password,
                role: 'guest'
            };
            
            // Send OTP
            sendOTP(email);
        });
        
        // ============ OTP FUNCTIONS ============
        
        function sendOTP(email) {
            var $btn = $('#registerBtn');
            $btn.html('<span class="spinner-border spinner-border-sm me-2"></span> Sending OTP...').prop('disabled', true);
            
            $.ajax({
                url: '/api/users/send-otp',
                method: 'POST',
                data: { email: email },
                success: function(response) {
                    if (response.success) {
                        generatedOTP = response.otp || '';
                        showOTPStep(email);
                        showAlert('success', 'OTP sent to your email! Check your inbox.');
                    } else {
                        showAlert('error', response.message || 'Failed to send OTP');
                    }
                    $btn.html('<i class="fas fa-user-plus me-2"></i> Register').prop('disabled', false);
                },
                error: function() {
                    showAlert('error', 'Failed to send OTP. Please try again.');
                    $btn.html('<i class="fas fa-user-plus me-2"></i> Register').prop('disabled', false);
                }
            });
        }
        
        function showOTPStep(email) {
            $('#registerStep').hide();
            $('#otpStep').show();
            $('#otpEmailDisplay').text(email);
            $('#otpInputs input').val('');
            $('#otpInputs input:first').focus();
            
            // Start resend timer
            startResendTimer();
            
            // Setup OTP input behavior
            setupOTPInputs();
        }
        
        function setupOTPInputs() {
            $('#otpInputs input').off('keyup').on('keyup', function(e) {
                var index = parseInt($(this).data('index'));
                var val = $(this).val();
                
                // Allow only numbers
                if (!/^\d*$/.test(val)) {
                    $(this).val('');
                    return;
                }
                
                // Auto-advance to next input
                if (val.length === 1 && index < 5) {
                    $('#otpInputs input[data-index="' + (index + 1) + '"]').focus();
                }
                
                // Auto-submit when all filled
                if (index === 5 && val.length === 1) {
                    setTimeout(function() {
                        if (getOTPValue().length === 6) {
                            verifyOTP();
                        }
                    }, 300);
                }
                
                // Handle backspace
                if (e.key === 'Backspace' && val === '' && index > 0) {
                    $('#otpInputs input[data-index="' + (index - 1) + '"]').focus();
                }
            });
            
            // Handle paste
            $('#otpInputs input:first').off('paste').on('paste', function(e) {
                e.preventDefault();
                var pasted = (e.originalEvent.clipboardData.getData('text') || '').replace(/\D/g, '').substring(0, 6);
                var inputs = $('#otpInputs input');
                for (var i = 0; i < 6; i++) {
                    $(inputs[i]).val(pasted[i] || '');
                }
                if (pasted.length === 6) {
                    setTimeout(verifyOTP, 300);
                }
            });
        }
        
        function getOTPValue() {
            var otp = '';
            $('#otpInputs input').each(function() {
                otp += $(this).val();
            });
            return otp;
        }
        
        function verifyOTP() {
            var enteredOTP = getOTPValue();
            
            if (enteredOTP.length !== 6) {
                showAlert('error', 'Please enter the complete 6-digit code');
                return;
            }
            
            var $btn = $('#verifyOtpBtn');
            $btn.html('<span class="spinner-border spinner-border-sm me-2"></span> Verifying...').prop('disabled', true);
            
            $.ajax({
                url: '/api/users/verify-otp',
                method: 'POST',
                data: {
                    email: registrationData.email,
                    otp: enteredOTP,
                    username: registrationData.username,
                    password: registrationData.password,
                    phone: registrationData.phone,
                    role: registrationData.role
                },
                success: function(response) {
                    if (response.success) {
                        showAlert('success', 'Registration successful! Redirecting to login...');
                        setTimeout(function() {
                            window.location.href = '/login';
                        }, 2000);
                    } else {
                        showAlert('error', response.message || 'Invalid OTP');
                        $('#otpInputs input').val('');
                        $('#otpInputs input:first').focus();
                        $btn.html('<i class="fas fa-check-circle me-2"></i> Verify & Complete Registration').prop('disabled', false);
                    }
                },
                error: function() {
                    showAlert('error', 'Verification failed. Please try again.');
                    $btn.html('<i class="fas fa-check-circle me-2"></i> Verify & Complete Registration').prop('disabled', false);
                }
            });
        }
        
        function resendOTP() {
            if (registrationData && registrationData.email) {
                $('#resendLink').hide();
                $('#resendTimer').show();
                sendOTP(registrationData.email);
            }
        }
        
        function startResendTimer() {
            var seconds = 60;
            $('#resendLink').hide();
            $('#resendTimer').show();
            $('#timerCount').text(seconds);
            
            var timer = setInterval(function() {
                seconds--;
                $('#timerCount').text(seconds);
                if (seconds <= 0) {
                    clearInterval(timer);
                    $('#resendLink').show();
                    $('#resendTimer').hide();
                }
            }, 1000);
        }
        
        function goBackToRegister() {
            $('#otpStep').hide();
            $('#registerStep').show();
            $('#alertMessage').html('');
        }
        
        // ============ HELPER FUNCTIONS ============
        
        function showAlert(type, message) {
            var alertClass = type === 'error' ? 'danger' : 'success';
            var icon = type === 'error' ? '<i class="fas fa-exclamation-circle me-2"></i>' : '<i class="fas fa-check-circle me-2"></i>';
            
            $('#alertMessage').html(`
                <div class="alert alert-${alertClass} alert-dismissible fade show animate-in" role="alert">
                    ${icon}<strong>${message}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `);
            
            setTimeout(function() {
                $('.alert').fadeOut(500, function() { $(this).remove(); });
            }, 5000);
        }
    </script>
</body>
</html>
