<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ABC Hotels</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-500: #c9a84c;
            --gold-600: #a88838;
            --gold-400: #dfc278;
            --navy-950: #0a0f1a;
            --navy-900: #0f1629;
            --navy-800: #1a2744;
            --success-600: #2d6a4f;
            --success-500: #3d8b6a;
            --danger-600: #8b3a3a;
            --warning-500: #d4a020;
            --font-display: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Inter', -apple-system, sans-serif;
            --shadow-lg: 0 25px 60px rgba(0,0,0,0.4);
            --shadow-gold: 0 10px 40px rgba(201,168,76,0.3);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-body);
            background: linear-gradient(160deg, var(--navy-950) 0%, var(--navy-900) 40%, var(--navy-800) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Ambient background orbs */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201,168,76,0.08), transparent);
            border-radius: 50%;
            top: -200px;
            right: -150px;
            animation: orbFloat1 15s ease-in-out infinite;
            pointer-events: none;
        }
        
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0,56,168,0.06), transparent);
            border-radius: 50%;
            bottom: -150px;
            left: -100px;
            animation: orbFloat2 12s ease-in-out infinite reverse;
            pointer-events: none;
        }
        
        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-30px, -20px) scale(1.15); }
            66% { transform: translate(25px, 30px) scale(0.85); }
        }
        
        /* Floating particles */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold-500);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat linear infinite;
            opacity: 0;
        }
        
        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        
        .register-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }
        
        .register-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(201,168,76,0.1);
            overflow: hidden;
            animation: cardSlideUp 0.8s var(--ease-spring);
        }
        
        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(60px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .card-header-custom {
            background: linear-gradient(135deg, var(--navy-800) 0%, var(--navy-900) 100%);
            padding: 30px 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--gold-500);
            position: relative;
            overflow: hidden;
        }
        
        /* Shimmer on header */
        .card-header-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: headerShimmer 6s ease-in-out infinite;
        }
        
        @keyframes headerShimmer {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }
        
        .card-header-custom .icon-wrapper {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.8rem;
            color: var(--navy-950);
            box-shadow: 0 8px 25px rgba(201,168,76,0.3);
            animation: iconPulse 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 8px 25px rgba(201,168,76,0.3); }
            50% { box-shadow: 0 8px 40px rgba(201,168,76,0.5); }
        }
        
        .card-header-custom h2 {
            font-family: var(--font-display);
            color: white;
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin: 0;
            position: relative;
            z-index: 1;
        }
        
        .card-header-custom .hotel-name {
            font-family: var(--font-display);
            color: var(--gold-400);
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }
        
        .card-header-custom .hotel-location {
            color: rgba(255,255,255,0.5);
            font-size: 0.7rem;
            margin: 8px 0 0 0;
            position: relative;
            z-index: 1;
        }
        
        .card-header-custom p {
            color: rgba(255,255,255,0.7);
            margin: 8px 0 0 0;
            font-size: 0.85rem;
            position: relative;
            z-index: 1;
        }
        
        .card-body-custom {
            padding: 25px 30px;
        }
        
        .form-label {
            font-weight: 600;
            color: #374151;
            font-size: 0.82rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .form-label i {
            color: var(--gold-600);
            width: 16px;
            text-align: center;
        }
        
        .form-control {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 0.92rem;
            transition: all 0.3s ease;
            background: #f9fafb;
            font-family: var(--font-body);
        }
        
        .form-control:focus {
            border-color: var(--gold-500);
            box-shadow: 0 0 0 4px rgba(201,168,76,0.08), 0 0 20px rgba(201,168,76,0.06);
            background: white;
            transform: translateY(-1px);
        }
        
        .form-control.is-valid {
            border-color: var(--success-600) !important;
            background: #f0fdf4 !important;
        }
        
        .form-control.is-invalid {
            border-color: var(--danger-600) !important;
            background: #fef2f2 !important;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        
        .input-group-text {
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-right: none;
            border-radius: 12px 0 0 12px;
            color: var(--gold-600);
        }
        
        .input-group .form-control {
            border-left: none;
            border-radius: 0 12px 12px 0;
        }
        
        .validation-feedback {
            font-size: 0.73rem;
            margin-top: 4px;
            min-height: 18px;
            transition: all 0.3s ease;
        }
        
        .btn-register {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
            color: var(--navy-950);
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s var(--ease-spring);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            font-family: var(--font-body);
        }
        
        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-gold);
            filter: brightness(1.05);
        }
        
        .btn-register:hover::before {
            left: 100%;
        }
        
        .btn-register:active {
            transform: translateY(0) scale(0.98);
        }
        
        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            filter: none;
        }
        
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 8px;
            transition: all 0.3s ease;
            background: #e5e7eb;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            border-radius: 5px;
            transition: all 0.4s ease;
            width: 0;
        }
        
        .strength-weak { background: #ef4444; width: 25%; }
        .strength-fair { background: #f59e0b; width: 50%; }
        .strength-good { background: #84cc16; width: 75%; }
        .strength-strong { background: #10b981; width: 100%; }
        
        .otp-input {
            width: 50px !important;
            height: 55px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            margin: 0 5px;
            transition: all 0.3s ease;
            font-family: var(--font-body);
        }
        
        .otp-input:focus {
            border-color: var(--gold-500);
            box-shadow: 0 0 0 4px rgba(201,168,76,0.08);
            transform: translateY(-2px);
        }
        
        .otp-input.filled {
            border-color: var(--gold-500);
            background: rgba(201,168,76,0.05);
        }
        
        .footer-link {
            text-align: center;
            padding: 18px 20px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }
        
        .footer-link a {
            color: var(--gold-600);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .footer-link a:hover {
            color: var(--gold-500);
        }
        
        .alert {
            border-radius: 14px;
            border: none;
            font-size: 0.88rem;
            animation: alertSlideIn 0.4s var(--ease-spring);
        }
        
        @keyframes alertSlideIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* Step dots */
        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            margin-bottom: 24px;
        }
        
        .step-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #6b7280;
            transition: all 0.4s ease;
            position: relative;
        }
        
        .step-dot.active {
            background: var(--gold-500);
            color: var(--navy-950);
            box-shadow: 0 0 0 6px rgba(201,168,76,0.15);
            animation: stepActive 2s ease-in-out infinite;
        }
        
        @keyframes stepActive {
            0%, 100% { box-shadow: 0 0 0 6px rgba(201,168,76,0.15); }
            50% { box-shadow: 0 0 0 12px rgba(201,168,76,0.05); }
        }
        
        .step-dot.completed {
            background: var(--success-600);
            color: white;
        }
        
        .step-line {
            width: 50px;
            height: 3px;
            background: #e5e7eb;
            transition: all 0.5s ease;
            border-radius: 3px;
        }
        
        .step-line.completed {
            background: var(--success-600);
        }
        
        .step-line.active {
            background: linear-gradient(90deg, var(--success-600), var(--gold-500));
        }
        
        .toggle-password {
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .toggle-password:hover {
            color: var(--gold-500);
        }
        
        @media (max-width: 576px) {
            .register-container { max-width: 100%; }
            .card-body-custom { padding: 20px; }
            .otp-input { width: 42px !important; height: 48px; font-size: 1.2rem; margin: 0 3px; }
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <div id="particlesContainer"></div>
    
    <div class="register-container">
        <div class="register-card">
            <!-- Header -->
            <div class="card-header-custom">
                <div class="icon-wrapper">
                    <i class="fas fa-hotel"></i>
                </div>
                <div class="hotel-name">ABC Hotels</div>
                <h2>Create Account</h2>
                <div class="hotel-location">
                    <i class="fas fa-map-marker-alt me-1"></i>
                    Santa Cruz, Laguna, Philippines
                </div>
            </div>
            
            <!-- Body -->
            <div class="card-body-custom">
                <div id="alertMessage"></div>
                
                <!-- Register Step -->
                <div id="registerStep">
                    <form id="registerForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-user"></i> Username *</label>
                            <input type="text" class="form-control" id="regUsername" name="username" 
                                   placeholder="Choose a username" required minlength="3" maxlength="30"
                                   autocomplete="username">
                            <div class="validation-feedback" id="usernameFeedback"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-envelope"></i> Email Address *</label>
                            <input type="email" class="form-control" id="regEmail" name="email" 
                                   placeholder="your@email.com" required
                                   autocomplete="email">
                            <div class="validation-feedback" id="emailFeedback"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
                            <input type="tel" class="form-control" id="regPhone" name="phone" 
                                   placeholder="+63 9XX XXX XXXX">
                            <div class="validation-feedback" id="phoneFeedback"></div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label"><i class="fas fa-lock"></i> Password *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" class="form-control" id="regPassword" name="password" 
                                       placeholder="Min 6 characters" required minlength="6"
                                       autocomplete="new-password">
                                <span class="input-group-text toggle-password" onclick="togglePassword()">
                                    <i class="fas fa-eye" id="toggleIcon"></i>
                                </span>
                            </div>
                            <div class="password-strength">
                                <div class="password-strength-bar" id="passwordStrengthBar"></div>
                            </div>
                            <div class="validation-feedback" id="passwordFeedback"></div>
                        </div>
                        
                        <input type="hidden" name="role" value="guest">
                        
                        <button type="submit" class="btn-register" id="registerBtn">
                            <i class="fas fa-user-plus me-2"></i> Create Account
                        </button>
                    </form>
                </div>
                
                <!-- OTP Step -->
                <div id="otpStep" style="display: none;">
                    <div class="text-center mb-4">
                        <div style="font-size: 3rem; margin-bottom: 10px; animation: iconPulse 2s ease-in-out infinite;">📧</div>
                        <h4 class="fw-bold" style="font-family: var(--font-display);">Verify Email</h4>
                        <p class="text-muted">We sent a 6-digit code to <strong id="otpEmailDisplay">your email</strong></p>
                    </div>
                    
                    <!-- Step Indicator -->
                    <div class="step-indicator" id="stepIndicator">
                        <div class="step-dot completed" id="stepDot1"><i class="fas fa-check"></i></div>
                        <div class="step-line completed" id="stepLine1"></div>
                        <div class="step-dot active" id="stepDot2">2</div>
                        <div class="step-line" id="stepLine2"></div>
                        <div class="step-dot" id="stepDot3">3</div>
                    </div>
                    
                    <div class="d-flex justify-content-center gap-2 mb-4" id="otpInputs">
                        <input type="text" class="otp-input" maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" data-index="4" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" data-index="5" inputmode="numeric" pattern="[0-9]">
                    </div>
                    
                    <div class="text-center mb-3">
                        <p class="text-muted small">Didn't receive the code? 
                            <a href="#" onclick="resendOTP()" class="fw-bold" id="resendLink" style="color: var(--gold-600);">Resend</a>
                            <span id="resendTimer" style="display: none;"> in <span id="timerCount" class="fw-bold">60</span>s</span>
                        </p>
                    </div>
                    
                    <button class="btn-register" id="verifyOtpBtn" onclick="verifyOTP()">
                        <i class="fas fa-check-circle me-2"></i> Verify & Complete
                    </button>
                    
                    <button class="btn w-100 mt-3 fw-bold" onclick="goBackToRegister()" 
                            style="background: transparent; border: 2px solid #d1d5db; color: #6b7280; border-radius: 14px; padding: 12px; transition: all 0.3s ease;"
                            onmouseover="this.style.borderColor='#c9a84c'; this.style.color='#c9a84c';"
                            onmouseout="this.style.borderColor='#d1d5db'; this.style.color='#6b7280';">
                        <i class="fas fa-arrow-left me-2"></i> Back
                    </button>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="footer-link">
                <p class="mb-0">Already have an account? <a href="/login">Sign In</a></p>
                <p class="mt-2 mb-0 small text-muted">
                    <i class="fas fa-shield-alt text-success me-1"></i> Your data is secure & encrypted
                </p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // =============================================
        // FLOATING PARTICLES
        // =============================================
        (function createParticles() {
            const container = document.getElementById('particlesContainer');
            if (!container) return;
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 20 + 12) + 's';
                particle.style.animationDelay = (Math.random() * 15) + 's';
                particle.style.width = particle.style.height = (Math.random() * 3 + 1) + 'px';
                container.appendChild(particle);
            }
        })();
        
        var registrationData = null;
        
        // =============================================
        // REAL-TIME VALIDATION
        // =============================================
        
        // Username validation
        $('#regUsername').on('keyup', function() {
            var val = $(this).val().trim();
            var feedback = $('#usernameFeedback');
            
            if (val.length === 0) {
                $(this).removeClass('is-valid is-invalid');
                feedback.html('');
            } else if (val.length < 3) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>At least 3 characters</span>');
            } else if (/[^a-zA-Z0-9_]/.test(val)) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>Only letters, numbers & underscores</span>');
            } else {
                $(this).removeClass('is-invalid').addClass('is-valid');
                feedback.html('<span class="text-success"><i class="fas fa-check-circle me-1"></i>Looks good!</span>');
            }
        });
        
        // Email validation
        $('#regEmail').on('keyup blur', function() {
            var val = $(this).val().trim();
            var feedback = $('#emailFeedback');
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (val.length === 0) {
                $(this).removeClass('is-valid is-invalid');
                feedback.html('');
            } else if (!emailRegex.test(val)) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>Invalid email format</span>');
            } else {
                $(this).removeClass('is-invalid').addClass('is-valid');
                feedback.html('<span class="text-success"><i class="fas fa-check-circle me-1"></i>Valid email!</span>');
            }
        });
        
        // Password validation with strength meter
        $('#regPassword').on('keyup', function() {
            var val = $(this).val();
            var feedback = $('#passwordFeedback');
            var bar = $('#passwordStrengthBar');
            bar.removeClass('strength-weak strength-fair strength-good strength-strong');
            
            if (val.length === 0) {
                $(this).removeClass('is-valid is-invalid');
                feedback.html('');
                bar.css('width', '0');
            } else if (val.length < 6) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>At least 6 characters</span>');
                bar.addClass('strength-weak');
            } else {
                $(this).removeClass('is-invalid').addClass('is-valid');
                
                var strength = 0;
                if (val.length >= 8) strength++;
                if (/[A-Z]/.test(val)) strength++;
                if (/[0-9]/.test(val)) strength++;
                if (/[^a-zA-Z0-9]/.test(val)) strength++;
                
                var strengthText = '';
                var strengthClass = '';
                
                switch(strength) {
                    case 0:
                    case 1:
                        strengthText = 'Weak';
                        strengthClass = 'strength-weak';
                        feedback.html('<span class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i>Weak - Add uppercase, numbers & symbols</span>');
                        break;
                    case 2:
                        strengthText = 'Fair';
                        strengthClass = 'strength-fair';
                        feedback.html('<span class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i>Fair - Keep improving</span>');
                        break;
                    case 3:
                        strengthText = 'Good';
                        strengthClass = 'strength-good';
                        feedback.html('<span class="text-info"><i class="fas fa-info-circle me-1"></i>Good password</span>');
                        break;
                    case 4:
                        strengthText = 'Strong';
                        strengthClass = 'strength-strong';
                        feedback.html('<span class="text-success"><i class="fas fa-check-circle me-1"></i>Strong password!</span>');
                        break;
                }
                
                bar.addClass(strengthClass);
            }
        });
        
        // Phone validation
        $('#regPhone').on('keyup', function() {
            var val = $(this).val().trim();
            var feedback = $('#phoneFeedback');
            
            if (val.length === 0) {
                $(this).removeClass('is-valid is-invalid');
                feedback.html('');
            } else if (val.length < 10) {
                $(this).removeClass('is-valid').addClass('is-invalid');
                feedback.html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i>Phone number too short</span>');
            } else {
                $(this).removeClass('is-invalid').addClass('is-valid');
                feedback.html('<span class="text-success"><i class="fas fa-check-circle me-1"></i>Valid!</span>');
            }
        });
        
        // Toggle password visibility
        function togglePassword() {
            var input = $('#regPassword');
            var icon = $('#toggleIcon');
            if (input.attr('type') === 'password') {
                input.attr('type', 'text');
                icon.removeClass('fa-eye').addClass('fa-eye-slash');
            } else {
                input.attr('type', 'password');
                icon.removeClass('fa-eye-slash').addClass('fa-eye');
            }
        }
        
        // =============================================
        // FORM SUBMISSION
        // =============================================
        $('#registerForm').on('submit', function(e) {
            e.preventDefault();
            
            var username = $('#regUsername').val().trim();
            var email = $('#regEmail').val().trim();
            var phone = $('#regPhone').val().trim();
            var password = $('#regPassword').val();
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            $('#alertMessage').html('');
            
            if (username.length < 3) {
                showAlert('error', 'Username must be at least 3 characters');
                $('#regUsername').focus();
                return;
            }
            if (/[^a-zA-Z0-9_]/.test(username)) {
                showAlert('error', 'Username can only contain letters, numbers & underscores');
                $('#regUsername').focus();
                return;
            }
            if (!email || !emailRegex.test(email)) {
                showAlert('error', 'Please enter a valid email address');
                $('#regEmail').focus();
                return;
            }
            if (password.length < 6) {
                showAlert('error', 'Password must be at least 6 characters');
                $('#regPassword').focus();
                return;
            }
            
            registrationData = {
                username: username,
                email: email,
                phone: phone,
                password: password,
                role: 'guest'
            };
            
            sendOTP(email);
        });
        
        // =============================================
        // OTP FUNCTIONS
        // =============================================
        function sendOTP(email) {
            var $btn = $('#registerBtn');
            $btn.html('<span class="spinner-border spinner-border-sm me-2"></span> Sending OTP...').prop('disabled', true);
            
            $.ajax({
                url: '/api/users/send-otp',
                method: 'POST',
                data: { email: email },
                success: function(response) {
                    if (response.success) {
                        showOTPStep(email);
                        showAlert('success', 'OTP sent to your email! Check your inbox.');
                    } else {
                        showAlert('error', response.message || 'Failed to send OTP');
                    }
                    $btn.html('<i class="fas fa-user-plus me-2"></i> Create Account').prop('disabled', false);
                },
                error: function() {
                    showAlert('error', 'Failed to send OTP. Please try again.');
                    $btn.html('<i class="fas fa-user-plus me-2"></i> Create Account').prop('disabled', false);
                }
            });
        }
        
        function showOTPStep(email) {
            $('#registerStep').hide();
            $('#otpStep').show();
            $('#otpEmailDisplay').text(email);
            $('#otpInputs input').val('').removeClass('filled');
            $('#otpInputs input:first').focus();
            
            startResendTimer();
            setupOTPInputs();
        }
        
        function setupOTPInputs() {
            $('#otpInputs input').off('keyup').on('keyup', function(e) {
                var index = parseInt($(this).data('index'));
                var val = $(this).val();
                
                if (!/^\d*$/.test(val)) {
                    $(this).val('');
                    return;
                }
                
                if (val.length === 1) {
                    $(this).addClass('filled');
                    if (index < 5) {
                        $('#otpInputs input[data-index="' + (index + 1) + '"]').focus();
                    }
                } else {
                    $(this).removeClass('filled');
                }
                
                if (index === 5 && val.length === 1) {
                    setTimeout(function() {
                        if (getOTPValue().length === 6) verifyOTP();
                    }, 300);
                }
                
                if (e.key === 'Backspace' && val === '' && index > 0) {
                    $('#otpInputs input[data-index="' + (index - 1) + '"]').focus().select();
                }
            });
            
            $('#otpInputs input:first').off('paste').on('paste', function(e) {
                e.preventDefault();
                var pasted = (e.originalEvent.clipboardData.getData('text') || '').replace(/\D/g, '').substring(0, 6);
                var inputs = $('#otpInputs input');
                for (var i = 0; i < 6; i++) {
                    $(inputs[i]).val(pasted[i] || '');
                    if (pasted[i]) $(inputs[i]).addClass('filled');
                    else $(inputs[i]).removeClass('filled');
                }
                if (pasted.length === 6) setTimeout(verifyOTP, 300);
            });
        }
        
        function getOTPValue() {
            var otp = '';
            $('#otpInputs input').each(function() { otp += $(this).val(); });
            return otp;
        }
        
        function verifyOTP() {
            var enteredOTP = getOTPValue();
            
            if (enteredOTP.length !== 6) {
                showAlert('error', 'Please enter the complete 6-digit code');
                return;
            }
            
            var $btn = $('#verifyOtpBtn');
            $btn.html('<span class="spinner-border spinner-border-sm me-2"></span> Verifying...').prop('disabled', true);
            
            $.ajax({
                url: '/api/users/verify-otp',
                method: 'POST',
                data: {
                    email: registrationData.email,
                    otp: enteredOTP,
                    username: registrationData.username,
                    password: registrationData.password,
                    phone: registrationData.phone,
                    role: registrationData.role
                },
                success: function(response) {
                    if (response.success) {
                        showAlert('success', 'Registration successful! Redirecting to login...');
                        setTimeout(function() {
                            window.location.href = '/login';
                        }, 2000);
                    } else {
                        showAlert('error', response.message || 'Invalid OTP');
                        $('#otpInputs input').val('').removeClass('filled');
                        $('#otpInputs input:first').focus();
                        $btn.html('<i class="fas fa-check-circle me-2"></i> Verify & Complete').prop('disabled', false);
                    }
                },
                error: function() {
                    showAlert('error', 'Verification failed. Please try again.');
                    $btn.html('<i class="fas fa-check-circle me-2"></i> Verify & Complete').prop('disabled', false);
                }
            });
        }
        
        function resendOTP() {
            if (registrationData && registrationData.email) {
                $('#resendLink').hide();
                $('#resendTimer').show();
                startResendTimer();
                $.ajax({
                    url: '/api/users/send-otp',
                    method: 'POST',
                    data: { email: registrationData.email },
                    success: function(response) {
                        if (response.success) {
                            showAlert('success', 'OTP resent! Check your inbox.');
                        } else {
                            showAlert('error', response.message || 'Failed to resend OTP');
                        }
                    },
                    error: function() {
                        showAlert('error', 'Failed to resend OTP.');
                    }
                });
            }
        }
        
        function startResendTimer() {
            var seconds = 60;
            $('#resendLink').hide();
            $('#resendTimer').show();
            $('#timerCount').text(seconds);
            
            var timer = setInterval(function() {
                seconds--;
                $('#timerCount').text(seconds);
                if (seconds <= 0) {
                    clearInterval(timer);
                    $('#resendLink').show();
                    $('#resendTimer').hide();
                }
            }, 1000);
        }
        
        function goBackToRegister() {
            $('#otpStep').hide();
            $('#registerStep').show();
            $('#alertMessage').html('');
        }
        
        // =============================================
        // HELPER FUNCTIONS
        // =============================================
        function showAlert(type, message) {
            var alertClass = type === 'error' ? 'danger' : 'success';
            var icon = type === 'error' ? '<i class="fas fa-exclamation-circle me-2"></i>' : '<i class="fas fa-check-circle me-2"></i>';
            
            $('#alertMessage').html(`
                <div class="alert alert-${alertClass} alert-dismissible fade show animate-in" role="alert">
                    ${icon}<strong>${message}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `);
            
            setTimeout(function() {
                $('.alert').fadeOut(500, function() { $(this).remove(); });
            }, 5000);
        }
    </script>
</body>
</html>
