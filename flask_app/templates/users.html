{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 fade-in">
    <h2 class="mb-0 fw-bold"><i class="fas fa-users text-primary me-2"></i> User Management</h2>
    <div>
        <button class="btn btn-outline-info shadow-sm fw-bold me-2" onclick="showArchivedUsers()">
            <i class="fas fa-archive me-1"></i> View Archives
        </button>
        <button class="btn btn-primary shadow-sm fw-bold" onclick="showAddUserModal()">
            <i class="fas fa-plus me-1"></i> Add User
        </button>
    </div>
</div>

<div class="filter-bar fade-in" style="animation-delay: 0.1s;">
    <div class="row align-items-end g-3">
        <div class="col-md-5">
            <label for="searchInputField" class="fw-bold text-muted mb-1"><i class="fas fa-search me-1"></i> Search Users</label>
            <input type="text" id="searchInputField" class="form-control shadow-sm" placeholder="Search by username or email..." autocomplete="off">
        </div>
        <div class="col-md-4">
            <label for="roleFilterSelect" class="fw-bold text-muted mb-1"><i class="fas fa-filter me-1"></i> Filter by Role</label>
            <select id="roleFilterSelect" class="form-select shadow-sm" autocomplete="off">
                <option value="all">All Roles</option>
                <option value="admin">Admin</option>
                <option value="receptionist">Receptionist</option>
                <option value="manager">Manager</option>
                <option value="guest">Guest</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="fw-bold d-block mb-1">&nbsp;</label>
            <button class="btn btn-secondary w-100 shadow-sm fw-bold" onclick="resetFilters()">
                <i class="fas fa-undo me-1"></i> Reset
            </button>
        </div>
    </div>
</div>

<div class="table-responsive shadow-sm fade-in" style="border-radius: 12px; animation-delay: 0.2s;">
    <table class="table table-bordered table-hover mb-0">
        <thead class="table-dark">
            <tr>
                <th class="py-3">ID</th>
                <th class="py-3">Username</th>
                <th class="py-3">Email</th>
                <th class="py-3">Phone</th>
                <th class="py-3">Role</th>
                <th class="py-3">Created</th>
                <th class="py-3 text-center">Actions</th>
            </tr>
        </thead>
        <tbody id="usersTable">
            <tr>
                <td colspan="7" class="text-center py-5">
                    <i class="fas fa-spinner fa-spin text-primary me-2"></i> Loading users...
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Hidden form for delete reason -->
<form id="deleteReasonForm" style="display: none;">
    <input type="hidden" id="deleteUserId" value="">
    <input type="hidden" id="deleteUserRole" value="">
</form>

<script>
let allUsers = [];
let currentUserRole = null;
let currentUserId = null;

(function() {
    function waitForjQuery() {
        if (typeof jQuery !== 'undefined') {
            console.log("✅ jQuery loaded, initializing users page...");
            initUsersPage();
        } else {
            console.log("⏳ Waiting for jQuery to load...");
            setTimeout(waitForjQuery, 100);
        }
    }
    
    function initUsersPage() {
        jQuery(document).ready(function($) {
            // Get current user role
            if (window.GrandHotel && window.GrandHotel.getCurrentUser()) {
                currentUserRole = window.GrandHotel.getCurrentUser().role;
                currentUserId = window.GrandHotel.getCurrentUser().userId;
            } else {
                // Fallback to fetch from session
                $.ajax({
                    url: '/api/users/check-auth',
                    method: 'GET',
                    async: false,
                    success: function(data) {
                        if (data.authenticated) {
                            currentUserRole = data.role;
                            currentUserId = data.user_id;
                        }
                    }
                });
            }
            
            // Apply UI restrictions based on role
            applyRoleBasedUIRestrictions();
            
            loadUsers();
            
            $('#searchInputField').on('keyup', function() {
                filterUsers();
            });
            
            $('#roleFilterSelect').on('change', function() {
                filterUsers();
            });
        });
    }
    
    function applyRoleBasedUIRestrictions() {
        // Update the UI text for managers
        if (currentUserRole === 'manager') {
            const cardHeaderDesc = document.querySelector('.card-header small');
            if (cardHeaderDesc) {
                cardHeaderDesc.textContent = 'Manage receptionists, managers and guests';
            }
        }
    }
    
    waitForjQuery();
})();

function loadUsers() {
    console.log("📋 Loading users...");
    jQuery.ajax({
        url: '/api/users/list',
        method: 'GET',
        success: function(data) {
            console.log("✅ Users data received:", data.length);
            allUsers = data;
            displayUsers(allUsers);
        },
        error: function(xhr, status, error) {
            console.error("❌ Error loading users:", error);
            document.getElementById('usersTable').innerHTML = `
                <tr><td colspan="7" class="text-center text-danger py-4 fw-bold"><i class="fas fa-exclamation-triangle me-2"></i>Error loading users</td></tr>
            `;
        }
    });
}

function displayUsers(users) {
    let html = '';
    
    if (!users || users.length === 0) {
        html = '<tr><td colspan="7" class="text-center text-muted py-5 fw-bold"><i class="fas fa-search fa-2x mb-3 d-block opacity-50"></i>No users found</td></tr>';
    } else {
        users.forEach(function(user) {
            let roleClass = '';
            let roleName = user.role;
            
            switch(user.role) {
                case 'admin': roleClass = 'role-admin'; roleName = 'Admin'; break;
                case 'manager': roleClass = 'role-manager'; roleName = 'Manager'; break;
                case 'receptionist': roleClass = 'role-receptionist'; roleName = 'Receptionist'; break;
                case 'guest': roleClass = 'role-guest'; roleName = 'Guest'; break;
                default: roleClass = 'role-guest';
            }
            
            // Determine button visibility based on permissions
            let showEditButton = true;
            let showDeleteButton = true;
            let showArchiveButton = false;
            
            // Admin users cannot be edited or deleted by anyone
            if (user.role === 'admin') {
                showEditButton = false;
                showDeleteButton = false;
                // Only admins can archive other admins
                if (currentUserRole === 'admin' && user.user_id != currentUserId) {
                    showArchiveButton = true;
                }
            }
            
            if (currentUserRole === 'manager') {
                // Managers cannot delete or edit other managers
                if (user.role === 'manager') {
                    showDeleteButton = false;
                    showEditButton = false;
                }
            } else if (currentUserRole === 'admin') {
                // Admins can archive managers
                if (user.role === 'manager' && user.user_id != currentUserId) {
                    showArchiveButton = true;
                }
            }
            
            html += `
                <tr class="fade-in">
                    <td class="align-middle fw-bold text-muted">${user.user_id}</td>
                    <td class="align-middle fw-bold text-primary">${escapeHtml(user.username)}</td>
                    <td class="align-middle">${escapeHtml(user.email || '-')}</td>
                    <td class="align-middle">${escapeHtml(user.phone || '-')}</td>
                    <td class="align-middle"><span class="role-badge ${roleClass} shadow-sm">${roleName}</span></td>
                    <td class="align-middle text-muted small fw-bold">${user.created_at ? user.created_at.split(' ')[0] : '-'}</td>
                    <td class="align-middle text-center">
                        <div class="btn-group shadow-sm">
                            ${showEditButton ? `<button class="btn btn-sm btn-warning px-3" onclick="editUser(${user.user_id})" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>` : ''}
                            ${showArchiveButton ? `<button class="btn btn-sm btn-info px-3" onclick="archiveUser(${user.user_id}, '${escapeHtml(user.username)}', '${user.role}')" title="Archive">
                                <i class="fas fa-archive"></i>
                            </button>` : ''}
                            ${showDeleteButton ? `<button class="btn btn-sm btn-danger px-3" onclick="confirmDeleteUser(${user.user_id}, '${escapeHtml(user.username)}', '${user.role}')" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>` : ''}
                            ${!showEditButton && !showDeleteButton && !showArchiveButton ? '<span class="badge bg-secondary">Protected</span>' : ''}
                        </div>
                    </td>
                </tr>
            `;
        });
    }
    
    document.getElementById('usersTable').innerHTML = html;
}

function filterUsers() {
    const searchTerm = document.getElementById('searchInputField').value.toLowerCase();
    const roleFilter = document.getElementById('roleFilterSelect').value;
    
    let filtered = allUsers.filter(function(user) {
        if (searchTerm) {
            const matchUsername = user.username.toLowerCase().includes(searchTerm);
            const matchEmail = (user.email || '').toLowerCase().includes(searchTerm);
            if (!matchUsername && !matchEmail) return false;
        }
        
        if (roleFilter !== 'all' && user.role !== roleFilter) return false;
        
        return true;
    });
    
    displayUsers(filtered);
}

function resetFilters() {
    document.getElementById('searchInputField').value = '';
    document.getElementById('roleFilterSelect').value = 'all';
    displayUsers(allUsers);
}

// ============ DELETE CONFIRMATION MODAL WITH REASON ============

function confirmDeleteUser(userId, username, role) {
    // Create confirmation modal with reason
    const modalHtml = `
        <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Confirm Deletion
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <strong>Warning:</strong> This user will be archived before permanent deletion.
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">User Details:</label>
                            <div class="p-3 bg-light rounded">
                                <p class="mb-1"><strong>Username:</strong> ${escapeHtml(username)}</p>
                                <p class="mb-1"><strong>Role:</strong> <span class="badge bg-${role === 'admin' ? 'danger' : role === 'manager' ? 'warning' : 'info'}">${role}</span></p>
                                <p class="mb-0"><strong>User ID:</strong> ${userId}</p>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="deleteReason" class="form-label fw-bold">Reason for Deletion:</label>
                            <textarea class="form-control" id="deleteReason" rows="3" placeholder="Please provide a reason for deleting this user..."></textarea>
                            <small class="text-muted">This reason will be stored in the archive for audit purposes.</small>
                        </div>
                        
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="confirmCheckbox">
                            <label class="form-check-label" for="confirmCheckbox">
                                I understand that this action cannot be undone. The user will be archived first, then permanently deleted.
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn" disabled onclick="executeDelete(${userId})">
                            <i class="fas fa-archive me-1"></i> Archive & Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal if any
    $('#deleteConfirmModal').remove();
    $('body').append(modalHtml);
    
    // Store user ID and role in hidden form
    $('#deleteUserId').val(userId);
    $('#deleteUserRole').val(role);
    
    // Show modal
    $('#deleteConfirmModal').modal('show');
    
    // Enable/disable confirm button based on checkbox
    $('#confirmCheckbox').on('change', function() {
        $('#confirmDeleteBtn').prop('disabled', !$(this).is(':checked'));
    });
    
    // Clean up when hidden
    $('#deleteConfirmModal').on('hidden.bs.modal', function() {
        $('#deleteConfirmModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function executeDelete(userId) {
    const reason = document.getElementById('deleteReason').value || 'No reason provided';
    
    // Close the confirmation modal
    $('#deleteConfirmModal').modal('hide');
    
    // Show loading notification
    showNotification('Archiving and deleting user...', 'info');
    
    const formData = new FormData();
    formData.append('reason', reason);
    
    jQuery.ajax({
        url: `/api/users/delete/${userId}`,
        method: 'DELETE',
        data: formData,
        processData: false,
        contentType: false,
        success: function(response) {
            if(response.success) {
                showNotification(response.message || 'User archived and deleted successfully!', 'success');
                loadUsers();
            } else {
                showNotification(response.message || 'Could not delete user', 'error');
            }
        },
        error: function(xhr) {
            let message = 'Error deleting user';
            if (xhr.responseJSON && xhr.responseJSON.message) {
                message = xhr.responseJSON.message;
            }
            showNotification(message, 'error');
        }
    });
}

// ============ ARCHIVE FUNCTIONS ============

function archiveUser(userId, username, role) {
    // Create archive confirmation modal
    const modalHtml = `
        <div class="modal fade" id="archiveModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-info text-white">
                        <h5 class="modal-title">
                            <i class="fas fa-archive me-2"></i>
                            Archive User
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            Archiving will preserve user data for record-keeping purposes.
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">User Details:</label>
                            <div class="p-3 bg-light rounded">
                                <p class="mb-1"><strong>Username:</strong> ${escapeHtml(username)}</p>
                                <p class="mb-1"><strong>Role:</strong> <span class="badge bg-${role === 'admin' ? 'danger' : role === 'manager' ? 'warning' : 'info'}">${role}</span></p>
                                <p class="mb-0"><strong>User ID:</strong> ${userId}</p>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="archiveReason" class="form-label fw-bold">Reason for Archiving:</label>
                            <textarea class="form-control" id="archiveReason" rows="3" placeholder="Please provide a reason for archiving this user..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-info" onclick="executeArchive(${userId})">
                            <i class="fas fa-archive me-1"></i> Archive User
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal if any
    $('#archiveModal').remove();
    $('body').append(modalHtml);
    
    // Show modal
    $('#archiveModal').modal('show');
    
    // Clean up when hidden
    $('#archiveModal').on('hidden.bs.modal', function() {
        $('#archiveModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function executeArchive(userId) {
    const reason = document.getElementById('archiveReason').value || 'No reason provided';
    
    // Close the archive modal
    $('#archiveModal').modal('hide');
    
    showNotification('Archiving user...', 'info');
    
    const formData = new FormData();
    formData.append('reason', reason);
    
    jQuery.ajax({
        url: `/api/users/archive/${userId}`,
        method: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function(response) {
            if(response.success) {
                showNotification(response.message || 'User archived successfully!', 'success');
                loadUsers();
            } else {
                showNotification(response.message || 'Could not archive user', 'error');
            }
        },
        error: function(xhr) {
            let message = 'Error archiving user';
            if (xhr.responseJSON && xhr.responseJSON.message) {
                message = xhr.responseJSON.message;
            }
            showNotification(message, 'error');
        }
    });
}

// ============ VIEW ARCHIVED USERS ============

function showArchivedUsers() {
    showNotification('Loading archived users...', 'info');
    
    jQuery.ajax({
        url: '/api/users/archived',
        method: 'GET',
        success: function(data) {
            if (data.length === 0) {
                showNotification('No archived users found', 'info');
                return;
            }
            displayArchivedUsersModal(data);
        },
        error: function(xhr) {
            let message = 'Error loading archived users';
            if (xhr.responseJSON && xhr.responseJSON.message) {
                message = xhr.responseJSON.message;
            }
            showNotification(message, 'error');
        }
    });
}

function displayArchivedUsersModal(archivedUsers) {
    let tableRows = '';
    
    archivedUsers.forEach(function(user) {
        let roleClass = '';
        let roleName = user.role;
        
        switch(user.role) {
            case 'admin': roleClass = 'role-admin'; roleName = 'Admin'; break;
            case 'manager': roleClass = 'role-manager'; roleName = 'Manager'; break;
            case 'receptionist': roleClass = 'role-receptionist'; roleName = 'Receptionist'; break;
            case 'guest': roleClass = 'role-guest'; roleName = 'Guest'; break;
            default: roleClass = 'role-guest';
        }
        
        tableRows += `
            <tr>
                <td>${user.archive_id}</td>
                <td>${escapeHtml(user.username)}</td>
                <td>${escapeHtml(user.email || '-')}</td>
                <td><span class="role-badge ${roleClass}">${roleName}</span></td>
                <td>${user.created_at ? user.created_at.split(' ')[0] : '-'}</td>
                <td>${user.archived_at ? user.archived_at.split(' ')[0] : '-'}</td>
                <td>${escapeHtml(user.archived_by_username || 'Unknown')}</td>
                <td>
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-success btn-sm" onclick="restoreArchivedUser(${user.archive_id})" title="Restore">
                            <i class="fas fa-undo"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="permanentlyDeleteArchivedUser(${user.archive_id}, '${escapeHtml(user.username)}')" title="Permanent Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    });
    
    const modalHtml = `
        <div class="modal fade" id="archivedUsersModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title">
                            <i class="fas fa-archive me-2"></i>
                            Archived Users (${archivedUsers.length})
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-secondary">
                                    <tr>
                                        <th>Archive ID</th>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Created</th>
                                        <th>Archived Date</th>
                                        <th>Archived By</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal if any
    $('#archivedUsersModal').remove();
    $('body').append(modalHtml);
    
    // Show modal
    $('#archivedUsersModal').modal('show');
    
    // Clean up when hidden
    $('#archivedUsersModal').on('hidden.bs.modal', function() {
        $('#archivedUsersModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function restoreArchivedUser(archiveId) {
    if (confirm('Are you sure you want to restore this user?')) {
        jQuery.ajax({
            url: `/api/users/restore/${archiveId}`,
            method: 'POST',
            success: function(response) {
                if(response.success) {
                    showNotification(response.message, 'success');
                    // Close the archived users modal
                    $('#archivedUsersModal').modal('hide');
                    loadUsers();
                } else {
                    showNotification(response.message || 'Error restoring user', 'error');
                }
            },
            error: function(xhr) {
                let message = 'Error restoring user';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    message = xhr.responseJSON.message;
                }
                showNotification(message, 'error');
            }
        });
    }
}

function permanentlyDeleteArchivedUser(archiveId, username) {
    if (confirm(`⚠️ PERMANENT DELETE: ${username}\n\nThis will permanently delete this archived user. This action CANNOT be undone!\n\nAre you sure?`)) {
        jQuery.ajax({
            url: `/api/users/archive/delete/${archiveId}`,
            method: 'DELETE',
            success: function(response) {
                if(response.success) {
                    showNotification(response.message, 'success');
                    // Refresh archived users list
                    showArchivedUsers();
                } else {
                    showNotification(response.message || 'Error permanently deleting user', 'error');
                }
            },
            error: function(xhr) {
                let message = 'Error permanently deleting user';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    message = xhr.responseJSON.message;
                }
                showNotification(message, 'error');
            }
        });
    }
}

// ============ MODAL FUNCTIONS (Dynamic Bootstrap Modal) ============

function showAddUserModal() {
    createUserModal(null);
}

function editUser(userId) {
    const user = allUsers.find(u => u.user_id === userId);
    if (user) {
        createUserModal(user);
    }
}

function createUserModal(userData) {
    var isEdit = userData !== null;
    var userId = isEdit ? userData.user_id : '';
    var username = isEdit ? escapeHtml(userData.username) : '';
    var email = isEdit ? escapeHtml(userData.email || '') : '';
    var phone = isEdit ? escapeHtml(userData.phone || '') : '';
    var role = isEdit ? userData.role : 'receptionist';
    
    // Build role options based on current user's role
    let roleOptions = '';
    let roleDisabled = false;
    let roleNote = '';
    
    if (currentUserRole === 'admin') {
        // Admin can create all roles when adding new users
        if (!isEdit) {
            roleOptions = `
                <option value="receptionist" ${role == 'receptionist' ? 'selected' : ''}>Receptionist</option>
                <option value="manager" ${role == 'manager' ? 'selected' : ''}>Manager</option>
                <option value="admin" ${role == 'admin' ? 'selected' : ''}>Admin</option>
                <option value="guest" ${role == 'guest' ? 'selected' : ''}>Guest</option>
            `;
        } else {
            // When editing, admins cannot edit admin users (shouldn't reach here due to UI restrictions)
            if (role === 'admin') {
                roleDisabled = true;
                roleNote = 'Admin accounts are protected and cannot be modified';
            }
            roleOptions = `
                <option value="receptionist" ${role == 'receptionist' ? 'selected' : ''}>Receptionist</option>
                <option value="manager" ${role == 'manager' ? 'selected' : ''}>Manager</option>
                <option value="admin" ${role == 'admin' ? 'selected' : ''}>Admin</option>
                <option value="guest" ${role == 'guest' ? 'selected' : ''}>Guest</option>
            `;
        }
    } else if (currentUserRole === 'manager') {
        // Manager can add receptionists, managers, and guests
        if (!isEdit) {
            roleOptions = `
                <option value="receptionist" ${role == 'receptionist' ? 'selected' : ''}>Receptionist</option>
                <option value="manager" ${role == 'manager' ? 'selected' : ''}>Manager</option>
                <option value="guest" ${role == 'guest' ? 'selected' : ''}>Guest</option>
            `;
            roleNote = 'Managers can assign Receptionist, Manager, or Guest roles';
        } else {
            // When editing, managers cannot edit manager accounts
            if (role === 'manager') {
                roleDisabled = true;
                roleNote = 'Manager accounts cannot be modified by other managers';
            }
            roleOptions = `
                <option value="receptionist" ${role == 'receptionist' ? 'selected' : ''}>Receptionist</option>
                <option value="manager" ${role == 'manager' ? 'selected' : ''}>Manager</option>
                <option value="guest" ${role == 'guest' ? 'selected' : ''}>Guest</option>
            `;
        }
    }
    
    var modalHtml = `
        <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas ${isEdit ? 'fa-user-edit' : 'fa-user-plus'} me-2" style="color: var(--gold-400);"></i>
                            <span>${isEdit ? 'Edit User' : 'Add User'}</span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="userForm">
                            <input type="hidden" id="userIdInput" name="user_id" value="${userId}">
                            
                            <div class="mb-3">
                                <label class="form-label">Username <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="usernameInput" name="username" value="${username}" required autocomplete="username">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password ${!isEdit ? '<span class="text-danger">*</span>' : ''}</label>
                                <input type="password" class="form-control" id="passwordInput" name="password" autocomplete="new-password">
                                ${isEdit ? '<small class="text-muted">Leave blank to keep current password</small>' : '<small class="text-muted">Enter a secure password</small>'}
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="emailInput" name="email" value="${email}" autocomplete="email">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Phone</label>
                                    <input type="tel" class="form-control" id="phoneInput" name="phone" value="${phone}" autocomplete="tel">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Role <span class="text-danger">*</span></label>
                                <select class="form-select" id="roleSelect" name="role" required ${roleDisabled ? 'disabled' : ''}>
                                    ${roleOptions}
                                </select>
                                ${roleNote ? `<small class="text-muted">${roleNote}</small>` : ''}
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="saveUser()">Save User <i class="fas fa-save ms-1"></i></button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal if any
    $('#userModal').remove();
    // Append new modal
    $('body').append(modalHtml);
    
    // Show modal
    $('#userModal').modal('show');
    
    // Clean up when hidden
    $('#userModal').on('hidden.bs.modal', function() {
        $('#userModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function saveUser() {
    const userId = document.getElementById('userIdInput').value;
    const username = document.getElementById('usernameInput').value;
    const password = document.getElementById('passwordInput').value;
    const email = document.getElementById('emailInput').value;
    const phone = document.getElementById('phoneInput').value;
    const roleSelect = document.getElementById('roleSelect');
    const role = roleSelect.disabled ? (allUsers.find(u => u.user_id == userId)?.role || 'receptionist') : roleSelect.value;
    
    if (!username) {
        if (typeof showNotification === 'function') {
            showNotification('Username is required', 'warning');
        } else {
            alert('Username is required');
        }
        return;
    }
    
    if (!userId && !password) {
        if (typeof showNotification === 'function') {
            showNotification('Password is required for new user', 'warning');
        } else {
            alert('Password is required for new user');
        }
        return;
    }
    
    // Manager-specific validation
    if (currentUserRole === 'manager') {
        // Managers cannot create admin users
        if (role === 'admin') {
            showNotification('Managers cannot create or edit admin users', 'error');
            return;
        }
    }
    
    // Admin-specific validation
    if (currentUserRole === 'admin') {
        // Admins cannot edit admin users (check if editing an admin)
        const userToEdit = allUsers.find(u => u.user_id == userId);
        if (userToEdit && userToEdit.role === 'admin') {
            showNotification('Admin accounts cannot be modified', 'error');
            return;
        }
    }
    
    const formData = new FormData();
    formData.append('user_id', userId);
    formData.append('username', username);
    if (password) formData.append('password', password);
    formData.append('email', email);
    formData.append('phone', phone);
    formData.append('role', role);
    
    const $btn = $('#userModal .btn-primary');
    const originalText = $btn.html();
    $btn.html('<span class="spinner-border spinner-border-sm me-2"></span> Saving...');
    $btn.prop('disabled', true);
    
    jQuery.ajax({
        url: '/api/users/save',
        method: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function(response) {
            if (response.success) {
                if (typeof showNotification === 'function') {
                    showNotification(userId ? 'User updated successfully!' : 'User created successfully!', 'success');
                } else {
                    alert(userId ? 'User updated successfully!' : 'User created successfully!');
                }
                $('#userModal').modal('hide');
                loadUsers();
            } else {
                if (typeof showNotification === 'function') {
                    showNotification(response.message || 'Error saving user', 'error');
                } else {
                    alert(response.message || 'Error saving user');
                }
            }
            $btn.html(originalText);
            $btn.prop('disabled', false);
        },
        error: function(xhr) {
            let message = 'Error saving user';
            if (xhr.responseJSON && xhr.responseJSON.message) {
                message = xhr.responseJSON.message;
            }
            if (typeof showNotification === 'function') {
                showNotification(message, 'error');
            } else {
                alert(message);
            }
            $btn.html(originalText);
            $btn.prop('disabled', false);
        }
    });
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Global notification function if not available
if (typeof showNotification !== 'function') {
    window.showNotification = function(message, type) {
        var alertClass = '';
        var icon = '';
        
        if (type === 'error') { alertClass = 'danger'; icon = '<i class="fas fa-exclamation-circle me-2"></i> '; } 
        else if (type === 'success') { alertClass = 'success'; icon = '<i class="fas fa-check-circle me-2"></i> '; } 
        else if (type === 'warning') { alertClass = 'warning'; icon = '<i class="fas fa-exclamation-triangle me-2"></i> '; } 
        else { alertClass = 'info'; icon = '<i class="fas fa-info-circle me-2"></i> '; }
        
        var alertHtml = '<div class="alert alert-' + alertClass + ' alert-dismissible fade show border-0 shadow-sm" role="alert" style="position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 300px;">' +
            icon + '<strong>' + message + '</strong>' +
            '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
            '</div>';
        
        jQuery('body').append(alertHtml);
        
        setTimeout(function() {
            jQuery('.alert').fadeOut(500, function() { jQuery(this).remove(); });
        }, 4000);
    };
}
</script>


{% endblock %}
