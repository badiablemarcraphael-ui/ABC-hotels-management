{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 fade-in">
    <h2 class="mb-0 fw-bold"><i class="fas fa-users text-primary me-2"></i> User Management</h2>
    <div>
        <button class="btn btn-outline-info shadow-sm fw-bold me-2" onclick="showArchivedUsers()">
            <i class="fas fa-archive me-1"></i> View Archives
        </button>
        <button class="btn btn-primary shadow-sm fw-bold" onclick="showAddUserModal()">
            <i class="fas fa-user-plus me-1"></i> Add User
        </button>
    </div>
</div>

<div class="filter-bar fade-in" style="animation-delay: 0.1s;">
    <div class="row align-items-end g-3">
        <div class="col-md-5">
            <label for="searchInputField" class="fw-bold text-muted mb-1"><i class="fas fa-search me-1"></i> Search Users</label>
            <input type="text" id="searchInputField" class="form-control shadow-sm" placeholder="Search by username or email..." autocomplete="off">
        </div>
        <div class="col-md-4">
            <label for="roleFilterSelect" class="fw-bold text-muted mb-1"><i class="fas fa-filter me-1"></i> Filter by Role</label>
            <select id="roleFilterSelect" class="form-select shadow-sm" autocomplete="off">
                <option value="all">All Roles</option>
                <option value="admin">👑 Admin</option>
                <option value="receptionist">🛎️ Receptionist</option>
                <option value="manager">📊 Manager</option>
                <option value="guest">🏨 Guest</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="fw-bold d-block mb-1">&nbsp;</label>
            <button class="btn btn-secondary w-100 shadow-sm fw-bold" onclick="resetFilters()">
                <i class="fas fa-undo me-1"></i> Reset
            </button>
        </div>
    </div>
</div>

<div class="table-responsive shadow-sm fade-in" style="border-radius: 16px; animation-delay: 0.2s;">
    <table class="table table-bordered table-hover mb-0">
        <thead style="background: linear-gradient(135deg, #1a2744 0%, #243356 100%);">
            <tr>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">ID</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Username</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Email</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Phone</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Role</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Created</th>
                <th class="py-3 text-white text-center" style="border-bottom: 2px solid #c9a84c;">Actions</th>
            </tr>
        </thead>
        <tbody id="usersTable">
            <tr>
                <td colspan="7" class="text-center py-5">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <p class="text-muted fw-bold">Loading users...</p>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
let allUsers = [];
let currentUserRole = null;
let currentUserId = null;

(function() {
    function waitForjQuery() {
        if (typeof jQuery !== 'undefined') {
            console.log("✅ jQuery loaded, initializing users page...");
            initUsersPage();
        } else {
            console.log("⏳ Waiting for jQuery to load...");
            setTimeout(waitForjQuery, 100);
        }
    }
    
    function initUsersPage() {
        jQuery(document).ready(function($) {
            if (window.GrandHotel && window.GrandHotel.getCurrentUser()) {
                currentUserRole = window.GrandHotel.getCurrentUser().role;
                currentUserId = window.GrandHotel.getCurrentUser().userId;
            } else {
                $.ajax({
                    url: '/api/users/check-auth',
                    method: 'GET',
                    async: false,
                    success: function(data) {
                        if (data.authenticated) {
                            currentUserRole = data.role;
                            currentUserId = data.user_id;
                        }
                    }
                });
            }
            
            loadUsers();
            
            $('#searchInputField').on('keyup', function() { filterUsers(); });
            $('#roleFilterSelect').on('change', function() { filterUsers(); });
        });
    }
    
    waitForjQuery();
})();

function loadUsers() {
    console.log("📋 Loading users...");
    jQuery.ajax({
        url: '/api/users/list',
        method: 'GET',
        success: function(data) {
            console.log("✅ Users data received:", data.length);
            allUsers = data;
            displayUsers(allUsers);
        },
        error: function(xhr, status, error) {
            console.error("❌ Error loading users:", error);
            document.getElementById('usersTable').innerHTML = `
                <tr><td colspan="7" class="text-center text-danger py-4 fw-bold"><i class="fas fa-exclamation-triangle me-2"></i>Error loading users</td></tr>
            `;
        }
    });
}

function displayUsers(users) {
    let html = '';
    
    if (!users || users.length === 0) {
        html = '<tr><td colspan="7" class="text-center text-muted py-5 fw-bold"><i class="fas fa-search fa-2x mb-3 d-block opacity-50"></i>No users found</td></tr>';
    } else {
        users.forEach(function(user) {
            let roleClass = '';
            let roleName = user.role;
            let roleIcon = '';
            
            switch(user.role) {
                case 'admin': roleClass = 'role-admin'; roleName = 'Admin'; roleIcon = '👑'; break;
                case 'manager': roleClass = 'role-manager'; roleName = 'Manager'; roleIcon = '📊'; break;
                case 'receptionist': roleClass = 'role-receptionist'; roleName = 'Receptionist'; roleIcon = '🛎️'; break;
                case 'guest': roleClass = 'role-guest'; roleName = 'Guest'; roleIcon = '🏨'; break;
                default: roleClass = 'role-guest'; roleIcon = '👤';
            }
            
            let showEditButton = true;
            let showDeleteButton = true;
            let showArchiveButton = false;
            
            if (user.role === 'admin') {
                showEditButton = false;
                showDeleteButton = false;
                if (currentUserRole === 'admin' && user.user_id != currentUserId) {
                    showArchiveButton = true;
                }
            }
            
            if (currentUserRole === 'manager') {
                if (user.role === 'manager') {
                    showDeleteButton = false;
                    showEditButton = false;
                }
            } else if (currentUserRole === 'admin') {
                if (user.role === 'manager' && user.user_id != currentUserId) {
                    showArchiveButton = true;
                }
            }
            
            html += `
                <tr class="fade-in">
                    <td class="align-middle fw-bold text-muted">#${user.user_id}</td>
                    <td class="align-middle fw-bold text-primary">${escapeHtml(user.username)}</td>
                    <td class="align-middle">${escapeHtml(user.email || '-')}</td>
                    <td class="align-middle">${escapeHtml(user.phone || '-')}</td>
                    <td class="align-middle"><span class="role-badge ${roleClass} shadow-sm">${roleIcon} ${roleName}</span></td>
                    <td class="align-middle text-muted small fw-bold">${user.created_at ? user.created_at.split(' ')[0] : '-'}</td>
                    <td class="align-middle text-center">
                        <div class="btn-group shadow-sm">
                            ${showEditButton ? `<button class="btn btn-sm btn-warning px-3" onclick="editUser(${user.user_id})" title="Edit User"><i class="fas fa-edit"></i></button>` : ''}
                            ${showArchiveButton ? `<button class="btn btn-sm btn-info px-3" onclick="archiveUser(${user.user_id}, '${escapeHtml(user.username)}', '${user.role}')" title="Archive User"><i class="fas fa-archive"></i></button>` : ''}
                            ${showDeleteButton ? `<button class="btn btn-sm btn-danger px-3" onclick="confirmDeleteUser(${user.user_id}, '${escapeHtml(user.username)}', '${user.role}')" title="Delete User"><i class="fas fa-trash"></i></button>` : ''}
                            ${!showEditButton && !showDeleteButton && !showArchiveButton ? '<span class="badge bg-secondary px-3 py-2"><i class="fas fa-shield-halved me-1"></i>Protected</span>' : ''}
                        </div>
                    </td>
                </tr>
            `;
        });
    }
    
    document.getElementById('usersTable').innerHTML = html;
}

function filterUsers() {
    const searchTerm = document.getElementById('searchInputField').value.toLowerCase();
    const roleFilter = document.getElementById('roleFilterSelect').value;
    
    let filtered = allUsers.filter(function(user) {
        if (searchTerm) {
            const matchUsername = user.username.toLowerCase().includes(searchTerm);
            const matchEmail = (user.email || '').toLowerCase().includes(searchTerm);
            if (!matchUsername && !matchEmail) return false;
        }
        
        if (roleFilter !== 'all' && user.role !== roleFilter) return false;
        
        return true;
    });
    
    displayUsers(filtered);
}

function resetFilters() {
    document.getElementById('searchInputField').value = '';
    document.getElementById('roleFilterSelect').value = 'all';
    displayUsers(allUsers);
}

// ============ DELETE CONFIRMATION MODAL ============
function confirmDeleteUser(userId, username, role) {
    $('#deleteConfirmModal').remove();
    $('.modal-backdrop').remove();
    $('body').removeClass('modal-open');
    $('body').css('overflow', '');
    
    const roleColors = { admin: 'danger', manager: 'warning', receptionist: 'info', guest: 'secondary' };
    const roleIcons = { admin: '👑', manager: '📊', receptionist: '🛎️', guest: '🏨' };
    
    const modalHtml = `
        <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                    <div class="modal-header border-0" style="background: linear-gradient(135deg, #8b3a3a, #a84848); border-radius: 20px 20px 0 0;">
                        <h5 class="modal-title text-white fw-bold">
                            <i class="fas fa-exclamation-triangle me-2" style="color: #f0e4c3;"></i>
                            Confirm Deletion
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="alert border-0 rounded-3 mb-4" style="background: rgba(184, 134, 11, 0.1); color: #8b6508;">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <strong>Warning:</strong> This user will be archived before permanent deletion.
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">User Details</label>
                            <div class="p-3 rounded-3" style="background: #f9fafb; border: 1px solid #e5e7eb;">
                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <div style="width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #c9a84c, #a88838); display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">${roleIcons[role] || '👤'}</div>
                                    <div>
                                        <strong class="d-block text-dark">${escapeHtml(username)}</strong>
                                        <span class="badge bg-${roleColors[role] || 'secondary'} px-3 py-1 rounded-pill">${role}</span>
                                    </div>
                                </div>
                                <small class="text-muted">User ID: <strong>#${userId}</strong></small>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="deleteReason" class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">Reason for Deletion</label>
                            <textarea class="form-control" id="deleteReason" rows="3" placeholder="Please provide a reason for deleting this user..." style="border-radius: 12px; resize: none;"></textarea>
                            <small class="text-muted">This reason will be stored in the archive for audit purposes.</small>
                        </div>
                        
                        <div class="form-check p-3 rounded-3" style="background: rgba(139, 58, 58, 0.05); border: 1px solid rgba(139, 58, 58, 0.1);">
                            <input class="form-check-input" type="checkbox" id="confirmCheckbox" style="margin-top: 0.3rem;">
                            <label class="form-check-label fw-bold text-danger" for="confirmCheckbox">
                                I understand that this action cannot be undone. The user will be archived first, then permanently deleted.
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer border-0" style="background: #f9fafb; border-radius: 0 0 20px 20px;">
                        <button type="button" class="btn btn-outline-secondary fw-bold px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger fw-bold px-4 rounded-pill" id="confirmDeleteBtn" disabled onclick="executeDelete(${userId})">
                            <i class="fas fa-archive me-1"></i> Archive & Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    $('body').append(modalHtml);
    $('#deleteConfirmModal').modal('show');
    
    $('#confirmCheckbox').on('change', function() {
        $('#confirmDeleteBtn').prop('disabled', !$(this).is(':checked'));
    });
    
    $('#deleteConfirmModal').on('hidden.bs.modal', function() {
        $('#deleteConfirmModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function executeDelete(userId) {
    const reason = document.getElementById('deleteReason').value || 'No reason provided';
    $('#deleteConfirmModal').modal('hide');
    showNotification('Archiving and deleting user...', 'info');
    
    const formData = new FormData();
    formData.append('reason', reason);
    
    jQuery.ajax({
        url: `/api/users/delete/${userId}`,
        method: 'DELETE',
        data: formData,
        processData: false,
        contentType: false,
        success: function(response) {
            if(response.success) {
                showNotification(response.message || 'User archived and deleted successfully!', 'success');
                loadUsers();
            } else {
                showNotification(response.message || 'Could not delete user', 'error');
            }
        },
        error: function(xhr) {
            let message = 'Error deleting user';
            if (xhr.responseJSON && xhr.responseJSON.message) message = xhr.responseJSON.message;
            showNotification(message, 'error');
        }
    });
}

// ============ ARCHIVE MODAL ============
function archiveUser(userId, username, role) {
    $('#archiveModal').remove();
    $('.modal-backdrop').remove();
    $('body').removeClass('modal-open');
    $('body').css('overflow', '');
    
    const roleColors = { admin: 'danger', manager: 'warning', receptionist: 'info', guest: 'secondary' };
    const roleIcons = { admin: '👑', manager: '📊', receptionist: '🛎️', guest: '🏨' };
    
    const modalHtml = `
        <div class="modal fade" id="archiveModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                    <div class="modal-header border-0" style="background: linear-gradient(135deg, #1a2744, #243356); border-radius: 20px 20px 0 0;">
                        <h5 class="modal-title text-white fw-bold">
                            <i class="fas fa-archive me-2" style="color: #c9a84c;"></i>
                            Archive User
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="alert border-0 rounded-3 mb-4" style="background: rgba(74, 124, 150, 0.1); color: #2c5f72;">
                            <i class="fas fa-info-circle me-2"></i>
                            Archiving will preserve user data for record-keeping purposes.
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">User Details</label>
                            <div class="p-3 rounded-3" style="background: #f9fafb; border: 1px solid #e5e7eb;">
                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <div style="width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #c9a84c, #a88838); display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">${roleIcons[role] || '👤'}</div>
                                    <div>
                                        <strong class="d-block text-dark">${escapeHtml(username)}</strong>
                                        <span class="badge bg-${roleColors[role] || 'secondary'} px-3 py-1 rounded-pill">${role}</span>
                                    </div>
                                </div>
                                <small class="text-muted">User ID: <strong>#${userId}</strong></small>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="archiveReason" class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">Reason for Archiving</label>
                            <textarea class="form-control" id="archiveReason" rows="3" placeholder="Please provide a reason for archiving this user..." style="border-radius: 12px; resize: none;"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0" style="background: #f9fafb; border-radius: 0 0 20px 20px;">
                        <button type="button" class="btn btn-outline-secondary fw-bold px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-info fw-bold px-4 rounded-pill text-white" onclick="executeArchive(${userId})" style="background: linear-gradient(135deg, #4a7c96, #3a6b85); border: none;">
                            <i class="fas fa-archive me-1"></i> Archive User
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    $('body').append(modalHtml);
    $('#archiveModal').modal('show');
    
    $('#archiveModal').on('hidden.bs.modal', function() {
        $('#archiveModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function executeArchive(userId) {
    const reason = document.getElementById('archiveReason').value || 'No reason provided';
    $('#archiveModal').modal('hide');
    showNotification('Archiving user...', 'info');
    
    const formData = new FormData();
    formData.append('reason', reason);
    
    jQuery.ajax({
        url: `/api/users/archive/${userId}`,
        method: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function(response) {
            if(response.success) {
                showNotification(response.message || 'User archived successfully!', 'success');
                loadUsers();
            } else {
                showNotification(response.message || 'Could not archive user', 'error');
            }
        },
        error: function(xhr) {
            showNotification('Error archiving user', 'error');
        }
    });
}

// ============ VIEW ARCHIVED USERS (UNIFIED MODAL STYLE) ============
function showArchivedUsers() {
    showNotification('Loading archived users...', 'info');
    
    jQuery.ajax({
        url: '/api/users/archived',
        method: 'GET',
        success: function(data) {
            if (data.length === 0) {
                showNotification('No archived users found', 'info');
                return;
            }
            displayArchivedUsersModal(data);
        },
        error: function(xhr) {
            showNotification('Error loading archived users', 'error');
        }
    });
}

function displayArchivedUsersModal(archivedUsers) {
    $('#archivedUsersModal').remove();
    $('.modal-backdrop').remove();
    $('body').removeClass('modal-open');
    $('body').css('overflow', '');
    
    let tableRows = '';
    
    archivedUsers.forEach(function(user) {
        let roleClass = '';
        let roleIcon = '';
        
        switch(user.role) {
            case 'admin': roleClass = 'role-admin'; roleIcon = '👑'; break;
            case 'manager': roleClass = 'role-manager'; roleIcon = '📊'; break;
            case 'receptionist': roleClass = 'role-receptionist'; roleIcon = '🛎️'; break;
            case 'guest': roleClass = 'role-guest'; roleIcon = '🏨'; break;
            default: roleClass = 'role-guest'; roleIcon = '👤';
        }
        
        tableRows += `
            <tr>
                <td class="align-middle fw-bold text-muted">#${user.archive_id}</td>
                <td class="align-middle fw-bold text-primary">${escapeHtml(user.username)}</td>
                <td class="align-middle">${escapeHtml(user.email || '-')}</td>
                <td class="align-middle"><span class="role-badge ${roleClass}">${roleIcon} ${user.role}</span></td>
                <td class="align-middle text-muted small">${user.created_at ? user.created_at.split(' ')[0] : '-'}</td>
                <td class="align-middle text-muted small">${user.archived_at ? user.archived_at.split(' ')[0] : '-'}</td>
                <td class="align-middle fw-bold">${escapeHtml(user.archived_by_username || 'Unknown')}</td>
                <td class="align-middle text-center">
                    <div class="btn-group shadow-sm">
                        <button class="btn btn-sm btn-success px-3" onclick="restoreArchivedUser(${user.archive_id})" title="Restore User"><i class="fas fa-undo"></i></button>
                        <button class="btn btn-sm btn-danger px-3" onclick="permanentlyDeleteArchivedUser(${user.archive_id}, '${escapeHtml(user.username)}')" title="Permanent Delete"><i class="fas fa-trash"></i></button>
                    </div>
                </td>
            </tr>
        `;
    });
    
    const modalHtml = `
        <div class="modal fade" id="archivedUsersModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                    <div class="modal-header border-0" style="background: linear-gradient(135deg, #1a2744, #243356); border-radius: 20px 20px 0 0;">
                        <h5 class="modal-title text-white fw-bold">
                            <i class="fas fa-archive me-2" style="color: #c9a84c;"></i>
                            Archived Users <span class="badge bg-warning text-dark ms-2">${archivedUsers.length}</span>
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead style="background: #f8f9fa;">
                                    <tr>
                                        <th class="py-3 px-4 text-muted fw-bold text-uppercase" style="font-size: 0.75rem;">Archive ID</th>
                                        <th class="py-3 text-muted fw-bold text-uppercase" style="font-size: 0.75rem;">Username</th>
                                        <th class="py-3 text-muted fw-bold text-uppercase" style="font-size: 0.75rem;">Email</th>
                                        <th class="py-3 text-muted fw-bold text-uppercase" style="font-size: 0.75rem;">Role</th>
                                        <th class="py-3 text-muted fw-bold text-uppercase" style="font-size: 0.75rem;">Created</th>
                                        <th class="py-3 text-muted fw-bold text-uppercase" style="font-size: 0.75rem;">Archived</th>
                                        <th class="py-3 text-muted fw-bold text-uppercase" style="font-size: 0.75rem;">Archived By</th>
                                        <th class="py-3 px-4 text-muted fw-bold text-uppercase text-center" style="font-size: 0.75rem;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                        </div>
                    </div>
                    <div class="modal-footer border-0" style="background: #f9fafb; border-radius: 0 0 20px 20px;">
                        <button type="button" class="btn btn-outline-secondary fw-bold px-4 rounded-pill" data-bs-dismiss="modal">
                            <i class="fas fa-times me-1"></i> Close
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    $('body').append(modalHtml);
    $('#archivedUsersModal').modal('show');
    
    $('#archivedUsersModal').on('hidden.bs.modal', function() {
        $('#archivedUsersModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function restoreArchivedUser(archiveId) {
    if (confirm('Are you sure you want to restore this user?')) {
        jQuery.ajax({
            url: `/api/users/restore/${archiveId}`,
            method: 'POST',
            success: function(response) {
                if(response.success) {
                    showNotification(response.message, 'success');
                    $('#archivedUsersModal').modal('hide');
                    loadUsers();
                } else {
                    showNotification(response.message || 'Error restoring user', 'error');
                }
            },
            error: function() { showNotification('Error restoring user', 'error'); }
        });
    }
}

function permanentlyDeleteArchivedUser(archiveId, username) {
    if (confirm(`⚠️ PERMANENT DELETE: ${username}\n\nThis will permanently delete this archived user. This action CANNOT be undone!\n\nAre you sure?`)) {
        jQuery.ajax({
            url: `/api/users/archive/delete/${archiveId}`,
            method: 'DELETE',
            success: function(response) {
                if(response.success) {
                    showNotification(response.message, 'success');
                    showArchivedUsers();
                } else {
                    showNotification(response.message || 'Error permanently deleting user', 'error');
                }
            },
            error: function() { showNotification('Error permanently deleting user', 'error'); }
        });
    }
}

// ============ ADD/EDIT USER MODAL (UNIFIED STYLE) ============
function showAddUserModal() { createUserModal(null); }

function editUser(userId) {
    const user = allUsers.find(u => u.user_id === userId);
    if (user) createUserModal(user);
}

function createUserModal(userData) {
    $('#userModal').remove();
    $('.modal-backdrop').remove();
    $('body').removeClass('modal-open');
    $('body').css('overflow', '');
    
    var isEdit = userData !== null;
    var userId = isEdit ? userData.user_id : '';
    var username = isEdit ? escapeHtml(userData.username) : '';
    var email = isEdit ? escapeHtml(userData.email || '') : '';
    var phone = isEdit ? escapeHtml(userData.phone || '') : '';
    var role = isEdit ? userData.role : 'receptionist';
    
    let roleOptions = '';
    let roleDisabled = false;
    let roleNote = '';
    
    if (currentUserRole === 'admin') {
        roleOptions = `
            <option value="receptionist" ${role == 'receptionist' ? 'selected' : ''}>🛎️ Receptionist</option>
            <option value="manager" ${role == 'manager' ? 'selected' : ''}>📊 Manager</option>
            <option value="admin" ${role == 'admin' ? 'selected' : ''}>👑 Admin</option>
            <option value="guest" ${role == 'guest' ? 'selected' : ''}>🏨 Guest</option>
        `;
        if (isEdit && role === 'admin') {
            roleDisabled = true;
            roleNote = 'Admin accounts are protected and cannot be modified';
        }
    } else if (currentUserRole === 'manager') {
        roleOptions = `
            <option value="receptionist" ${role == 'receptionist' ? 'selected' : ''}>🛎️ Receptionist</option>
            <option value="manager" ${role == 'manager' ? 'selected' : ''}>📊 Manager</option>
            <option value="guest" ${role == 'guest' ? 'selected' : ''}>🏨 Guest</option>
        `;
        if (isEdit && role === 'manager') {
            roleDisabled = true;
            roleNote = 'Manager accounts cannot be modified by other managers';
        }
        roleNote = roleNote || 'Managers can assign Receptionist, Manager, or Guest roles';
    }
    
    var modalHtml = `
        <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                    <div class="modal-header border-0" style="background: linear-gradient(135deg, #1a2744, #243356); border-radius: 20px 20px 0 0;">
                        <h5 class="modal-title text-white fw-bold">
                            <i class="fas ${isEdit ? 'fa-user-edit' : 'fa-user-plus'} me-2" style="color: #c9a84c;"></i>
                            <span>${isEdit ? 'Edit User' : 'Add New User'}</span>
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <form id="userForm">
                            <input type="hidden" id="userIdInput" name="user_id" value="${userId}">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">
                                    <i class="fas fa-user me-1" style="color: #c9a84c;"></i> Username <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="usernameInput" name="username" value="${username}" required autocomplete="username" placeholder="Enter username" style="border-radius: 12px;">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">
                                    <i class="fas fa-lock me-1" style="color: #c9a84c;"></i> Password ${!isEdit ? '<span class="text-danger">*</span>' : ''}
                                </label>
                                <input type="password" class="form-control" id="passwordInput" name="password" autocomplete="new-password" placeholder="${isEdit ? 'Leave blank to keep current' : 'Enter secure password'}" style="border-radius: 12px;">
                                ${isEdit ? '<small class="text-muted">Leave blank to keep current password</small>' : '<small class="text-muted">Minimum 6 characters</small>'}
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">
                                        <i class="fas fa-envelope me-1" style="color: #c9a84c;"></i> Email
                                    </label>
                                    <input type="email" class="form-control" id="emailInput" name="email" value="${email}" autocomplete="email" placeholder="user@email.com" style="border-radius: 12px;">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">
                                        <i class="fas fa-phone me-1" style="color: #c9a84c;"></i> Phone
                                    </label>
                                    <input type="tel" class="form-control" id="phoneInput" name="phone" value="${phone}" autocomplete="tel" placeholder="+63 9XX XXX XXXX" style="border-radius: 12px;">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px; color: #6b7280;">
                                    <i class="fas fa-shield-halved me-1" style="color: #c9a84c;"></i> Role <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="roleSelect" name="role" required ${roleDisabled ? 'disabled' : ''} style="border-radius: 12px;">
                                    ${roleOptions}
                                </select>
                                ${roleNote ? `<small class="text-muted d-block mt-1"><i class="fas fa-info-circle me-1"></i>${roleNote}</small>` : ''}
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer border-0" style="background: #f9fafb; border-radius: 0 0 20px 20px;">
                        <button type="button" class="btn btn-outline-secondary fw-bold px-4 rounded-pill" data-bs-dismiss="modal">
                            <i class="fas fa-times me-1"></i> Cancel
                        </button>
                        <button type="button" class="btn btn-primary fw-bold px-4 rounded-pill" onclick="saveUser()">
                            <i class="fas fa-save me-1"></i> Save User
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    $('body').append(modalHtml);
    $('#userModal').modal('show');
    
    $('#userModal').on('hidden.bs.modal', function() {
        $('#userModal').remove();
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open');
        $('body').css('overflow', '');
    });
}

function saveUser() {
    const userId = document.getElementById('userIdInput').value;
    const username = document.getElementById('usernameInput').value;
    const password = document.getElementById('passwordInput').value;
    const email = document.getElementById('emailInput').value;
    const phone = document.getElementById('phoneInput').value;
    const roleSelect = document.getElementById('roleSelect');
    const role = roleSelect.disabled ? (allUsers.find(u => u.user_id == userId)?.role || 'receptionist') : roleSelect.value;
    
    if (!username) { showNotification('Username is required', 'warning'); return; }
    if (!userId && !password) { showNotification('Password is required for new user', 'warning'); return; }
    if (currentUserRole === 'manager' && role === 'admin') { showNotification('Managers cannot create or edit admin users', 'error'); return; }
    if (currentUserRole === 'admin') {
        const userToEdit = allUsers.find(u => u.user_id == userId);
        if (userToEdit && userToEdit.role === 'admin') { showNotification('Admin accounts cannot be modified', 'error'); return; }
    }
    
    const formData = new FormData();
    formData.append('user_id', userId);
    formData.append('username', username);
    if (password) formData.append('password', password);
    formData.append('email', email);
    formData.append('phone', phone);
    formData.append('role', role);
    
    const $btn = $('#userModal .btn-primary');
    const originalText = $btn.html();
    $btn.html('<span class="spinner-border spinner-border-sm me-2"></span> Saving...').prop('disabled', true);
    
    jQuery.ajax({
        url: '/api/users/save',
        method: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function(response) {
            if (response.success) {
                showNotification(userId ? 'User updated successfully!' : 'User created successfully!', 'success');
                $('#userModal').modal('hide');
                loadUsers();
            } else {
                showNotification(response.message || 'Error saving user', 'error');
            }
            $btn.html(originalText).prop('disabled', false);
        },
        error: function(xhr) {
            showNotification(xhr.responseJSON?.message || 'Error saving user', 'error');
            $btn.html(originalText).prop('disabled', false);
        }
    });
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showNotification(message, type) {
    if (typeof window.showNotification === 'function') {
        window.showNotification(message, type);
    }
}
</script>
