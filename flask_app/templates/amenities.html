{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 fade-in">
    <h2 class="fw-bold"><i class="fas fa-concierge-bell text-primary me-2"></i> Amenities Management</h2>
    <div>
        <button class="btn btn-outline-primary shadow-sm fw-bold me-2" onclick="toggleSortOrder()" id="sortBtn">
            <i class="fas fa-sort-amount-down me-1"></i> Price: <span id="sortLabel">Low to High</span>
        </button>
        <button class="btn btn-primary shadow-sm fw-bold" onclick="ModalManager.showAmenityModal()">
            <i class="fas fa-plus me-1"></i> Add Amenity
        </button>
    </div>
</div>

<div class="filter-bar fade-in" style="animation-delay: 0.1s;">
    <div class="row align-items-end g-3">
        <div class="col-md-5">
            <label for="searchInput" class="fw-bold text-muted mb-1"><i class="fas fa-search me-1"></i> Search Amenities</label>
            <input type="text" id="searchInput" class="form-control shadow-sm" placeholder="Search by name or description...">
        </div>
        <div class="col-md-3">
            <label for="priceFilter" class="fw-bold text-muted mb-1"><i class="fas fa-filter me-1"></i> Filter by Price</label>
            <select id="priceFilter" class="form-select shadow-sm">
                <option value="all">All Prices</option>
                <option value="free">Free ($0)</option>
                <option value="under10">Under $10</option>
                <option value="10to25">$10 - $25</option>
                <option value="over25">Over $25</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="fw-bold d-block mb-1">&nbsp;</label>
            <button class="btn btn-secondary w-100 fw-bold shadow-sm" onclick="resetFilters()">
                <i class="fas fa-undo me-1"></i> Reset
            </button>
        </div>
        <div class="col-md-2">
            <label class="fw-bold d-block mb-1">&nbsp;</label>
            <button class="btn btn-outline-secondary w-100 fw-bold shadow-sm" onclick="loadAmenities()">
                <i class="fas fa-sync-alt me-1"></i> Refresh
            </button>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-12">
            <small class="text-muted fw-bold border-start border-3 border-primary ps-2" id="resultCount">Loading amenities...</small>
        </div>
    </div>
</div>

<div class="table-responsive shadow-sm fade-in" style="border-radius: 12px; animation-delay: 0.2s;">
    <table class="table table-bordered table-hover mb-0">
        <thead style="background: linear-gradient(135deg, #1a2744 0%, #243356 100%);">
            <tr>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">ID</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Amenity Name</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Description</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Price/Day</th>
                <th class="py-3 text-white" style="border-bottom: 2px solid #c9a84c;">Created</th>
                <th class="py-3 text-white text-center" style="border-bottom: 2px solid #c9a84c;">Actions</th>
            </tr>
        </thead>
        <tbody id="amenitiesTable">
            <tr>
                <td colspan="6" class="text-center py-5">
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="text-muted fw-bold">Loading amenities...</p>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
(function() {
    function waitForjQuery() {
        if (typeof jQuery !== 'undefined') {
            console.log("✅ jQuery loaded, initializing amenities page...");
            initAmenitiesPage();
        } else {
            setTimeout(waitForjQuery, 100);
        }
    }
    
    function initAmenitiesPage() {
        jQuery(document).ready(function($) {
            loadAmenities();
            
            $('#searchInput').on('keyup', function() { filterAmenities(); });
            $('#priceFilter').on('change', function() { filterAmenities(); });
        });
    }
    
    waitForjQuery();
})();

var allAmenities = [];
var uniqueAmenities = [];
var sortAscending = true;

function toggleSortOrder() {
    sortAscending = !sortAscending;
    $('#sortLabel').text(sortAscending ? 'Low to High' : 'High to Low');
    $('#sortBtn i').toggleClass('fa-sort-amount-down fa-sort-amount-up');
    filterAmenities();
}

function loadAmenities() {
    console.log("📋 Loading amenities...");
    jQuery.ajax({
        url: '/api/amenities/list',
        method: 'GET',
        success: function(data) {
            console.log("✅ Amenities data received:", data.length);
            allAmenities = data;
            deduplicateAmenities();
            filterAmenities();
        },
        error: function(xhr, status, error) {
            console.error("❌ Error loading amenities:", error);
            document.getElementById('amenitiesTable').innerHTML = `
                <tr><td colspan="6" class="text-center text-danger py-4 fw-bold">
                    <i class="fas fa-exclamation-triangle me-2"></i>Error loading amenities. Please try again.
                </td></tr>
            `;
        }
    });
}

function deduplicateAmenities() {
    // Remove duplicates - keep only one per amenity name (the first one found)
    const seen = new Set();
    uniqueAmenities = allAmenities.filter(function(amenity) {
        const name = amenity.amenity_name.toLowerCase().trim();
        if (seen.has(name)) {
            return false;
        }
        seen.add(name);
        return true;
    });
}

function filterAmenities() {
    var searchTerm = $('#searchInput').val().toLowerCase();
    var priceFilter = $('#priceFilter').val();
    
    var filtered = uniqueAmenities.filter(function(amenity) {
        if (searchTerm) {
            var nameMatch = amenity.amenity_name.toLowerCase().includes(searchTerm);
            var descMatch = (amenity.description || '').toLowerCase().includes(searchTerm);
            if (!nameMatch && !descMatch) return false;
        }
        
        var price = parseFloat(amenity.price_per_day) || 0;
        if (priceFilter === 'free' && price !== 0) return false;
        if (priceFilter === 'under10' && (price <= 0 || price >= 10)) return false;
        if (priceFilter === '10to25' && (price < 10 || price > 25)) return false;
        if (priceFilter === 'over25' && price <= 25) return false;
        
        return true;
    });
    
    // Sort by price
    filtered.sort(function(a, b) {
        var priceA = parseFloat(a.price_per_day) || 0;
        var priceB = parseFloat(b.price_per_day) || 0;
        return sortAscending ? priceA - priceB : priceB - priceA;
    });
    
    displayAmenities(filtered);
    
    var resultText = filtered.length === uniqueAmenities.length ? 
        'Showing all ' + filtered.length + ' unique amenities' : 
        'Showing ' + filtered.length + ' of ' + uniqueAmenities.length + ' unique amenities';
    $('#resultCount').text(resultText);
}

function displayAmenities(amenities) {
    let html = '';
    
    if (!amenities || amenities.length === 0) {
        html = '<tr><td colspan="6" class="text-center text-muted py-5 fw-bold"><i class="fas fa-search fa-2x mb-3 d-block opacity-50"></i>No amenities found.</td></tr>';
    } else {
        var searchTerm = $('#searchInput').val().toLowerCase();
        
        amenities.forEach(function(amenity, index) {
            var displayName = escapeHtml(amenity.amenity_name);
            var displayDesc = escapeHtml(amenity.description || '-');
            
            if (searchTerm) {
                var regex = new RegExp('(' + searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                displayName = displayName.replace(regex, '<span class="search-highlight">$1</span>');
                displayDesc = displayDesc.replace(regex, '<span class="search-highlight">$1</span>');
            }
            
            var price = parseFloat(amenity.price_per_day) || 0;
            var priceDisplay = price === 0 
                ? '<span class="badge bg-success px-3 py-2"><i class="fas fa-gift me-1"></i>Complimentary</span>' 
                : '<strong class="text-success">$' + price.toFixed(2) + '</strong>';
            
            html += `
                <tr class="fade-in">
                    <td class="align-middle fw-bold text-muted">#${amenity.amenity_id}</td>
                    <td class="align-middle fw-bold text-primary">
                        <i class="fas fa-concierge-bell text-muted me-2"></i>${displayName}
                    </td>
                    <td class="align-middle">${displayDesc}</td>
                    <td class="align-middle">${priceDisplay}</td>
                    <td class="align-middle text-muted small fw-bold">${amenity.created_at ? amenity.created_at.split(' ')[0] : '-'}</td>
                    <td class="align-middle text-center">
                        <div class="btn-group shadow-sm">
                            <button class="btn btn-sm btn-warning px-3" onclick="editAmenity(${amenity.amenity_id})" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger px-3" onclick="deleteAmenity(${amenity.amenity_id})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }
    
    document.getElementById('amenitiesTable').innerHTML = html;
}

function resetFilters() {
    $('#searchInput').val('');
    $('#priceFilter').val('all');
    filterAmenities();
}

function editAmenity(id) {
    jQuery.ajax({
        url: `/api/amenities/get/${id}`,
        method: 'GET',
        success: function(amenity) {
            if (typeof ModalManager !== 'undefined' && ModalManager.showAmenityModal) {
                ModalManager.showAmenityModal(amenity);
            } else {
                alert("Please refresh the page and try again.");
            }
        },
        error: function(xhr, status, error) {
            alert("Error loading amenity details");
        }
    });
}

function deleteAmenity(amenityId) {
    if(confirm('⚠️ Are you sure you want to delete this amenity?\nThis action cannot be undone.')) {
        jQuery.ajax({
            url: `/api/amenities/delete/${amenityId}`,
            method: 'DELETE',
            success: function(response) {
                if(response.success) {
                    if(typeof showNotification === 'function') {
                        showNotification('Amenity deleted successfully!', 'success');
                    } else {
                        alert('Amenity deleted successfully!');
                    }
                    loadAmenities();
                } else {
                    alert('Error: ' + (response.message || 'Could not delete'));
                }
            },
            error: function(xhr, status, error) {
                alert("Error deleting amenity");
            }
        });
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
