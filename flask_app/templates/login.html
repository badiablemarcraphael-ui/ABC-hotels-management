<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hotel - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
    
    <style>
        .forgot-password-link {
            color: #c9a84c;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: color 0.3s ease;
            cursor: pointer;
        }
        .forgot-password-link:hover {
            color: #a88838;
            text-decoration: underline;
        }
        .otp-input-reset {
            width: 50px !important;
            height: 55px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            margin: 0 5px;
            display: inline-block;
        }
        .otp-input-reset:focus {
            border-color: #c9a84c;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
            outline: none;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .step-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #6b7280;
            transition: all 0.3s ease;
        }
        .step-dot.active {
            background: #c9a84c;
            color: #1a2744;
        }
        .step-dot.completed {
            background: #10b981;
            color: white;
        }
        .step-line {
            width: 40px;
            height: 2px;
            background: #e5e7eb;
            align-self: center;
        }
        .step-line.completed {
            background: #10b981;
        }
    </style>
</head>
<body class="auth-page-body">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-hotel"></i>
            <h3>Grand Hotel</h3>
            <p class="text-muted">Please login to continue</p>
        </div>
        
        <div id="alertMessage"></div>
        
        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label><p></p>
                <input type="text" id="username" class="form-control" name="username" 
                       autocomplete="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label><p></p>
                <input type="password" id="password" class="form-control" name="password" 
                       autocomplete="current-password" required placeholder="Enter password">
            </div>
            <div class="text-end mb-3">
                <a class="forgot-password-link" onclick="showForgotPassword()">
                    <i class="fas fa-key me-1 "></i>Forgot Password?
                </a>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div class="register-link">
            <p>New customer? <a href="/register">Register</a></p>
            <p><a href="/landing" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Home</a></p>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <div class="modal-header border-0" style="background: linear-gradient(135deg, #1a2744, #243356); border-radius: 16px 16px 0 0;">
                    <h5 class="modal-title text-white fw-bold">
                        <i class="fas fa-key me-2" style="color: #c9a84c;"></i>Reset Password
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <!-- Step Indicator -->
                    <div class="step-indicator mb-4" id="stepIndicator">
                        <div class="step-dot active" id="stepDot1">1</div>
                        <div class="step-line" id="stepLine1"></div>
                        <div class="step-dot" id="stepDot2">2</div>
                        <div class="step-line" id="stepLine2"></div>
                        <div class="step-dot" id="stepDot3">3</div>
                    </div>
                    <div id="modalAlertMessage"></div>
                    
                    <!-- Step 1: Enter Email -->
                    <div id="step1">
                        <p class="text-muted mb-3">Enter your registered email to receive a password reset code.</p>
                        <div class="mb-3">
                            <label class="fw-bold text-muted mb-1"><i class="fas fa-envelope me-1"></i>Email Address *</label>
                            <input type="email" class="form-control shadow-sm" id="resetEmail" placeholder="your@email.com" required>
                        </div>
                        <button class="btn btn-primary w-100 shadow-sm fw-bold" onclick="sendResetOTP()">
                            <i class="fas fa-paper-plane me-2"></i>Send Reset Code
                        </button>
                    </div>
                    
                    <!-- Step 2: Enter OTP -->
                    <div id="step2" style="display: none;">
                        <p class="text-muted mb-3">Enter the 6-digit code sent to <strong id="otpEmailDisplay2">your email</strong></p>
                        <div class="d-flex justify-content-center gap-2 mb-4" id="resetOtpInputs">
                            <input type="text" class="otp-input-reset" maxlength="1" data-index="0">
                            <input type="text" class="otp-input-reset" maxlength="1" data-index="1">
                            <input type="text" class="otp-input-reset" maxlength="1" data-index="2">
                            <input type="text" class="otp-input-reset" maxlength="1" data-index="3">
                            <input type="text" class="otp-input-reset" maxlength="1" data-index="4">
                            <input type="text" class="otp-input-reset" maxlength="1" data-index="5">
                        </div>
                        <p class="text-center text-muted small">
                            Didn't receive code? 
                            <a href="#" onclick="sendResetOTP()" class="text-primary fw-bold" id="resendResetLink">Resend</a>
                            <span id="resendResetTimer" style="display: none;"> in <span id="timerCountReset">60</span>s</span>
                        </p>
                        <button class="btn btn-primary w-100 shadow-sm fw-bold mt-3" onclick="verifyResetOTP()">
                            <i class="fas fa-check-circle me-2"></i>Verify Code
                        </button>
                    </div>
                    
                    <!-- Step 3: New Password -->
                    <div id="step3" style="display: none;">
                        <p class="text-muted mb-3">Enter your new password.</p>
                        <input type="hidden" id="resetToken">
                        <div class="mb-3">
                            <label class="fw-bold text-muted mb-1"><i class="fas fa-lock me-1"></i>New Password *</label>
                            <input type="password" class="form-control shadow-sm" id="newPassword" placeholder="Min 6 characters" minlength="6" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold text-muted mb-1"><i class="fas fa-lock me-1"></i>Confirm Password *</label>
                            <input type="password" class="form-control shadow-sm" id="confirmPassword" placeholder="Re-enter password" required>
                        </div>
                        <button class="btn btn-success w-100 shadow-sm fw-bold" onclick="resetPassword()">
                            <i class="fas fa-save me-2"></i>Reset Password
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        var resetEmail = '';
        
        // ============ LOGIN ============
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            
            var $btn = $(this).find('button[type="submit"]');
            var originalText = $btn.html();
            $btn.html('<span class="spinner-border spinner-border-sm me-2"></span>Logging in...').prop('disabled', true);
            
            $.ajax({
                url: '/api/users/login',
                method: 'POST',
                data: $(this).serialize(),
                success: function(response) {
                    if(response.success) {
                        window.location.href = '/dashboard';
                    } else {
                        showAlert(response.message, 'error');
                        $btn.html(originalText).prop('disabled', false);
                    }
                },
                error: function() {
                    showAlert('Login failed. Please try again.', 'error');
                    $btn.html(originalText).prop('disabled', false);
                }
            });
        });
        
        // ============ FORGOT PASSWORD ============
        function showForgotPassword() {
            resetToStep(1);
            $('#forgotPasswordModal').modal('show');
        }
        
        function resetToStep(step) {
            $('#step1, #step2, #step3').hide();
            $('#step' + step).show();
            
            // Update step indicator
            $('#stepDot1, #stepDot2, #stepDot3').removeClass('active completed');
            $('#stepLine1, #stepLine2').removeClass('completed');
            
            if (step >= 1) $('#stepDot1').addClass('active');
            if (step >= 2) { $('#stepDot1').removeClass('active').addClass('completed'); $('#stepDot2').addClass('active'); $('#stepLine1').addClass('completed'); }
            if (step >= 3) { $('#stepDot2').removeClass('active').addClass('completed'); $('#stepDot3').addClass('active'); $('#stepLine2').addClass('completed'); }
            
            $('#modalAlertMessage').html('');
        }
        
        // Step 1: Send OTP
        function sendResetOTP() {
            var email = $('#resetEmail').val().trim();
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!email || !emailRegex.test(email)) {
                showModalAlert('Please enter a valid email address', 'error');
                return;
            }
            
            resetEmail = email;
            $('#otpEmailDisplay2').text(email);
            
            var $btn = $('#step1 button');
            var originalText = $btn.html();
            $btn.html('<span class="spinner-border spinner-border-sm me-2"></span>Sending...').prop('disabled', true);
            
            $.ajax({
                url: '/api/users/forgot-password',
                method: 'POST',
                data: { email: email },
                success: function(response) {
                    if (response.success) {
                        showModalAlert('Reset code sent to your email!', 'success');
                        resetToStep(2);
                        setupResetOTPInputs();
                        startResendTimerReset();
                        $('#resetOtpInputs input:first').focus();
                    } else {
                        showModalAlert(response.message || 'Failed to send code', 'error');
                    }
                    $btn.html(originalText).prop('disabled', false);
                },
                error: function() {
                    showModalAlert('Failed to send code. Please try again.', 'error');
                    $btn.html(originalText).prop('disabled', false);
                }
            });
        }
        
        // Step 2: Verify OTP
        function verifyResetOTP() {
            var otp = getResetOTPValue();
            
            if (otp.length !== 6) {
                showModalAlert('Please enter the complete 6-digit code', 'error');
                return;
            }
            
            var $btn = $('#step2 button');
            var originalText = $btn.html();
            $btn.html('<span class="spinner-border spinner-border-sm me-2"></span>Verifying...').prop('disabled', true);
            
            $.ajax({
                url: '/api/users/verify-reset-otp',
                method: 'POST',
                data: { email: resetEmail, otp: otp },
                success: function(response) {
                    if (response.success) {
                        $('#resetToken').val(response.reset_token);
                        showModalAlert('Code verified! Enter your new password.', 'success');
                        resetToStep(3);
                    } else {
                        showModalAlert(response.message || 'Invalid code', 'error');
                        $('#resetOtpInputs input').val('');
                        $('#resetOtpInputs input:first').focus();
                    }
                    $btn.html(originalText).prop('disabled', false);
                },
                error: function() {
                    showModalAlert('Verification failed. Please try again.', 'error');
                    $btn.html(originalText).prop('disabled', false);
                }
            });
        }
        
        // Step 3: Reset Password
        function resetPassword() {
            var newPassword = $('#newPassword').val();
            var confirmPassword = $('#confirmPassword').val();
            var resetToken = $('#resetToken').val();
            
            if (newPassword.length < 6) {
                showModalAlert('Password must be at least 6 characters', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showModalAlert('Passwords do not match', 'error');
                return;
            }
            
            var $btn = $('#step3 button');
            var originalText = $btn.html();
            $btn.html('<span class="spinner-border spinner-border-sm me-2"></span>Resetting...').prop('disabled', true);
            
            $.ajax({
                url: '/api/users/reset-password',
                method: 'POST',
                data: {
                    email: resetEmail,
                    reset_token: resetToken,
                    new_password: newPassword
                },
                success: function(response) {
                    if (response.success) {
                        showModalAlert('Password reset successful! You can now login.', 'success');
                        setTimeout(function() {
                            $('#forgotPasswordModal').modal('hide');
                            $('#resetEmail').val('');
                            $('#newPassword').val('');
                            $('#confirmPassword').val('');
                            $('#loginForm input[name="username"]').focus();
                        }, 2000);
                    } else {
                        showModalAlert(response.message || 'Reset failed', 'error');
                    }
                    $btn.html(originalText).prop('disabled', false);
                },
                error: function() {
                    showModalAlert('Reset failed. Please try again.', 'error');
                    $btn.html(originalText).prop('disabled', false);
                }
            });
        }
        
        // ============ OTP INPUT HELPERS ============
        function setupResetOTPInputs() {
            $('#resetOtpInputs input').off('keyup').on('keyup', function(e) {
                var index = parseInt($(this).data('index'));
                var val = $(this).val();
                
                if (!/^\d*$/.test(val)) { $(this).val(''); return; }
                if (val.length === 1 && index < 5) {
                    $('#resetOtpInputs input[data-index="' + (index + 1) + '"]').focus();
                }
                if (index === 5 && val.length === 1) {
                    setTimeout(function() {
                        if (getResetOTPValue().length === 6) verifyResetOTP();
                    }, 300);
                }
                if (e.key === 'Backspace' && val === '' && index > 0) {
                    $('#resetOtpInputs input[data-index="' + (index - 1) + '"]').focus();
                }
            });
            
            $('#resetOtpInputs input:first').off('paste').on('paste', function(e) {
                e.preventDefault();
                var pasted = (e.originalEvent.clipboardData.getData('text') || '').replace(/\D/g, '').substring(0, 6);
                var inputs = $('#resetOtpInputs input');
                for (var i = 0; i < 6; i++) { $(inputs[i]).val(pasted[i] || ''); }
                if (pasted.length === 6) setTimeout(verifyResetOTP, 300);
            });
        }
        
        function getResetOTPValue() {
            var otp = '';
            $('#resetOtpInputs input').each(function() { otp += $(this).val(); });
            return otp;
        }
        
        function startResendTimerReset() {
            var seconds = 60;
            $('#resendResetLink').hide();
            $('#resendResetTimer').show();
            $('#timerCountReset').text(seconds);
            var timer = setInterval(function() {
                seconds--;
                $('#timerCountReset').text(seconds);
                if (seconds <= 0) {
                    clearInterval(timer);
                    $('#resendResetLink').show();
                    $('#resendResetTimer').hide();
                }
            }, 1000);
        }
        
        // ============ ALERTS ============
        function showAlert(message, type) {
            var alertClass = type === 'error' ? 'danger' : 'success';
            $('#alertMessage').html(`
                <div class="alert alert-${alertClass} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `);
            setTimeout(function() { $('.alert').fadeOut(); }, 4000);
        }
        
        function showModalAlert(message, type) {
            var alertClass = type === 'error' ? 'danger' : 'success';
            $('#modalAlertMessage').html(`
                <div class="alert alert-${alertClass} alert-dismissible fade show py-2" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `);
            setTimeout(function() { $('#modalAlertMessage .alert').fadeOut(); }, 4000);
        }
    </script>
</body>
</html>
